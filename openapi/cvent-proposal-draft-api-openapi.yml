    Transaction:
      description: The latest transaction that took place on a given proposal
      type: object
      title: Transaction
      readOnly: true
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of a specific transaction.
          example: cf5fd2cc-3d09-11ee-be56-0242ac120002
        type:
          $ref: '#/components/schemas/TransactionType'
        time:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          example: '2023-02-12T03:00:00Z'
    PackageType:
      type: string
      title: PackageType
      description: Package type for the proposal.
      enum:
      - ALL_INCLUSIVE
      - COMPLETE_MEETING_PACKAGE
      - DAILY_DELEGATE_RATE
      - DAY_MEETING_PACKAGE
      - HALF_DDR
      - HALF_DMP
      - MODIFIED_MEETING_PACKAGE
      - SLEEPING_ROOM_RATE
      - TWENTYFOUR_HOUR_RATE
    RfpSummary:
      description: Schema for Rfp details associated with this proposal.
      type: object
      title: RfpSummary
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the RFP this proposal is associated with.
          example: 385b9a4c-3f00-4b67-99ca-8dddc82a95b5
    AgendaItemType1:
      type: string
      title: AgendaItemType
      description: The type of Agenda
      enum:
      - BLANK
      - BREAK
      - BREAKOUT
      - GENERAL_SESSION
      - MEETING
      - RECEPTION
      - REGISTRATION
      - SETUP
      - TEARDOWN
      - EXHIBIT
      - BREAKFAST
      - LUNCH
      - DINNER
      - SNACK
      - OTHER
      - OFFICE
      - STORAGE_ROOM
      - HOSPITALITY_DESK
      - HOSPITALITY_SUITE
      - SPEAKER_ROOM
    SleepingRoom1:
      type: object
      title: SleepingRoom
      description: The sleeping room.
      properties:
        proposalDateType:
          $ref: '#/components/schemas/DateType1'
        checkInDate:
          type: string
          format: date
          description: The check in date for attendees.
          example: '2021-01-13'
        checkOutDate:
          type: string
          format: date
          description: The check out date for attendees.
          example: '2021-01-13'
        peakRoomNights:
          type: integer
          minimum: 0
          description: The night during an event when the most sleeping rooms are occupied.
          example: 2
        totalRoomNights:
          type: integer
          description: The total number of room nights available over the entire event.
          minimum: 0
          example: 200
        lowestRate:
          type: number
          description: The lowest room rate offered by the venue.
          example: 140
        maximumRate:
          type: number
          description: The highest room rate offered by the venue.
          example: 200
        lowestAverageDailyRate:
          type: number
          description: The lowest average daily rate.
          example: 140
        highestAverageDailyRate:
          type: number
          description: The highest average daily rate.
          example: 200
        totalRoomCost:
          type: number
          description: The total room cost to attendees.
          example: 300
        budgetedRoomRate:
          type: number
          description: The planner's budgeted room rate.
          example: 135
        lowestAvailableRoomCount:
          type: integer
          description: Minimum number of available rooms.
          example: 10
        highestAvailableRoomCount:
          type: integer
          description: Maximum number of available rooms.
          example: 10
        notes:
          type: string
          maxLength: 2500
          description: Additional notes of the sleeping room.
          example: Premier Suite not available for the selected dates.
        sleepingRoomBlocks:
          type: array
          description: List of sleeping room blocks for this sleeping room type.
          items:
            $ref: '#/components/schemas/SleepingRoomBlock'
    ProposalResponse:
      description: Schema for proposal.
      type: object
      title: Proposal
      allOf:
      - $ref: '#/components/schemas/BaseProposal'
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the proposal.
          example: cf5fd2cc-3d09-11ee-be56-0242ac120002
        proposalCode:
          type: string
          minLength: 14
          maxLength: 14
          description: A 14-character human readable proposal code.
          example: P230810-G7T9DR
        status:
          $ref: '#/components/schemas/ProposalStatus'
        version:
          type: integer
          description: The version number associated with the proposal.
          example: 1
        lastSubmittedTime:
          type: string
          format: date-time
          description: The ISO 8601 zoned Coordinated Universal Time (UTC) when the proposal was last submitted.
          example: '2023-02-12T03:00:00Z'
        responseReason:
          type: string
          description: The reason for the response.
          oneOf:
          - $ref: '#/components/schemas/DeclinedReason'
          - $ref: '#/components/schemas/CancelledReason'
          example: BOOKED_ANOTHER_VENUE_DESTINATION
        responseDetails:
          type: string
          description: Additional details provided while responding to the proposal.
          example: The location is far from the event venue.
      required:
      - id
      - proposalCode
      - status
      - version
    ContactType1:
      type: string
      title: ContactType
      description: The contact types used for the proposal.
      enum:
      - PRIMARY
      - SECONDARY
      default: PRIMARY
    DateType1:
      type: string
      title: DateType
      description: The date types used for the proposal, 'PREFERRED' have the highest priority. Values prefixed with 'ALTERNATE_'
        are decreasing in priority (e.g., ALTERNATE_1 has higher priority than 'ALTERNATE_2 and so on).
      enum:
      - PREFERRED
      - ALTERNATE_1
      - ALTERNATE_2
      - ALTERNATE_3
      - ALTERNATE_4
      - ALTERNATE_5
      - ALTERNATE_6
      - ALTERNATE_7
      - ALTERNATE_8
      - ALTERNATE_9
      - ALTERNATE_10
      - ALTERNATE_11
      - ALTERNATE_12
      default: PREFERRED
    Contact2:
      title: Contact
      description: The contact details.
      type: object
      properties:
        contactType:
          $ref: '#/components/schemas/ContactType1'
        firstName:
          type: string
          maxLength: 50
          description: The first name of the contact.
          example: Saurabh
        lastName:
          type: string
          maxLength: 50
          description: The last name of the contact.
          example: Sachdeva
        organizationWebsite:
          type: string
          format: uri
          description: The URL of the organization's website.
          maxLength: 100
          example: www.cvent.com
        organization:
          type: string
          maxLength: 100
          description: The name of the organization.
          example: Cvent
        title:
          type: string
          description: Designation of the contact.
          maxLength: 50
          example: Co-founder
        email:
          type: string
          maxLength: 300
          format: email
          description: The email address of the contact.
          example: saurabhsachdeva@xyz.com
        countryCode:
          type: string
          maxLength: 25
          description: The country code for the contact's phone number.
          example: '1'
        phone:
          type: string
          description: The phone number of the organization.
          maxLength: 50
          example: '198752236'
        fax:
          type: string
          description: The organization's fax number.
          maxLength: 50
          example: '2487234567'
        mobile:
          type: string
          description: The mobile number of the contact.
          maxLength: 50
          example: '2487649053'
        streetAddress1:
          type: string
          description: Address line 1 of contact's street address.
          maxLength: 255
          example: 299 ABC Street
        streetAddress2:
          type: string
          description: Address line 2 of contact's street address.
          maxLength: 255
          example: Unit 1A
        streetAddress3:
          type: string
          description: Address line 3 of contact's street address.
          maxLength: 255
          example: Seattle, Washington
        city:
          type: string
          maxLength: 100
          description: The city of the contact.
          example: Seattle
        stateProvince:
          $ref: '#/components/schemas/StateProvince'
        postalCode:
          type: string
          maxLength: 30
          description: The postal code of the contact.
          example: '110079'
        country:
          $ref: '#/components/schemas/Country'
        notes:
          type: string
          maxLength: 255
          description: Additional notes of the contact.
          example: Available between 8am - 5pm.
    StatusSummary:
      description: Represents a summary of status associated with this proposal.
      type: object
      title: StatusSummary
      properties:
        reason:
          type: string
          example: Other
          description: Reason provided by the planner for status update
        comment:
          type: string
          example: Not as per requirement
          description: Comment provided by the planner while updating the status of the proposal.
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    ProposalDate:
      type: object
      title: ProposalDate
      description: The proposal date.
      properties:
        dateType:
          $ref: '#/components/schemas/DateType1'
        startDate:
          type: string
          format: date
          description: The start date of the event.
          example: '2021-01-13'
        endDate:
          type: string
          format: date
          description: The end date of the event.
          example: '2021-01-13'
    EstimatedCost:
      type: object
      title: EstimatedCost
      description: The estimated cost
      properties:
        guestRoom:
          type: number
          description: Guest room cost.
          example: 100
        meetingRoom:
          type: number
          description: Meeting room cost.
          example: 10
        foodAndBeverage:
          type: number
          description: Food and beverage cost.
          example: 100
        foodAndBeverageMinimum:
          type: number
          description: Minimum cost for food and beverage.
          example: 10
        notes:
          type: string
          maxLength: 2500
          description: Extra notes on the cost.
          example: Estimated cost includes taxes.
    SleepingRoomType1:
      type: string
      title: SleepingRoomType
      description: Sleeping room type
      enum:
      - ANY
      - SINGLE
      - DOUBLE
      - SUITE
      - STAFF
    BaseProposal:
      description: Schema for proposal request.
      type: object
      title: BaseProposal
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        scpTemplateId:
          format: uuid
          type: string
          example: a633b01c-e461-4cc2-8c66-8ae036115658
          description: The ID of the smart custom proposal template.
        type:
          $ref: '#/components/schemas/ProposalType'
        supplierSummary:
          $ref: '#/components/schemas/SupplierSummary'
        rfpSummary:
          $ref: '#/components/schemas/RfpSummary'
        eventSummary:
          $ref: '#/components/schemas/EventSummary'
        statusSummary:
          $ref: '#/components/schemas/StatusSummary'
        introduction:
          type: string
          maxLength: 2500
          description: Introduction text for the proposal.
          example: Let us design the day of your dreams at our property.
        billingContractualResponse:
          type: string
          maxLength: 2500
          description: Details about concessions or contractual requirements from the supplier. DEPRECATED - This field is
            deprecated. Only applied to proposal made from vendor marketplace, a sunset product.
          example: All invoices must be paid in 30 days.
          deprecated: true
        currencyCode:
          $ref: '#/components/schemas/Currency'
        commissionableBid:
          type: boolean
          description: True indicates this is a commissionable bid.
          example: true
        commissionRate:
          type: number
          description: The proposal's commission rate.
          example: 10.12
        name:
          type: string
          maxLength: 50
          description: Name of the proposal.
          example: Proposal for Royal Bank of Spain.
        blockCode:
          type: string
          maxLength: 50
          description: Block code for the proposal.
          example: ABDCFD-234535-3535
        proposalDates:
          type: array
          description: List of dates the venue is available.
          items:
            $ref: '#/components/schemas/ProposalDate'
        sleepingRooms:
          type: array
          description: List of all sleeping rooms offered in the proposal.
          items:
            $ref: '#/components/schemas/SleepingRoom1'
        categoryItemsCost:
          $ref: '#/components/schemas/CategoryItemsCost'
        aggregatedCost:
          $ref: '#/components/schemas/AggregatedCost'
        estimatedCost:
          $ref: '#/components/schemas/EstimatedCost'
        contacts:
          type: array
          description: List of all contacts.
          items:
            $ref: '#/components/schemas/Contact2'
        plannerContacts:
          type: array
          description: List of all planner contacts.
          items:
            $ref: '#/components/schemas/Contact2'
        meetingRoom:
          $ref: '#/components/schemas/MeetingRoom'
        agendaItems:
          $ref: '#/components/schemas/AgendaItems'
        packages:
          type: array
          description: List of Package Details
          maxItems: 200
          items:
            $ref: '#/components/schemas/Package'
        transaction:
          $ref: '#/components/schemas/Transaction'
    Day:
      title: Day
