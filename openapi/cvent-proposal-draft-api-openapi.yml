    AgendaItem:
      description: The agenda item
      type: object
      title: AgendaItem
      properties:
        name:
          type: string
          maxLength: 50
          description: The name of the agenda item.
          example: Cvent Connect Intro
        number:
          type: integer
          description: Sequence of the agenda item.
          example: 1
        type:
          $ref: '#/components/schemas/AgendaItemType1'
        setup:
          $ref: '#/components/schemas/AgendaItemSetup1'
        sessionType:
          $ref: '#/components/schemas/SessionType'
        startTime:
          type: string
          format: date-time
          description: The start time of the event.
          example: '2021-01-13T14:06:20.080Z'
        endTime:
          type: string
          format: date-time
          description: The end time of the event.
          example: '2021-01-13T14:06:20.080Z'
        requiredRoomSize:
          type: integer
          description: Required size of the room.
          example: 100
        expectedNumberOfPeople:
          type: integer
          description: The expected number of people attending this agenda item.
          example: 500
        roomInfoRequired:
          type: boolean
          description: True indicates room information is required.
          example: true
        roomHoldRequired:
          type: boolean
          description: True indicates room hold is required.
          example: true
        twentyFourHourHoldRequired:
          type: boolean
          description: True indicates room hold is required for twenty four hours.
          example: true
        locatedAtPrimeEventVenue:
          type: boolean
          description: True indicates it is located at prime event venue.
          example: true
        meal:
          $ref: '#/components/schemas/RfpMealType'
        days:
          type: array
          maxItems: 200
          description: Number of days for agenda.
          items:
            $ref: '#/components/schemas/Day'
        roomOptedOut:
          type: boolean
          description: True indicates room is opted out.
          example: true
        audioVideoNeeds:
          type: string
          maxLength: 255
          description: The audio video requirement for the agenda item.
          example: Audio
        notes:
          type: string
          maxLength: 255
          description: Additional note for the agenda item.
          example: Video is good to have for this event.
        meetingRoom:
          type: array
          maxItems: 500
          description: List of meeting rooms.
          items:
            $ref: '#/components/schemas/MeetingRoom'
    SupplierSummary:
      description: Represents a summary of supplier information associated with current proposal.
      type: object
      title: SupplierSummary
      properties:
        supplier:
          description: The supplier associated with current proposal.
          oneOf:
          - $ref: '#/components/schemas/VenueSummary'
          discriminator:
            propertyName: type
            mapping:
              VENUE: '#/components/schemas/VenueSummary'
    MeasurementUnit:
      title: MeasurementUnit
      description: 'Unit of measurement for area or space.


        Values:

        - `SQUARE_FEET` — Square Feet

        - `SQUARE_METERS` — Square Meters'
      type: string
      enum:
      - SQUARE_FEET
      - SQUARE_METERS
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  requestBodies:
    ProposalRequest:
      description: A Proposal request object to create a proposal
