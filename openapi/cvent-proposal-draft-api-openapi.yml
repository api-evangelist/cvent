    AgendaItems:
      description: The agenda items with all agenda items and additional details
      type: object
      title: AgendaItems
      properties:
        items:
          type: array
          maxItems: 200
          description: The list of agenda items.
          items:
            $ref: '#/components/schemas/AgendaItem'
        requiredRoomSizeUnits:
          $ref: '#/components/schemas/MeasurementUnit'
        roomRequirementsMet:
          type: boolean
          description: True indicates room requirements are met.
          example: true
        responseNotes:
          type: string
          maxLength: 255
          description: Response notes from the venue.
          example: We cannot accommodate agenda items starting before 8am.
    Package:
      type: object
      title: Package
      description: The proposal package.
      properties:
        dateType:
          $ref: '#/components/schemas/DateType1'
        checkInDate:
          type: string
          format: date
          description: The ISO 8601 formatted date attendees can check-in.
          example: '2016-10-13'
        availablePackages:
          type: array
          maxItems: 200
          description: List of all available packages from the venue.
          items:
            $ref: '#/components/schemas/AvailablePackage'
        additionalInfo:
          type: string
          maxLength: 255
          description: Additional information about the package.
          example: The offered packages are best-in-class.
        totalPackageCost:
          type: number
          description: Total package cost.
          example: 100
    SupplierType1:
      title: SupplierType
      description: 'The supplier''s type. VENUE: A hotel, convention and visitors bureau (CVB), or other location for an event.'
