openapi: 3.0.2
info:
  title: Cvent REST APIs — Proposal Draft
  version: ea
  description: Beta - All APIs are in Beta. Proposal Drafts are editable copies of proposals. This API allows you to edit
    proposal data privately before publishing.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Proposal Draft
  description: Beta - All APIs are in Beta. Proposal Drafts are editable copies of proposals. This API allows you to edit
    proposal data privately before publishing.
paths:
  /proposal-drafts:
    post:
      summary: Beta - Create Proposal Draft
      description: Creates a new proposal draft.
      operationId: createProposalDraft
      tags:
      - Proposal Draft
      security:
      - OAuth2.clientCredentials:
        - proposal/proposals:write
      requestBody:
        $ref: '#/components/requestBodies/ProposalRequest'
      responses:
        '201':
          description: Successfully created a proposal draft.
          headers:
            location:
              description: URL of proposal draft in edit mode.
              example: https://proposals.app.t2.cvent.com/v1/supplier/proposals/d77306b1-04d5-46ac-ad89-f6d5f47e0c64/edit
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
components:
