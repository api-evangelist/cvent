        '
      operationId: addSpeakerToSession
      tags:
      - Sessions
      requestBody:
        description: Assign a category and order to the session's speaker. If no category is included in the body or the body
          isn't provided, the speaker's default category will be used. Similarly if no order is provided or no body is provided
          the speaker will be placed last in the ordered list of speakers for the session.
