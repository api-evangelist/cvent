components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    program-item-session-document:
      title: ProgramItemSessionDocument
      type: object
      description: Represents a program item object that will be added to a session document.
      required:
      - event
      - session
      - document
      - programItem
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          description: ID of the session document to program item relationship.
          type: string
          format: uuid
          example: 38db6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        event:
          $ref: '#/components/schemas/event-id'
        session:
          $ref: '#/components/schemas/Session-1'
        document:
          $ref: '#/components/schemas/SessionDocumentLite'
        programItem:
          $ref: '#/components/schemas/ProgramItem'
    SessionSpeaker:
      title: SessionSpeaker
      description: A session speaker
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        session:
          $ref: '#/components/schemas/SessionLite'
        category:
          $ref: '#/components/schemas/SpeakerCategory'
        order:
          type: integer
          description: The order of the speaker in a session.
          example: 1
    session-speaker-paginated-response:
      title: SessionSpeakerPaginatedResponse
      description: The response from a request to get the list of session speakers.  This includes the paging object as well
        as the collection of session speakers.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionSpeaker'
          description: Collection of a session's speakers.
    CustomFieldBase:
      title: CustomFieldBase
      description: Base schema for Custom Field - allows type to be customized by extending schemas
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The unique ID representing this custom field.
          format: uuid
        name:
          type: string
          description: The actual text of the custom field.
          example: What is your favorite color?
          readOnly: true
        value:
          type: array
          uniqueItems: true
          items:
            type: string
            description: A question answer value
            maxLength: 16000
          description: The set of answers or possible answers to a question.
          example:
          - Choice C
          - Choice A
        order:
          type: integer
          description: The order of this question in the bigger list of questions.
          example: 1
          readOnly: true
    DocumentId:
      title: DocumentId
      description: The unique identifier for a document.
      type: string
      format: uuid
    program-item-session-documents:
      title: ProgramItemSessionDocuments
      description: Represents an array of session document IDs associated with the given program item ID.
      type: object
      properties:
        data:
          type: array
          description: List of program item session documents.
          items:
            $ref: '#/components/schemas/program-item-session-document'
          maxItems: 10
    session-category:
      title: SessionCategory
      description: This is used to denote the category of a session.
      required:
      - name
      type: object
      properties:
        id:
          title: Session Category Id
          description: A string that represents a specified session category.
          type: string
          format: uuid
          example: 38db6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        name:
          type: string
          description: The name of the session category.
          maxLength: 100
          example: Networking
        description:
          type: string
          description: A description for the session category.
          maxLength: 2500
          example: During networking sessions, come meet fellow workers in your field.
    session-speaker-assignment:
      title: SessionSpeakerAssignment
      type: object
      description: Holds fields that can be applied to a session speaker assignment.
      properties:
        speakerCategory:
          $ref: '#/components/schemas/CategoryId'
        order:
          description: Preferred position where the speaker will appear in an ordered list for a session. Smaller values indicate
            a higher position in the list with the value 1 being the first item in the list.
          example: 1
          minimum: 1
          type: integer
    custom-field:
      title: CustomField
      description: A Custom Field
      type: object
      allOf:
      - $ref: '#/components/schemas/CustomFieldBase'
      properties:
        type:
          description: The type of data collected by a custom field.
          type: string
          allOf:
          - $ref: '#/components/schemas/CustomFieldType'
          - readOnly: true
            example: MultiSelect
    session-locations-paginated-response:
      title: SessionLocationPaginatedResponse
      required:
      - data
      - paging
      type: object
      description: A paginated response of session locations.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/session-location'
          description: Collection of session locations.
    session-segment:
      title: SessionSegment
      type: object
      description: Represents a mapping between a session and an audience segment, which is used to enforce session visibility
        to only those in certain audience segments.
      required:
      - event
      - session
      - segment
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          description: ID of the session segment.
          type: string
          format: uuid
          example: 38db6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        event:
          $ref: '#/components/schemas/event-id'
        session:
          $ref: '#/components/schemas/Session-1'
        segment:
          $ref: '#/components/schemas/Segment1'
        active:
          description: True indicates the session segment is active.
          type: boolean
          example: true
          default: true
    ProgramItem:
      required:
      - id
      type: object
      title: ProgramItem
      description: The program item associated with the session.
      properties:
        id:
          $ref: '#/components/schemas/ProgramItemId1'
    CustomFieldType:
      title: CustomFieldType
      enum:
      - AutoIncrement
      - ConsentQuestion
      - Currency
      - Decimal
      - Date
      - DateTime
      - Email
      - FileUpload
      - FreeText
      - General
      - MultiChoice
      - MultiSelect
      - Number
      - OpenEndedDateTime
      - OpenEndedText
      - SingleChoice
      - SingleSelect
      - USPhoneNumber
      - Unknown
      type: string
      description: The type of data collected by a custom field.
      example: General
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    Lookup:
      title: Lookup
      description: Lookup response object
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        code:
          type: string
          description: Code / Abbreviation of the lookup item.
          maxLength: 30
          example: MU
        name:
          type: string
          description: Name of the lookup item.
          maxLength: 30
          example: Meet up
    session-update:
      title: SessionUpdate
      type: object
      description: Used to update a session.
      allOf:
      - $ref: '#/components/schemas/SessionBase'
    SessionId:
      title: SessionId
      description: The unique identifier for a session.
      type: string
      format: uuid
      example: 832cb481-74c5-4859-ba21-bbb5be8b86e0
    SessionLite:
      required:
      - id
      type: object
      title: SessionLite
      description: The unique identifier of a session.
      properties:
        id:
          $ref: '#/components/schemas/SessionId'
    sessions-paginated-response:
      title: SessionPaginatedResponse
      required:
      - data
      - paging
      type: object
      description: A paginated response of session objects.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/session'
          description: Collection of sessions.
    segment-id:
      title: SegmentId
      description: The unique identifier for an audience segment
      type: string
      format: uuid
      example: 788426ac-5d83-11ee-8c99-0242ac120002
    filter:
      title: A filter sent in the body of a request
      description: A filter which is sent through the body of the request.
      type: object
      properties:
        filter:
          type: string
          example: property eq 'value'
          description: Filter included in the request.
    Location1:
      title: Location
      type: object
      description: Used to denote a locations name and abbreviation.
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        code:
          type: string
          description: Code / Abbreviation of the location.
          maxLength: 30
          example: ConfA
          readOnly: true
        name:
          type: string
          description: Name of the location.
          maxLength: 100
          example: Conference Room A
          readOnly: true
    program-item-document-paginated-response:
      title: ProgramItemDocumentPaginatedResponse
      description: The response from a request to get the list of session program item documents.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/program-item-session-document'
          description: Collection of Session Program Item Documents.
          maxItems: 200
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    SessionBase:
      title: SessionBase
      type: object
      description: Used to denote a session and all of its attributes.
      required:
      - title
      - start
      - end
      - event
      - status
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: A unique identifier of the session
          readOnly: true
        virtual:
          type: boolean
          description: Indicates whether the session is virtual or not.
          example: true
          readOnly: true
        event:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          description: Title of the session. For example, Keynote Session.
          maxLength: 500
          example: Day 1 Keynote Session
        code:
          type: string
          description: A unique code for this session.
          maxLength: 30
          example: R5NP4NJYB3D
        category:
          $ref: '#/components/schemas/NamedObject'
        type:
          type: object
          allOf:
          - deprecated: true
