openapi: 3.0.2
info:
  title: Cvent REST APIs — File
  version: ea
  description: 'Allows you to upload files and get file location using the file ID. File ID can be used with other APIs to
    associate the file to an entity. For example:

    * <a href="#operation/addSessionDoc">Add Document To Session</a>

    * <a href="#operation/addSpeakerDoc">Add Document To Speaker</a>

    * <a href="#operation/assignContactProfileImage">Assign Contact Profile Picture</a>

    * <a href="#operation/updateExhibitorCategoryBanner">Assign Banner to Exhibitor Category</a>

    * <a href="#operation/updateExhibitorBanner">Assign Exhibitor Banner Image</a>

    * <a href="#operation/updateExhibitorLogo">Assign Exhibitor Logo Image</a>

    * <a href="#operation/assignSpeakerProfileImage">Assign Speaker Profile Picture</a>

    '
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: File
  description: 'Allows you to upload files and get file location using the file ID. File ID can be used with other APIs to
    associate the file to an entity. For example:

    * <a href="#operation/addSessionDoc">Add Document To Session</a>

    * <a href="#operation/addSpeakerDoc">Add Document To Speaker</a>

    * <a href="#operation/assignContactProfileImage">Assign Contact Profile Picture</a>

    * <a href="#operation/updateExhibitorCategoryBanner">Assign Banner to Exhibitor Category</a>

    * <a href="#operation/updateExhibitorBanner">Assign Exhibitor Banner Image</a>

    * <a href="#operation/updateExhibitorLogo">Assign Exhibitor Logo Image</a>

    * <a href="#operation/assignSpeakerProfileImage">Assign Speaker Profile Picture</a>

    '
paths:
  /files:
    post:
      tags:
      - File
      operationId: uploadFile
      summary: Upload a File
      description: Uploads a file and returns a unique ID to identify the file. The file must be less than 10MB. The file
        ID can be used with other APIs to associate the file with an entity. Unassociated files expire within 30 days.
      security:
      - OAuth2.clientCredentials:
        - file/file:write
      - OAuth2.authorizationCode:
        - file/file:write
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/fileUpload'
      responses:
        '201':
          description: Successfully uploaded a file.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fileWithAudit'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /files/{id}:
    get:
      parameters:
      - $ref: '#/components/parameters/id12'
      tags:
      - File
      operationId: getFile
      summary: Get File Location
      description: Returns the file upload location for the specified file ID.
      security:
      - OAuth2.clientCredentials:
        - file/file:read
      - OAuth2.authorizationCode:
        - file/file:read
      responses:
        '200':
          description: Successfully retrieved file link.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fileWithAudit'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    fileUpload:
      title: File
      type: object
      description: File Upload Object
      allOf:
      - title: Audit
        description: Audit information
        type: object
        properties:
          created:
            type: string
            format: date-time
            description: The ISO 8601 zoned date time when this record was created.
            readOnly: true
            example: '2017-01-02T02:00:00Z'
          createdBy:
            type: string
            description: The identifier of the user that created this record.
            readOnly: true
            example: hporter
          lastModified:
            type: string
            format: date-time
            description: The ISO 8601 zoned date time when this record was updated.
            readOnly: true
            example: '2019-02-12T03:00:00Z'
          lastModifiedBy:
            type: string
            description: The identifier of the user that last updated this record.
            readOnly: true
            example: hporter
      properties:
        file:
          format: binary
          type: string
          description: 'Allowed File Types: ai, bmp, doc, docx, eml, eps, gif, ics, jpeg, msg, otf, ost, pdf, png, ppt, pptx,
            tif, tiff, ttf, txt, woff, woff2, xls, xlsx'
          example: SGVsbG8sIFdvcmxkIQ==
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    file-link.json:
      title: FileLink
      required:
      - href
      type: object
      description: Represents a link to the associated file resource.
      properties:
        href:
          type: string
          description: A full URL referencing the file
          example: https://custom.t2.cvent.com/35b0fcc5a7194de690f5382a35ac8266/00000000000000000000000000000000/files/universal-file/tmp/99f8f0b0438e4341a90f959785f73f5a.xlsx
    fileWithAudit:
      title: FileWithAudit
      type: object
      description: File object that represents a file uploaded to the platform.
      allOf:
      - title: File
        type: object
        description: File object that represents a file basic metadata details.
        properties:
          id:
            type: string
            format: uuid
            description: Unique Id of a file
            example: 94a18afa-30ad-407e-87c2-526e1e871a82
          friendlyName:
            type: string
            description: Full Name of the file
            example: sample.txt
          path:
            $ref: '#/components/schemas/file-link.json'
          fileSize:
            type: integer
            description: Size of the file in bytes.
            example: 2048
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          deprecated: true
          example: '2019-01-01T00:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          deprecated: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          deprecated: true
          example: '2019-01-01T00:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
          deprecated: true
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
  parameters:
    id12:
      in: path
      name: id
      description: The unique identifier of a file.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
