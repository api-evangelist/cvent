openapi: 3.0.2
info:
  title: Cvent REST APIs — Leads
  version: ea
  description: '* **Leads -** Leads include leads gathered by LeadCapture, Appointments, and Inbound Leads. Use this API to
    get information for the lead and how it was captured.


    * **Lead Qualification Question -** Custom questions created by each exhibitor to qualify a lead. Questions and answers
    are their own endpoints.


    * **Eliterature Requests -** List of E-literature requests data sent to lead.

    '
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Leads
  description: '* **Leads -** Leads include leads gathered by LeadCapture, Appointments, and Inbound Leads. Use this API to
    get information for the lead and how it was captured.


    * **Lead Qualification Question -** Custom questions created by each exhibitor to qualify a lead. Questions and answers
    are their own endpoints.


    * **Eliterature Requests -** List of E-literature requests data sent to lead.

    '
paths:
  /eliterature-requests:
    get:
      summary: List E-literature Requests
      description: Gets a paginated list of eliterature requests data
      operationId: getEliteratureRequests
      tags:
      - Leads
      security:
      - OAuth2.clientCredentials:
        - exhibitor/eliterature-requests:read
      - OAuth2.authorizationCode:
        - exhibitor/eliterature-requests:read
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/after'
      - name: filter
        in: query
        required: false
        description: 'A filter query string narrows search results and supports the combination of logical and comparison
          operators.

          The filter adheres to the pattern filter=''field'' comparisonType ''value''.


          These are the comparison types that can be used in filter expressions:

          * equal: eq


          The following fields are filterable:

          * event.id (eq)

          * exhibitor.id (eq)

          * lead.id (eq)

          '
        schema:
          type: string
          example: event.id eq '{UUID}' and exhibitor.id eq '{UUID}' and lead.id eq '{UUID}'
      responses:
        '200':
          description: Successfully retrieved a paginated list of eliterature requests data.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eliterature-request-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/leads/{leadId}/answers:
    get:
      summary: List Qualification Answers
      description: Gets a list of answers to lead qualification questions for a given lead id.
      operationId: getLeadQualificationAnswers
      tags:
      - Leads
      security:
      - OAuth2.clientCredentials:
        - exhibitor/lead-qualification-answers:read
      - OAuth2.authorizationCode:
        - exhibitor/lead-qualification-answers:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/leadId'
      responses:
        '200':
          description: Successfully retrieved a list of Lead Qualification Answers.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lead-qualification-answers-list-response'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /leads:
    get:
      summary: List Leads
      description: Gets a paginated list of leads
      operationId: getLeads
      tags:
      - Leads
      security:
      - OAuth2.clientCredentials:
        - exhibitor/leads:read
      - OAuth2.authorizationCode:
        - exhibitor/leads:read
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/after'
      - name: filter
        in: query
        required: false
        description: 'A filter query string narrows search results and supports the combination of logical and comparison
          operators.

          The filter adheres to the pattern filter=''field'' comparisonType ''value''.


          These are the comparison types that can be used in filter expressions:

          * equal: eq


          The following fields are filterable:

          * event.id (eq)

          * exhibitor.id (eq)

          * deleted (eq)

          '
        schema:
          type: string
          example: deleted eq 'true' and event.id eq '{UUID}' and exhibitor.id eq '{UUID}'
      responses:
        '200':
          description: Successfully retrieved a paginated list of leads.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leads-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /leads/filter:
    post:
      summary: List Leads
      description: Gets a paginated list of leads
      operationId: getLeadsPostFiltersData
      tags:
      - Leads
      security:
      - OAuth2.clientCredentials:
        - exhibitor/leads:read
      - OAuth2.authorizationCode:
        - exhibitor/leads:read
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/after'
      requestBody:
        description: See the filter query parameter of <a href="#operation/getLeads">GET  Gets a paginated list of leads</a>
          for full filtering information
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filter'
            example:
              filter: id eq '04ca6ae2-0dc3-487b-953e-86d6abbdf7d3' AND attendee.id eq 'edf40757-3bc3-4a66-8180-93bff15b890b'
      responses:
        '200':
          description: Successfully retrieved a paginated list of leads.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leads-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    Answer-1:
      title: Answer
      type: object
      required:
      - type
      description: An object representing the possible answers for lead qualification questions.
      properties:
        type:
          $ref: '#/components/schemas/AnswerType'
        value:
          type: string
          description: 'Answered value like: Choice text, text answer input etc.'
          example: Choice A
        choice:
          $ref: '#/components/schemas/UUID'
    Event4:
      description: The Associated Event.
      title: Event
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 3db28cfc-db22-11eb-8d19-0242ac130003
          description: Event id
    Attendee-1:
      title: Attendee
      type: object
      description: A JSON schema representing the Attendee object
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Attendee id
    ELiteratureRequestDataForLead:
      title: E-literature Request Data for Lead
      type: object
      description: E-literature request data containing event, exhibitor, lead, and documents information.
      required:
      - event
      - exhibitor
      - lead
      - documents
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        lead:
          $ref: '#/components/schemas/Lead-2'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ELiteratureDocument'
          minItems: 1
          maxItems: 25
          description: Collection of E-literature documents sent to lead.
    ELiteratureDocument:
      title: E-literature Document
      type: object
      description: A JSON schema representing an E-literature Document
      required:
      - id
      - displayName
      - type
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Document identifier
        displayName:
          type: string
          example: Marketing Material
          description: Document display name
        type:
          description: Type of eliterature document
          enum:
          - FILE
          - LINK
          type: string
          example: FILE
    eliterature-request-paginated-response:
      title: E-literature Request Paginated Response
      type: object
      description: A paginated response for E-literature requests.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExistingELiteratureRequestDataForLead'
          description: Collection of E-literature request data.
    lead-qualification-answers-list-response:
      title: Lead Qualification Answers List Response
      type: object
      description: A JSON schema representing the response for a list of lead qualification answers.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeadQualificationAnswers'
          description: Collection of Lead Qualification Answers.
    Lead-2:
      title: Lead
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 4e74f930-db22-11eb-8d19-0242ac130003
          description: Lead id
      description: JSON schema for the Lead object
    Lead:
      title: Lead
      type: object
      description: A JSON Schema file for Lead.
      allOf:
      - $ref: '#/components/schemas/Lead-1'
      properties:
        id:
          type: string
          format: uuid
          example: cdd0d110-3a84-4bc5-a420-37c007716c73
          description: ID of Lead.
          readOnly: true
    filter:
      title: A filter sent in the body of a request
      description: A filter which is sent through the body of the request.
      type: object
      properties:
        filter:
          type: string
          example: property eq 'value'
          description: Filter included in the request.
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    ExistingELiteratureRequestDataForLead:
      title: Existing E-literature Request Data for Lead
      type: object
      allOf:
      - $ref: '#/components/schemas/ELiteratureRequestDataForLead'
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Request identifier
          readOnly: true
      description: A JSON Schema for an existing e-literature request data for a lead.
    UUIDProperty:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    LeadQualificationAnswers:
      title: Lead Qualification Answers
      description: This JSON schema file represents lead qualification answers
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Lead Qualification Answer id
        question:
          $ref: '#/components/schemas/UUID'
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        lead:
          $ref: '#/components/schemas/Lead-2'
        answers:
          description: List of answers
          type: array
          items:
            $ref: '#/components/schemas/Answer-1'
    BoothStaff:
      title: Booth Staff
      type: object
      description: A JSON schema representing Booth Staff entity
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Booth Staff id
    UUID:
      title: UUID
      description: The reference to the related entity. Contains only the ID of the related entity.
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDProperty'
    Address-11:
      title: Address
      description: Schema for address information
      type: object
      properties:
        address1:
          type: string
          description: The first line of an address
          example: Cvent Inc.
        address2:
          type: string
          description: The second line of an address
          example: 4001 West Parmer Lane
        city:
          type: string
          description: The name of the city.
          example: Austin
        region:
          type: string
          description: The name of the state/province/region of the address.
          example: Texas
        regionCode:
          type: string
          description: The abbreviation of the state/province/region of the address.
          example: TX
        postalCode:
          type: string
          description: postal code (also known as zipcode) of the address
          example: '78727'
        country:
          type: string
          description: Name of the country for example, 'United States'
          example: United States of America
        countryCode:
          type: string
          description: ISO 3166 two-letter (alpha-2) country code
          example: US
    leads-paginated-response:
      title: LeadsPaginatedResponse
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
          description: Collection of leads.
      description: A paginated response of leads.
    Exhibitor:
      description: The Associated Exhibitor.
      title: Exhibitor
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 4888db54-db22-11eb-8d19-0242ac130003
          description: Exhibitor id
    Device:
      title: Device
      type: object
      description: A JSON object representing an electronic device used to capture leads.
      properties:
        id:
          type: string
          description: The id of device used to capture lead
          example: EKEK993IF9F
        name:
          type: string
          description: The name of device used to capture lead
          example: North Gate
    Lead-1:
      title: Lead
      type: object
      description: Lead object representing a lead captured at an event
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        attendee:
          $ref: '#/components/schemas/Attendee-1'
        boothStaff:
          $ref: '#/components/schemas/BoothStaff'
        device:
          $ref: '#/components/schemas/Device'
        appointment:
          $ref: '#/components/schemas/Appointment1'
        title:
          type: string
          description: The title of the lead
          example: Mr.
        firstName:
          type: string
          description: The first name of the lead
          example: Henry
        lastName:
          type: string
          description: The last name of the lead
          example: Potterfield
        email:
          type: string
          format: email
          description: The email address of the lead
          example: h.potterfield@test.com
        company:
          type: string
          description: The company/organization the lead belongs to.
          example: Cvent Inc
        mobilePhone:
          type: string
          description: Mobile phone number of the lead
          maxLength: 30
          example: 555-555-5555
        homeAddress:
          $ref: '#/components/schemas/Address-11'
        homePhone:
          type: string
          description: Home phone number of the lead
          example: 555-555-5555
        workAddress:
          $ref: '#/components/schemas/Address-11'
        workPhone:
          type: string
          description: Work Phone number of the lead
          example: 555-555-5555
        type:
          description: The type of lead.
          type: string
          default: leadcapture
          enum:
          - leadcapture
          - inbound
          - appointment
        application:
          description: The application used to capture lead.
          type: string
          default: leadcapture
          enum:
          - leadcapture
          - attendeehub_mobile
          - attendeehub_web
          - appointment_app
        source:
          description: The source of entry for the lead
          type: string
          enum:
          - scanned
          - manual
          - business_card_scanned
          - ulc_scanned
          - inbound
          - appointment
        deleted:
          description: A boolean indicating whether a lead is deleted or not
          type: boolean
          default: false
        comments:
          type: string
          description: Comments about the lead
          example: I am interested in your product.
        licenseCode:
          description: License (access code) that was used to capture the lead
          type: string
          example: nag1248
        matched:
          description: A boolean indicating whether the lead is matched or not
          type: boolean
          example: true
        transcriptionStatus:
          description: Current status of business card transcription
          type: string
          enum:
          - pending
          - submitted
          - completed
          - failed
        qualified:
          description: A boolean indicating whether a lead is qualified or not
          type: boolean
          example: true
        additionalBadgekitFields:
          description: Map containing extra properties from badgekit provider
          type: object
    AnswerType:
      title: AnswerType
      enum:
      - Choice
      - Text
      - ChoiceText
      - Other
      - NA
      type: string
      description: Type of answer
      example: File
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    Appointment1:
      title: Appointment
      description: A JSON schema representing the structure of an appointment object.
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Appointment id
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  parameters:
    after:
      name: after
      required: false
      description: Used to query records that have been added or updated after this time point. Default to the beginning of
        time of the data store.
      in: query
      schema:
        type: string
        format: date-time
        example: '2017-01-02T02:00:00Z'
    leadId:
      in: path
      name: leadId
      description: ID of a lead.
      required: true
      schema:
        type: string
        format: uuid
        example: cdd0d110-3a84-4bc5-a420-37c007716c73
    before:
      name: before
      required: false
      in: query
      description: Used to query records that have been added or updated before this time point.
      schema:
        type: string
        format: date-time
        example: '2017-01-02T02:00:00Z'
    token:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    id6:
      in: path
      name: id
      description: ID of an event.
      required: true
      schema:
        type: string
        format: uuid
        example: 3db28cfc-db22-11eb-8d19-0242ac130003
    exhibitorId:
      in: path
      name: exhibitorId
      description: ID of an exhibitor.
      required: true
      schema:
        type: string
        format: uuid
        example: 4888db54-db22-11eb-8d19-0242ac130003
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
