openapi: 3.0.2
info:
  title: Cvent REST APIs — Event Features
  version: ea
  description: EventFeatures related APIs
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Event Features
  description: EventFeatures related APIs
paths:
  /events/{id}/features:
    parameters:
    - $ref: '#/components/parameters/id10'
    get:
      security:
      - OAuth2.clientCredentials:
        - event/event-features:read
      - OAuth2.authorizationCode:
        - event/event-features:read
      summary: List Event Features
      operationId: getEventFeatures
      description: A resource responsible for providing the set of event features that are available for an event
      tags:
      - Event Features
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/locale2'
      - name: filter
        in: query
        required: false
        description: 'Use filter query parameters to limit results

          to data that matches your criteria. See

          [Filters](/docs/rest-api/reference/filters) for details.


          Supported fields and operators are listed below:


          | Field   | Operators |

          |---------|-----------|

          | enabled | `eq`      |

          '
        schema:
          type: string
          example: enabled eq 'true'
      responses:
        '200':
          description: Successfully retrieved event features
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-features-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/features/{type}:
    parameters:
    - $ref: '#/components/parameters/id10'
    - $ref: '#/components/parameters/type'
    put:
      security:
      - OAuth2.clientCredentials:
        - event/event-features:write
      - OAuth2.authorizationCode:
        - event/event-features:write
      summary: Update Event Feature
      operationId: updateEventFeatures
      description: A resource responsible to enable / disable an event feature
      tags:
      - Event Features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/feature-update'
        required: true
      responses:
        '200':
          description: Successfully updated event features
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-features-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/features/{type}/launch:
    parameters:
    - $ref: '#/components/parameters/id10'
    - $ref: '#/components/parameters/launch-feature-type'
    post:
      security:
      - OAuth2.clientCredentials:
        - event/event-features:write
      - OAuth2.authorizationCode:
        - event/event-features:write
      summary: Launch Event Feature
      operationId: launchEventFeatures
      description: Launch event features to make them available to an audience.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event-feature-launch-request'
      tags:
      - Event Features
      responses:
        '204':
          description: Successfully launched event feature.
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/weblinks:
    parameters:
    - $ref: '#/components/parameters/id10'
    get:
      security:
      - OAuth2.clientCredentials:
        - event/weblinks:read
      - OAuth2.authorizationCode:
        - event/weblinks:read
      summary: List Event Weblinks
      description: Gets a paginated list of weblinks for the given event.
      operationId: listEventWeblinks
      tags:
      - Event Features
      parameters:
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/locale2'
      - $ref: '#/components/parameters/limit-100'
      responses:
        '200':
          description: Successfully retrieved a paginated list of event weblinks.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-weblinks-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    event-features-paginated-response:
      title: EventFeaturesPaginatedResponse
      description: Paginated collection of event features.
      required:
      - data
      - paging
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/event-feature.json'
          description: Collection of event features
    feature-tier.json:
      title: FeatureTier
      description: Tier available for the feature
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/tier.json'
        locked:
          type: boolean
          description: If a particular tier is locked to perform any mutation over it
          example: false
        lockReason:
          type: string
          description: Generic message informing tier to be locked due to some feature in use
          example: ''
    pricing-config.json:
      title: PricingConfig
      description: Represents the configuration of the event's pricing feature.
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: True enables pricing for the event.
          example: true
        invoicePrefix:
          type: string
          description: A prefix helps distinguish invoices for this event from those of other events.
          example: EVE001
          maxLength: 6
        revenueGoal:
          type: number
          description: Revenue goal for the event.
          example: 10000
        merchantAccount:
          type: string
          description: Name of the merchant account associated with the event. This merchant account is where all event payments
            are deposited and refunds are withdrawn.
          example: Event merchant account - USD
          default: ''
        currency:
          type: string
          description: The ISO 4217 standard format currency code representing the currency used for event pricing.
          maxLength: 3
          example: USD
        allowedPaymentMethods:
          type: array
          description: Names of allowed payment methods for the merchant account. Not all options are valid for all merchants.
          items:
            $ref: '#/components/schemas/payment-method-type.json'
          uniqueItems: true
          example:
          - Visa
          - Diners Club
          - Mastercard
    pagination-links.json:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/link.json'
        self:
          $ref: '#/components/schemas/link.json'
        prev:
          $ref: '#/components/schemas/link.json'
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    locale.json:
      title: Locale
      description: Locale code
      type: string
      example: en-US
      minLength: 1
      maxLength: 200
    launch-feature-type.json:
      title: LaunchFeatureType
      description: These are the types of features used in the event container events that can be launched.
      type: string
      enum:
      - Website
      - Registration
      example: Registration
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    event-weblinks-paginated-response:
      title: EventWeblinksPaginatedResponse
      description: Paginated collection of event weblinks.
      required:
      - data
      - paging
      type: object
      properties:
        paging:
          type: object
          allOf:
          - properties:
              limit:
                description: The number of records to return on the page, not to exceed 100.
                example: 100
          - $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/event-weblink.json'
          description: Collection of event weblinks.
    event-features-response:
      title: EventFeature
      description: Representation of an event's feature along with its properties
      type: object
      required:
      - type
      - locked
      - enabled
      properties:
        type:
          $ref: '#/components/schemas/feature-type.json'
        enabled:
          type: boolean
          description: If a particular feature is enabled for the event
          example: true
        locked:
          type: boolean
          description: If a particular feature is locked to perform any mutation over it
          example: true
        lockedReason:
          type: string
          description: Generic message informing feature is locked due to some sub-feature/child feature in use
          example: Your event is already using some Registration features
        enabledTier:
          $ref: '#/components/schemas/tier.json'
        availableTiers:
          description: Available feature tiers.
          type: array
          items:
            $ref: '#/components/schemas/feature-tier.json'
        config:
          type: object
          description: Feature configuration.
          anyOf:
          - title: RegistrationFeatureConfig
            description: Denote the configuration for the registration feature.
            type: object
            properties:
              pricing:
                $ref: '#/components/schemas/pricing-config.json'
        weblink:
          type: string
          format: uri
          readOnly: true
          description: URL of the feature's webpage.
          example: https://cvent.me/XX51b9
    event-feature.json:
      title: EventFeature
      description: Representation of an event's feature along with its properties
      type: object
      required:
      - type
      - locked
      - enabled
      properties:
        type:
          $ref: '#/components/schemas/feature-type.json'
        enabled:
          type: boolean
          description: If a particular feature is enabled for the event
          example: true
        locked:
          type: boolean
          description: If a particular feature is locked to perform any mutation over it
          example: true
        lockedReason:
          type: string
          description: Generic message informing feature is locked due to some sub-feature/child feature in use
          example: Your event is already using some Registration features
        enabledTier:
          $ref: '#/components/schemas/tier.json'
        availableTiers:
          description: Available feature tiers.
          type: array
          items:
            $ref: '#/components/schemas/feature-tier.json'
        config:
          type: object
          description: Feature configuration.
          anyOf:
          - $ref: '#/components/schemas/event-features-response/properties/config/anyOf/0'
        weblink:
          type: string
          format: uri
          readOnly: true
          description: URL of the feature's webpage.
          example: https://cvent.me/XX51b9
    paging.json:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/pagination-links.json'
    event-weblink.json:
      title: EventWeblink
      description: Metadata for an event weblink.
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          description: Name of the weblink, used by planners to identify the weblinks in their event.
          example: VIP Registration
        url:
          type: string
          format: uri
          description: Short URL of the webpage.
          example: https://cvent.me/XX51b9
        landingPage:
          type: string
          description: The name of the webpage attendees will be directed to when using the weblink.
          example: Registration
        locale:
          $ref: '#/components/schemas/locale.json'
    event-feature-launch-request:
      title: EventFeaturesLaunchRequest
      description: Event-features launch request parameters.
      type: object
      properties:
        deleteTestData:
          description: True keeps email data collected in test mode, prior to the registration feature being launched.
          type: boolean
          default: false
    payment-method-type.json:
      title: PaymentMethodType
      type: string
      readOnly: true
      description: Denotes acceptable payment methods for merchant accounts. Not all options are valid for all merchants.
      enum:
      - AIRPLUS
      - American Express
      - Aurora
      - Aurore
      - Authorize.Net SIM
      - BCMC
      - Bank Transfer
      - Billy
      - CB
      - Cash
      - Check
      - Cofinoga
      - Corporate Card
      - Credit
      - CyberSource Hosted Order Page
      - CyberSource Secure Acceptance
      - Dankort
      - Diners Club
      - Direct Bill
      - Discover
      - Eurocard Mastercard
      - Invoice
      - JCB
      - Laser
      - Maestro
      - MaestroUK
      - Mastercard
      - Mastercard Debit
      - Money Order
      - NetReserve
      - Other
      - Other 2
      - Other 3
      - P-Card
      - PRIVILEGE
      - Pay.gov
      - PayPal
      - Payment Credits
      - Purchase Order
      - Solo
      - TouchNet
      - UATP
      - UnionPay
      - Visa
      - Visa Debit
      - Visa Electron
      - WPM
      example: Visa
    feature-update:
      title: FeatureUpdate
      description: Representation of an event feature update request
      type: object
      required:
      - type
      - enabled
      properties:
        type:
          $ref: '#/components/schemas/feature-type.json'
        enabled:
          type: boolean
          description: If a particular feature is enabled for the event
          example: true
        enabledTier:
          $ref: '#/components/schemas/tier.json'
        config:
          type: object
          description: Feature configuration.
          anyOf:
          - $ref: '#/components/schemas/event-features-response/properties/config/anyOf/0'
    link.json:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    tier.json:
      title: tier
      description: Represents the type of license that the user can choose.
      type: string
      enum:
      - PRO
      - PREMIER
      - ESSENTIALS
      - BASIC
      - PREMIUM
      example: PREMIER
    feature-type.json:
      title: FeatureType
      description: 'The type of feature available for a container event.


        | Value | Description |

        |-------|-------------|

        | `Website` | Allows you to promote your event with a customizable series of pages. |

        | `Registration` | Allows attendees to sign up for your event ahead of time. Once done, they can modify their details
        or cancel altogether if you allow it. |

        | `OnArrival` | Adds several options designed to make supporting your live event as smooth as possible. |

        | `AttendeeHub` | Delivers the attendee-facing website and mobile app with agenda/content, engagement tools (live
        Q&A, polls, gamification), and networking—launchable independently of registration. |

        | `Appointments` | Enables attendees, exhibitors, and staff to schedule and manage 1:1 meetings within Attendee Hub.
        |

        | `Planning` | Adds new ways to stay organized behind the scenes throughout the entire event process. |

        | `Agenda` | Allows you to manage the breakouts, presentations, or activities (known in Cvent as sessions) that make
        up your event. |

        | `Travel` | Allows you to easily collect and manage invitees'' hotel and flight preferences. |

        | `Marketing` | Allows planners to create, personalize, and automate branded event emails (invites, reminders, confirmations)
        and track performance to drive registrations and engagement. |

        | `Surveys` | Adds a customizable questionnaire you can use to gather feedback. |

        | `Speakers` | Allows you to showcase and manage all the headliners, keynoters, presenters, and moderators contributing
        to your event. |

        | `Exhibitors` | Centralizes exhibitor setup—profiles, tasks, content/categories—and booth staff and LeadCapture management,
        with exhibitor listings and engagement surfaced in Attendee Hub. |

        | `Vendors` | Allows planners to source and manage event services directly from the container event. |

        | `EventAds` | Allows planners to create, place, and track targeted ads across Attendee Hub and the event app. |

        | `EventCredits` | Allows planners to set rules and track credits attendees earn for sessions and the event. Only
        one of `EventCredits` or `CreditsAndCertificates` can be active at a time. |

        | `CreditsAndCertificates` | Allows planners to create credit rules, link them to events and sessions, and award credits
        to attendees. Also enables creating certificates, linking them to credit rules, and awarding them to attendees. Only
        one of `EventCredits` or `CreditsAndCertificates` can be active at a time. |'
      type: string
      enum:
      - Website
      - Registration
      - OnArrival
      - AttendeeHub
      - Appointments
      - Planning
      - Agenda
      - Travel
      - Marketing
      - Surveys
      - Speakers
      - Exhibitors
      - Vendors
      - EventAds
      - EventCredits
      - CreditsAndCertificates
      example: Registration
    Locale:
      title: Locale
      description: Locale code
      type: string
      example: en-US
      minLength: 1
      maxLength: 200
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  parameters:
    locale2:
      name: locale
      required: false
      description: Locale code in IETF Language tag format. Indicates desired locale of return values.
      in: query
      schema:
        $ref: '#/components/schemas/Locale'
    launch-feature-type:
      name: type
      in: path
      description: Event feature to be launched.
      required: true
      schema:
        $ref: '#/components/schemas/launch-feature-type.json'
    limit-100:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 100
        minimum: 1
        type: integer
        default: 100
    token:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    id10:
      in: path
      name: id
      description: Unique Id of an event
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    type:
      name: type
      in: path
      description: String containing event feature type
      required: true
      schema:
        $ref: '#/components/schemas/feature-type.json'
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 100
        example: 100
  securitySchemes:
    OAuth2.clientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials Flow.
      flows:
        clientCredentials:
          tokenUrl: https://api-platform.cvent.com/ea/oauth2/token
          scopes:
            account/hooks:delete: Allows the deletion of hooks.
            account/hooks:read: Allows the reading of hooks.
            account/hooks:write: Allows the creation/updation of hooks.
            account/user-groups:delete: Allows deletion for user groups
            account/user-groups:read: Allows the reading of user groups
            account/user-groups:write: Allows the writing of user groups
            account/users:delete: Allows the deletion of User
            account/users:read: Allows the reading of User, User Group
            account/users:write: Allows the creation/updating of User
            appointments/appointment-attendees:read: Allows the reading of appointment attendees and their related entities.
            appointments/appointment-events:read: Allows the reading of appointment events and their related entities.
            appointments/appointment-types:read: Allows the reading of appointment types and their related entities.
            appointments/appointments:read: Allows the reading of appointment and their related entities.
            appointments/appointments:write: Allows the writing of appointments and their related entities.
            appointments/available-times:read: Allows the reading of availability times.
            appointments/locations:read: Allows the reading of appointment locations and their related entities.
            attendee-insights/attendee-insights:read: Allows the reading of engagement scores (attendee insights).
            attendee-insights/scores:read: Allows the reading of scores.
            attendee-insights/stats:read: Allows the reading of engagement score (attendee insight) stats.
            budget/budget-items:delete: Allows the deletion of budget items
            budget/budget-items:read: Allows the reading of all budget items
            budget/budget-items:write: Allows creation/updation of budget item
            budget/budget-totals:read: Allows the reading of all event budget totals
            budget/budget-vendors:read: Allows reading of account-level budget vendors.
            budget/cards:read: Allows the reading of cards
            budget/currency-conversion-rate:delete: Allows deletion of currency conversion rate for currency.
            budget/currency-conversion-rate:read: Allows reading of currency conversion rate for currency.
            budget/currency-conversion-rate:write: Allows creation/update of currency conversion rate for currency.
            budget/payments:delete: Allows deletion of payments.
            budget/payments:read: Allows reading of payment for budget item.
            budget/payments:write: Allows creation of payment in a budget item.
            budget/transactions:delete: Allows delete card transactions.
            budget/transactions:read: Allows the reading of all card's transactions
            budget/transactions:write: Allows creation of card transactions.
            bulk/bulk-jobs:read: Allows the reading of bulk job related entities
            bulk/bulk-jobs:write: Allows the creation, update and deletion of bulk job related entities
            business-transient/bids:read: Allows the reading of Business Transient Bid data
            business-transient/proposals:read: Allows the reading of Business Transient Proposal data
            business-transient/supplier-brands:read: Allows the reading of a supplier brand or a list of travel supplier brands.
