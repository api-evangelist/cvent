        maxChoice:
          type: number
          description: The maximum number of choices allowed for a multi-choice field.
          example: 10
        minDate:
          type: string
          description: The ISO 8601 minimum date value for a date field.
          example: '1970-12-23'
        maxDate:
          type: string
          description: The ISO 8601 maximum date value for a date field.
          example: '2100-12-31'
        answerTypes:
