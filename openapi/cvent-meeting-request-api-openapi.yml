      type: string
      description: Denotes the type of data collected by a question.
      example: SingleSelect
      readOnly: true
    MeetingRequestQuestion:
      title: MeetingRequestQuestion
      description: A question and its answer for a meeting request. Some questions have fixed, well-known IDs that are the
        same across all accounts. Use the `type` field or the question `id` to determine the format of the `value` array.
      required:
      - id
      - value
      properties:
        id:
          type: string
          description: 'The unique ID of the question. Some questions have fixed, well-known IDs shared across all accounts:

            * Event Country/Region — `da9a6706-7af3-42fc-b2c1-708050a791c1`

            * Requester Country/Region — `d8fa449b-ec97-4e91-8193-b753df11e064`

            * Stakeholder Country/Region — `ddd9035a-44a2-49b0-8d31-66cdca0c13c7`

            * Meeting Room Requirements — `9a224e41-58d9-43a2-ae59-6d1aa16442ce`

            * Sleeping Room Requirements — `cc63aa7c-0800-4fa5-a04b-073793e197f3`

            * Budget Estimates — `1479fb2d-e94c-4bfb-a63f-4af808a22160`'
          format: uuid
          example: f1ea56cd-6860-4f1a-baf7-973118384384
        name:
          type: string
          description: The display text of the question.
          example: What is your favorite color?
          readOnly: true
        type:
          $ref: '#/components/schemas/QuestionType1'
        value:
          type: array
          uniqueItems: true
          items:
            type: string
            example: Green
          description: 'An array of non-null answers to the question. The format of each item depends on the question `type`.


            **Standard questions:** Each item is a plain string (for example, `"Green"`).


            **Country/Region questions (`type: Country`):** Each item is either a country name (for example, `"Canada"`) or
            a country code (for example, `"CA"`). Clients should provide either country names or country codes, but not both
            formats in the same request. See the Country Codes reference for the list of supported country codes and corresponding
            country names.


            **Complex questions (`type: MeetingRoomRequirements`, `SleepingRoomRequirements`, or `BudgetEstimates`):** Each
            item is a JSON-serialized string. See `compositeValue` for the same data in parsed form.'
        answerType:
          $ref: '#/components/schemas/AnswerType1'
        secondaryValue:
          $ref: '#/components/schemas/SecondaryValue'
        compositeValue:
          $ref: '#/components/schemas/CompositeValue'
    CompositeValue:
      title: CompositeValue
      description: 'The structured representation of a complex question answer. Contains the same data as `value`, parsed
        into typed objects instead of JSON-serialized strings. This field is **read-only** — to write complex question answers,
        use `value` instead.


        The structure of the array depends on the question `type`.'
      oneOf:
      - type: array
        title: Meeting Room Requirement Set
        items:
          $ref: '#/components/schemas/MeetingRoomRequirement'
      - type: array
        title: Sleeping Room Requirement Set
        items:
          $ref: '#/components/schemas/SleepingRoomRequirement'
      - type: array
        title: Budget Estimate Set
        items:
          $ref: '#/components/schemas/BudgetEstimate'
      readOnly: true
