    OrderType:
      title: OrderType
      enum:
      - Authorization
      - Online Charge
      - Online Refund
      - Offline Charge
      - Offline Refund
      type: string
      description: This is used to denote the type of order made by an attendee.
      example: Online Refund
    PlanningDocumentReferenceLink:
      title: PlanningDocumentReferenceLink
      description: A reference link contains the URL that provides direct access to download the file for the document. The
        expiration of the URL can be included if applicable.
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL to download the file resource for the document. This URL will expire after the time indicated
            by the field expiration. If not provided, the URL is considered dynamic and not guaranteed to remain constant.
            Clients should always retrieve the latest URL before attempting to download the file, as it may change over time.
          example: https://custom.cvent.com/4B31940730B6475A8D6A7785748A67EE/files/smm/8cfc2168a00342f5ba9e13f7a808df8e/78ce60fbf1da4cf5af139a65f59aed60.pdf
        expiration:
          type: string
          format: date-time
          description: The ISO 8601 formatted date and time at which the reference document will expire if an explicit expiration
            is defined.
          example: '2025-12-31T23:59:59Z'
    OrderRef:
      title: OrderRef
      type: object
      description: Represents an order by its ID and includes the order type.
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: The unique identifier of the order.
        type:
          $ref: '#/components/schemas/OrderType'
    UUID:
      title: UUID
      description: The reference to the related entity. Contains only the ID of the related entity.
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUIDProperty'
    taxes-paginated-response:
      title: TaxesResponse
      required:
      - data
      - paging
      type: object
      description: A response of tax objects.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Tax'
          description: Collection of taxes.
    Address4:
      title: Address
      description: Address details
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseAddress'
      properties:
        region:
          type: string
          description: The name of the state/province/region of the address.
          readOnly: true
          example: Texas
        regionCode:
          type: string
          description: The abbreviation of the state/province/region of the address.
          minLength: 2
          maxLength: 10
          example: TX
        country:
          type: string
          description: Name of the country of the address.
          readOnly: true
          example: United States of America
        latitude:
          type: integer
          description: The geo latitude of the address.
          minimum: -180
          maximum: 180
          example: 30
        longitude:
          type: integer
          description: The geo longitude of the address.
          minimum: -180
          maximum: 180
          example: -97
    Tax:
      title: Tax
      description: A tax is an event-level pricing configuration applied to products such as admission items, sessions, and
        other billable items.
      required:
      - id
      - name
      - active
      - calculateBy
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          type: string
          format: uuid
          description: Tax ID.
          example: 00fe81ea-70e7-4b18-bff5-43167c5720c0
          readOnly: true
        name:
          type: string
          description: Name of the tax.
          example: Sales Tax
        active:
          type: boolean
          description: True indicates that the tax is active.
          default: false
        code:
          type: string
          description: Tax code identifier.
          example: TAX-001
        calculateBy:
          type: string
          enum:
          - PERCENTAGE
          - AMOUNT
          - LOCATION
          description: Determines how the tax is calculated.
        percentage:
          type: number
          description: Tax percentage. Present when calculateBy is PERCENTAGE.
          example: 8.25
        amount:
          type: number
          description: Tax amount. Present when calculateBy is AMOUNT.
          example: 5
        taxSchedule:
          $ref: '#/components/schemas/TaxSchedule'
        generalLedgerCode:
          $ref: '#/components/schemas/AGeneralLedgerCodeUsedToCategorizeFinancialDataWhichHelpsBusinessesAnalyzeAndReportOnTheirFinancialActivity'
    transaction-details-paginated-response:
      title: TransactionDetailsPaginatedResponse
      description: The response from a request to list of transactions. This includes the paging object as well.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/transaction-detail-response'
          description: Collection of transaction details.
    quantity-item:
      title: Quantity Item
      description: Represents a quantity item. A quantity item allows invitees to specify the amount of a particular product,
        such as raffle tickets, t-shirts, or tote bags, they would like to purchase.
      type: object
      required:
      - name
      allOf:
      - $ref: '#/components/schemas/Product'
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier of the quantity item.
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        name:
          type: string
          maxLength: 100
          description: Title of the quantity item.
          example: General Quantity Item
        description:
          type: string
          description: Description of the quantity item.
          maxLength: 2500
          example: Some description of the quantity item.
        code:
          type: string
          maxLength: 30
          description: A planner-specified code for the quantity item. By default, it matches the title.
          example: R5NP4NJYB3D
        maximumItemsPerInvitee:
          type: integer
          minimum: 1
          maximum: 32000
          description: The maximum number of items that an invitee can purchase during registration.
          example: 10
        registrationTypes:
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/RegistrationTypeID'
          description: Contains unique identifiers for registration types associated with this quantity item.
        openForRegistration:
          type: boolean
          description: True indicates the quantity item is selectable during registration.
          example: false
        automaticallyClosesOn:
          type: string
          format: date
          description: The ISO 8601 formatted date when the quantity item registration automatically closes. The item closes
            at the start (12 AM) of the chosen date, according to UTC timezone.
          example: '2022-08-12'
        capacity:
          type: integer
          minimum: 1
          maximum: 999999
          description: The maximum number of attendees who can purchase the quantity item.
          example: 150
        closeEventOnCapacityFull:
          type: boolean
          description: True indicates the event will close if the quantity item reaches capacity.
          example: false
    EventSecurityLevel:
      title: EventSecurityLevel
      description: Represents the security level used for event registrations.
      enum:
      - Private
      - Public
      - Public and Private
      type: string
      readOnly: true
      example: Private
    SessionCheckinBase:
      title: SessionCheckinBase
      description: Base model for a session check-in.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: ID of an attendee to be checked in to a session.
          example: 9463c74e-18c6-401a-a710-ae0f485bf059
        checkOut:
          type: string
          format: date-time
          description: The ISO 8601 zoned date and time when the attendee checked out of a session.
          example: '2018-01-13T02:00:00Z'
        device:
          type: string
          description: Name of the device used for check-in.
          example: Mobile App
        duration:
          type: integer
          description: Duration (in milliseconds) of attendance in the session.
          minimum: 0
          example: 4000
    create-transaction-request:
      title: TransactionDetailCreate
      type: object
      description: Denotes the details of the transaction created for an attendee.
      required:
      - paymentType
      - paymentMethod
      - date
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          readOnly: true
          type: string
          description: A unique ID representing the transaction.
          example: 18549806a69f4727a315f2199a08d8b6
        event:
          $ref: '#/components/schemas/Event'
        attendee:
          $ref: '#/components/schemas/Attendee'
        orders:
          type: array
          description: This denotes the order IDs corresponding to this transaction.
          readOnly: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/Order'
          example:
          - id: 7c4a5acd-9610-4c42-bd10-10e279e69ddc
          - id: b479e85e-b5b0-49e7-9f11-65bad23350b1
          - id: d1c24041-9ca4-4afd-a2f8-a0905d935aa9
        journalNumber:
          readOnly: true
          type: string
          description: Journal number for this transaction. Represents an identifier for the transaction in your bank or ledger.
          maxLength: 18
          example: PZNK2PKZH4N
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        success:
          type: boolean
          description: True indicates the transaction was successful.
          example: true
          readOnly: true
        date:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when attendee made the transaction.
          example: '2018-01-13T02:00:00Z'
        batchNumber:
          type: string
          description: Batch number of this transaction.
          maxLength: 30
          example: 112021-0017
        referenceNumber:
          type: string
          description: Reference number of this transaction.
          maxLength: 30
          example: 112021-0017
        amount:
          type: number
          description: Amount of the transaction. Can only be included in request body if the `partialPayment` query parameter
            is true.
          example: 15.25
        currency:
          type: string
          description: Denotes the currency of this transaction. Currency is determined by the event where the transaction
            is taking place.
          example: EUR
          readOnly: true
        paymentNote:
          type: string
          description: Payment notes about this transaction.
          example: Payment notes
        transactionItems:
          type: array
          description: The list of order items you'll apply the transaction amount towards. Values in the array must sum to
            the `amount` in the request body. Can only be included in the request body if `partialPayment` query parameter
            is true.
          items:
            $ref: '#/components/schemas/TransactionItemCreate'
