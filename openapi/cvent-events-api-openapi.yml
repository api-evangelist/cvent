          example: '78727'
    OrderItem:
      type: object
      description: Represents an order item. Contains only the ID of the order item.
      title: OrderItem
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of the order item.
          example: 6c0e8d1f-8fd6-4ebe-977a-602b4a1f9c43
    RefundPolicy:
      title: RefundPolicy
      description: Refund policy associated to a fee.
      type: object
      properties:
        amount:
          type: number
          example: 50
          description: The total refund amount when the related item is canceled from the attendee's agenda.
        percentage:
          type: number
          example: 50
          description: The total refund percentage when the related item is canceled from the attendee's agenda. Percentage
            is returned only if the refund policy is `RefundByPercentage`.
        type:
          $ref: '#/components/schemas/RefundType'
        cancelByDate:
          type: string
          format: date
          description: Attendees must cancel by this ISO 8601 formatted date to receive the type of refund. Otherwise, nothing
            is refunded.
          readOnly: true
          example: '2020-02-09'
    ContactOptOut:
      title: ContactOptOut
      description: Details of an opt-out for a Contact.
      type: object
      properties:
        optedOut:
          type: boolean
          default: false
          description: Used to denote if a contact has opted-out of receiving system generated emails.
          example: false
        date:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this contact was opted-out. This value can change if the contact
            opts out multiple times.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        by:
          $ref: '#/components/schemas/OptoutBy'
    GeneralLedger:
      title: GeneralLedger
      type: object
      description: This is used to denote the general ledger detail in an order item
      properties:
        id:
          type: string
          format: uuid
          example: a6b6c1bc-e410-48da-86c2-80478ecf60f9
          description: A unique identifier for the general ledger.
        name:
          type: string
          description: This denotes the name of the general ledger.
          maxLength: 50
          example: Other Accounts Receivable
        code:
          type: string
          description: This denotes the code of the general ledger.
          maxLength: 100
          example: '123445'
        description:
          type: string
          description: This denotes the description of the general ledger.
          maxLength: 300
          example: Other Accounts Receivable; Leg. Accounts Receivable
        allocationPercentage:
          type: number
          description: This denotes the percentage allocation of the general ledger code for an order item.
          minimum: 1
          maximum: 100
          example: 50
    BulkResponseItem:
      title: BulkResponseItem
      description: Represents a single item that is returned as part of a Bulk request call.
      type: object
      required:
      - status
      - data
      properties:
        data:
          type: object
          description: The data returned for a single item in the bulk request call.
          example:
            event_id: 1234
            attendee_count: 50
          additionalProperties: true
        status:
          type: integer
          description: http status code representing processing status of a single item
          example: 400
        message:
          type: string
          description: Quick description of what happened with processing
          example: Example error message.
        request:
          type: object
          description: The processed request tied to this response. This field is only sent when processing fails.
          example:
            operation: PUT
            headers:
              header1: header1Value
              header2: header2Value
            queryParams:
              param1: param1Value
              param2: param2Value
          additionalProperties: true
      additionalProperties: false
    RefundType:
      description: 'The type of refund policy for the fee. `RefundByFixedAmount`: Returns a fixed amount to the attendee as
        chosen by the planner. `RefundByCancellationAmount`: Refunds everything to the attendee minus an cancellation fee
        chosen by the planner. `RefundByPercentage`: Refunds a percentage of the amount as chosen by the planner.'
      title: RefundType
      type: string
      enum:
      - RefundByFixedAmount
      - RefundByCancellationAmount
      - RefundByPercentage
      example: RefundByPercentage
    membership-item:
      title: Membership Item
      description: Represents a membership item. Membership items are products that can be purchased during registration or
        on contact websites.
      type: object
      allOf:
      - $ref: '#/components/schemas/Product'
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the membership item.
          example: 976d53c7-e7d6-43b0-9b6e-5422d59c54b1
          readOnly: true
        type:
          type: string
          maxLength: 50
          description: Planner specified type or category of membership being offered.
          example: Gold Membership
        item:
          type: string
          maxLength: 50
          description: The specific membership item or product name within the membership type.
          example: Annual Gold Membership Package
        contactType:
          description: The contact type associated with this membership item.
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: The contact type id associated with this membership item.
              example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d4
        price:
          type: number
          example: 100
          description: The price charged when an invitee purchases a membership.
        renewalPrice:
          type: number
          example: 100
          description: The price charged when an invitee renews their membership.
        description:
          type: string
          description: Description of the membership item.
          maxLength: 2500
          example: Access to exclusive webinars and networking events for Gold members.
        code:
          type: string
          maxLength: 8
          description: A planner-specified code for the membership item.
          example: R5NP4NJYB3D
        registrationTypes:
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/RegistrationTypeID'
          description: Contains unique identifiers for registration types associated with this membership item.
        openForRegistration:
          type: boolean
          description: True indicates the membership item is selectable during registration.
          example: false
        automaticClosureDate:
          type: string
          format: date
          description: The ISO 8601 formatted date when the membership item registration automatically closes. The item closes
            at the start (12:00 AM) of the chosen date, according to the UTC timezone.
          example: '2026-08-12'
        generalLedger:
          $ref: '#/components/schemas/GeneralLedger2'
        currency:
          type: string
          description: The ISO 4217 currency code for this membership item.
          example: EUR
          readOnly: true
          maxLength: 3
    link.json:
