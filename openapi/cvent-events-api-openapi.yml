    event:
      title: Event
      description: Represents an event.
      type: object
      required:
      - title
      - format
      - planners
      - timezone
      - languages
      - type
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the event.
          example: 9463c74e-18c6-401a-a710-ae0f485bf059
          readOnly: true
        title:
          type: string
          description: Title of the event being organized.
          maxLength: 300
          example: Cvent Connect 2020
        code:
          type: string
          description: A system-generated code for this event.
          maxLength: 18
          readOnly: true
          example: R5NP4NJYB3D
        virtual:
          type: boolean
          description: True indicates the event is virtual. DEPRECATED - Refer to the 'format' field for the 'virtual' indicator.
          example: true
          deprecated: true
          readOnly: true
        format:
          $ref: '#/components/schemas/EventFormat'
        description:
          type: string
          description: Detailed description of the event.
          maxLength: 20000
          example: Cvent annual user conference.
        start:
          type: string
          format: date-time
          description: The ISO 8601 formatted date and time when the event starts.
          example: '2020-02-03T13:00:00.000Z'
        end:
          type: string
          format: date-time
          description: The ISO 8601 formatted date and time when the event ends.
          example: '2020-02-07T17:00:00.000Z'
        closeAfter:
          type: string
          format: date-time
          description: The event will be closed for registration after this ISO 8601 formatted date and time.
          example: '2020-02-01T23:59:00.000Z'
          readOnly: true
        archiveAfter:
          type: string
          format: date-time
          description: The event will be archived after this ISO 8601 formatted date and time.
          example: '2020-05-07T12:00:00.000Z'
          readOnly: true
        launchAfter:
          type: string
          format: date-time
          description: The event will launch after this ISO 8601 formatted date and time. If the event has not yet launched,
            this field shows a date of 1/1/1900.
          example: '2020-01-07T12:00:00.000Z'
          readOnly: true
        timezone:
          type: string
          description: List of supported [timezones](/docs/rest-api/reference/api-standards#time-zones).
          maxLength: 29
          example: America/New_York
        venues:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Venue1'
          description: Collection of venues.
        showVenueLocation:
          type: boolean
          description: True indicates the venue location is visible to guests for essential events. If used with other event
            types, the request returns a 400 error.
        showPointOfContact:
          type: boolean
          description: True indicates the venue location is visible to guests for essential events. If used with other event
            types, the request returns a 400 error.
        phone:
          type: string
          description: The phone number for the event.
          maxLength: 13
          example: 555-555-5555
          readOnly: true
        note:
          type: string
          description: Event note created by planners for internal use.
          maxLength: 300
          example: This event will need some coordination with external systems.
        defaultLocale:
          type: string
          description: The event default locale using the IETF language tag format.
          maxLength: 35
          example: en-US
          readOnly: true
        languages:
          type: array
          uniqueItems: true
          maxItems: 32
          items:
            type: string
            example: en-US
          description: List of IETF language tags enabled for the event. This field supports reading multiple language tags
            but supports writing only one language to an event.
        currency:
          type: string
          description: The ISO 4217 standard format currency code used of this event.
          maxLength: 3
          example: USD
          readOnly: true
        registrationSecurityLevel:
          $ref: '#/components/schemas/EventSecurityLevel'
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        eventStatus:
          $ref: '#/components/schemas/EventStatus'
        planningStatus:
          type: string
          description: The planner-created planning status for this event. Used for internal tracking purposes.
          maxLength: 50
          example: Submitted
          readOnly: true
        testMode:
          type: boolean
          description: True indicates the event is in test mode.
          example: false
          readOnly: true
        capacity:
          type: integer
          description: The maximum amount of attendees that can attend the event. Only used for events with the registration
            feature.
          example: 50
          readOnly: true
        planners:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Planner1'
          description: A collection of contacts representing the event planners.
        stakeholders:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Stakeholder'
          description: A collection of contacts representing event stakeholders.
          readOnly: true
        customFields:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/custom-field'
          description: Collection of custom fields.
        category:
          type: object
          deprecated: true
          readOnly: true
          description: The category to which this event belongs (no longer supported).
          allOf:
          - $ref: '#/components/schemas/Lookup'
        type:
          $ref: '#/components/schemas/EventType1'
        _links:
          $ref: '#/components/schemas/EventLinks'
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        meetingRequestId:
          type: string
          format: uuid
          description: The identifier of the meeting request related to the event, if any.
          readOnly: true
          example: b566c24e-12a8-452d-c490-ad0e796be093
        createdBy:
          type: string
          maxLength: 100
          description: The name of the user who created the event.
          readOnly: true
          example: John Doe
        lastModifiedBy:
          type: string
          maxLength: 100
          description: The name of the user who last modified the event.
          readOnly: true
          example: Jane Doe
