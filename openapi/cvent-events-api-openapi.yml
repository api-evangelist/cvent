    delete:
      security:
      - OAuth2.clientCredentials:
        - event/session-enrollment:delete
      - OAuth2.authorizationCode:
        - event/session-enrollment:delete
      summary: Delete Session Registration
      description: 'Unregister an attendee from a session. Requires the modify registration widget

        to be present on the event''s registration path. See the following

        [article](https://support.cvent.com/s/communityarticle/Modifying-Registrations#modifyown)

        for more information.

        '
      operationId: deleteSessionEnrollment
      tags:
      - Events
      responses:
        '204':
          description: Successfully unregistered the attendee from the session.
          headers: {}
