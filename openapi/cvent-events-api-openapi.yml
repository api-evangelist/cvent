  /sessions/attendance:
    get:
      security:
      - OAuth2.clientCredentials:
        - event/session-attendance:read
      - OAuth2.authorizationCode:
        - event/session-attendance:read
      summary: Session Attendance
      description: Get a paginated list of session attendance.
      operationId: listSessionsAttendance
      parameters:
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - name: filter
        in: query
        required: false
        description: 'A filter query string narrows search results and supports the combination of logical and comparison
          operators. The filter adheres to the pattern filter=''field'' comparisonType ''value''.


          There are eight comparison types that can be used in filter expressions:

          * equal: eq

          * not equal: ne

          * greater than: gt

          * greater or equal: ge

          * less than: lt

          * less than or equal: le

          * starts with: sw

          * contains a value: contains


          The following fields are filterable:

          * id (eq|ne)

          * event.id (eq|ne)

          * attendee.id (eq|ne)

          * session.id (eq|ne)

          * deleted (eq|ne)

          * created (eq|ne|lt|le|gt|ge)

          * lastModified (eq|ne|lt|le|gt|ge)'
        schema:
          type: string
          example: id eq '1ffa56d9-9f60-4b8c-8b3b-3451de21293c::2ffa56d9-9f60-4b8c-8b3b-3451de21293c'
      tags:
      - Events
      responses:
        '200':
          description: Successfully retrieved a paginated list of sessions attendance.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sessions-checkin-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /sessions/enrollment:
    get:
      security:
      - OAuth2.clientCredentials:
        - event/session-enrollment:read
      - OAuth2.authorizationCode:
        - event/session-enrollment:read
      summary: List Session Registrants
      description: 'Gets registrant data for sessions. The returned data depends on the individual session type.

        - **Optional Sessions:** Provides a paginated list of attendees registered for the session.

        - **Included Session:** Provides a paginated list of attendees who have participated or marked as no-shows. It does
        not list all registered attendees.

        '
      operationId: listSessionsEnrollment
      parameters:
      - $ref: '#/components/parameters/after_inclusive'
      - $ref: '#/components/parameters/before_inclusive'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - name: filter
        in: query
        required: false
        description: "A filter string passed in the body of the request, narrows search results and supports the combination\
          \ of logical and comparison operators.\nThe filter adheres to the pattern filter='field' comparisonType 'value'.\n\
          These are the comparison types that can be used in filter expressions:\n  * equal: eq\n  * not equal: ne\n  * greater\
          \ than: gt\n  * greater or equal: ge\n  * less than: lt\n  * less than or equal: le\n\nThe following fields are\
          \ filterable:\n  * id (eq|ne)\n  * event.id (eq|ne)\n  * attendee.id (eq|ne)\n  * session.id (eq|ne)\n  * status\
          \ (eq|ne)\n  * deleted (eq|ne)\n  * created (eq|ne|lt|le|gt|ge)\n  * lastModified (eq|ne|lt|le|gt|ge)\n"
        schema:
          type: string
          example: id eq '1ffa56d9-9f60-4b8c-8b3b-3451de21293c::2ffa56d9-9f60-4b8c-8b3b-3451de21293c'
      tags:
      - Events
      responses:
        '200':
          description: Successfully retrieved a paginated list of sessions registrants.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sessions-enrollment-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /sessions/enrollment/filter:
    post:
      security:
      - OAuth2.clientCredentials:
        - event/session-enrollment:read
      - OAuth2.authorizationCode:
        - event/session-enrollment:read
      summary: List Session Registrants
      description: "Gets registrant data for sessions. The returned data depends on the individual session type.   - **Optional\
        \ Sessions:** Provides a paginated list of attendees registered for the session.   - **Included Session:** Provides\
        \ a paginated list of attendees who have participated or been\n  marked as no-shows. It does not list all registered\
        \ attendees.\n\nThis method will return the same data as [GET List Session Registrants](#operation/listSessionsEnrollment)\
        \  but allows for longer filters.\n"
      operationId: listSessionsEnrollmentPostFilter
      requestBody:
        description: 'The request body accepts filters to refine the data returned.  Refer to available filter details in
          [GET List Session Registrants](#operation/listSessionsEnrollment).

          '
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filter'
            example:
              filter: id eq '1ffa56d9-9f60-4b8c-8b3b-3451de21293c::2ffa56d9-9f60-4b8c-8b3b-3451de21293c'
      parameters:
      - $ref: '#/components/parameters/after_inclusive'
      - $ref: '#/components/parameters/before_inclusive'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      tags:
      - Events
      responses:
        '200':
          description: Successfully retrieved a paginated list of sessions registrant.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sessions-enrollment-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /sessions/{id}/attendance/{attendeeId}:
    parameters:
    - $ref: '#/components/parameters/sessionId4'
    - $ref: '#/components/parameters/attendeeId4'
    delete:
      security:
      - OAuth2.clientCredentials:
        - event/session-attendance:write
      - OAuth2.authorizationCode:
        - event/session-attendance:write
      summary: Del Session Check-in
      description: Deletes the attendance of an attendee in a session.
      operationId: deleteSessionAttendance
      tags:
      - Events
      responses:
        '204':
          description: Successfully removed session attendance for an attendee.
