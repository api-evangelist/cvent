      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /sessions/{id}/enrollment/{attendeeId}:
    parameters:
    - $ref: '#/components/parameters/sessionId4'
    - $ref: '#/components/parameters/attendeeId4'
    post:
      security:
      - OAuth2.clientCredentials:
        - event/session-enrollment:write
      - OAuth2.authorizationCode:
        - event/session-enrollment:write
      summary: Create Session Registration
      description: 'Register an attendee in the given session. Requires the modify registration widget to be

        present on the event''s registration path. See the following

        [article](https://support.cvent.com/s/communityarticle/Modifying-Registrations#modifyown) for

        more information.

        '
      operationId: createSessionEnrollment
      tags:
      - Events
      responses:
        '204':
          description: Successfully registered the attendee in the given session.
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
