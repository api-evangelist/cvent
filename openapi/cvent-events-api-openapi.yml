components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    invitation-list-paginated-response:
      title: InvitationListPaginatedResponse
      required:
      - data
      - paging
      description: Return a response object containing paginated data for the invitation list(s).
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json1'
        data:
          type: array
          items:
            $ref: '#/components/schemas/invitation-list.json'
          description: Collection of invitation list objects.
    transaction-items-paginated-response:
      title: TransactionDetailsPaginatedResponse
      description: The response from a request to list of transactions. This includes the paging object as well.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/transaction-item-response'
          description: Collection of transaction details.
    RegistrationType1:
      title: RegistrationType
      description: Represents the details of a registration type.
      type: object
      required:
      - openForRegistration
      properties:
        name:
          type: string
          description: Name of the registration type.
          maxLength: 50
          readOnly: true
          example: Member
        code:
          type: string
          description: Code for this registration type.
          maxLength: 30
          readOnly: true
          example: MemberCode
        description:
          type: string
          description: Detailed description of the registration type.
          maxLength: 2500
          readOnly: true
          example: Registration type assigned to invitees who are members
        virtual:
          type: boolean
          description: True indicates the registration type is virtual.
          example: true
          readOnly: true
        openForRegistration:
          type: boolean
          description: True indicates the registration type can be chosen for registration.
          example: true
        automaticOpenDate:
          type: string
          format: date-time
          description: The ISO 8601 formatted date-time (in UTC) the registration type automatically opens for registration.
          example: '2017-01-02T02:00:00Z'
        automaticEndDate:
          type: string
          format: date-time
          description: The ISO 8601 formatted date-time (in UTC) the registration type automatically closes for registration.
          example: '2017-01-02T02:00:00Z'
        event:
          description: Event associated with the registration.
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: The unique identifier of the event.
              example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
    Attendee2:
      type: object
      description: The reference to the attendee. Contains only the ID of the attendee.
      title: Attendee
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: Attendee ID.
          example: 5b0e8d1f-8fd6-4ebe-977a-602b4a1f9c43
    transaction-item-response:
      title: TransactionItem
      type: object
      description: This is used to denote an item in the transaction.
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          type: string
          format: uuid
          example: 9455d69e-fb6e-4ce8-9414-5587c90fd557
          description: An identifier for the transaction. This is shared across all items in the transaction and is not unique.
            If a unique ID is required, use `uniqueId` instead.
        uniqueId:
          type: string
          description: A unique identifier for the transaction item.
          example: 9a8b7c6d-e5f4-3210-bacd-3456789012de::7f3e2a1b-c4d5-6789-efab-2345678901bc
        transaction:
          $ref: '#/components/schemas/TransactionId'
        event:
          $ref: '#/components/schemas/Event'
        attendee:
          $ref: '#/components/schemas/Attendee'
        product:
          $ref: '#/components/schemas/ProductOrderItem'
        orderItem:
          $ref: '#/components/schemas/OrderItemRef'
        name:
          type: string
          description: This denotes the name of the item
          maxLength: 100
          example: Dinner Session
        amount:
          type: number
          description: Transaction amount of the item
          example: 15.25
        currency:
          type: string
          description: This denotes the currency of this transaction
          example: EUR
    VoucherCapacity:
      title: Voucher Capacity
      description: Represents the capacity details for a voucher, including the total allowed redemptions and the number already
        redeemed.
      type: object
      required:
      - total
      - redeemedCount
      properties:
        total:
          type: integer
          description: The maximum number of times the voucher can be redeemed. Default value of -1 indicates unlimited capacity.
          example: 100
          minimum: -1
          maximum: 999999
        redeemedCount:
          type: integer
          description: The number of times the voucher has already been redeemed.
          example: 42
    Product:
      title: Product
      description: Represents a product. Products are items that can be purchased during registration.
      type: object
      properties:
        registrantInformation:
          type: string
          maxLength: 1000
          description: This text will be displayed in emails using the registration information widget.
          example: Registrant Note.
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    CustomFieldType:
      title: CustomFieldType
      enum:
      - AutoIncrement
      - ConsentQuestion
      - Currency
      - Decimal
      - Date
      - DateTime
      - Email
      - FileUpload
      - FreeText
      - General
      - MultiChoice
      - MultiSelect
      - Number
      - OpenEndedDateTime
      - OpenEndedText
      - SingleChoice
      - SingleSelect
      - USPhoneNumber
      - Unknown
      type: string
      description: The type of data collected by a custom field.
      example: General
    ExistingRegistrationTypeWithAssociatedRegPath:
      title: ExistingRegistrationTypeWithAssociatedRegPath
      description: Represents the details of an existing registration type and registration path associated to it.
      type: object
      required:
      - id
      allOf:
      - $ref: '#/components/schemas/registration-type-response'
      properties:
        registrationPath:
          $ref: '#/components/schemas/AssociatedRegistrationPath'
    voucher:
      title: Voucher
      description: Represents a voucher configured for an event. Event-level vouchers are special codes that can be assigned
        to invitees or attendees, enabling benefits such as free registration, discounted pricing, or other promotional entitlements
        during the registration process.
      type: object
      required:
      - id
      - code
      properties:
        id:
          type: string
          format: uuid
          description: Voucher ID.
          example: 1800c9bd-b5f4-438a-a92c-ea1f59553a5c
          readOnly: true
        code:
          type: string
          maxLength: 30
          description: The unique planner-defined code that invitees enter during registration to redeem the voucher.
          example: VIP-100
        description:
          type: string
          maxLength: 250
          description: A description of the voucher and its intended use.
          example: VIP full-comp voucher for keynote attendees.
        alertEmailAddress:
          type: string
          format: email
          description: The email address that receives a notification whenever the voucher is redeemed.
          example: planner@example.com
        capacity:
          $ref: '#/components/schemas/VoucherCapacity'
        lastModifiedBy:
          type: string
          description: The identity of the user or system that last modified the voucher.
          example: planner@example.com
        lastModifiedDate:
          type: string
          format: date-time
          description: The ISO 8601 formatted date and time when the voucher was last modified, expressed in UTC.
          example: '2026-04-08T02:05:12.000Z'
    send-email-status.json:
      title: Send Email Status
      enum:
      - Sent
      - In-Progress
      - Error
      - Opted-Out
      type: string
      description: It is used to denote the status of the sent email.
      example: Accepted
    Document:
      title: document
      description: The base model for the document metadata.
      type: object
      required:
      - id
      properties:
        id:
          description: Unique identifier of the document.
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
          description: Name of the document.
          example: Agenda
        size:
          type: integer
          description: Size of the document in bytes
          example: 204800
        uploaded:
          type: string
          format: date-time
          description: The ISO-8601 formatted date and time when the document was uploaded.
          example: '2024-06-15T13:45:30Z'
        uploadedBy:
          type: string
          description: The user who uploaded the document.
          example: John Doe
        lastModified:
          type: string
          format: date-time
          description: The ISO-8601 formatted date and time when this document was last updated.
          example: '2024-10-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The user who last updated the document.
          example: John Doe
    BillingAddress:
      title: Billing Address
      description: Billing Address Details
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseAddress'
      properties:
        region:
          type: string
          description: The name of the state/province/region of the address.
          maxLength: 50
          example: Texas
        regionCode:
          type: string
          description: The abbreviation of the state/province/region of the address.
          minLength: 2
          maxLength: 10
          example: TX
    DonationItem1:
      title: Donation Item
      description: Represents a donation item. Donation items give event invitees the option to contribute money to an association,
        charity, or cause during registration.
      type: object
      allOf:
      - $ref: '#/components/schemas/Product'
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier of the donation item.
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        name:
          type: string
          maxLength: 100
          description: Title of the donation item.
          example: General Donation Item
        description:
          type: string
          description: Description of the donation item.
          maxLength: 2500
          example: Some description of the donation item.
        code:
          type: string
          maxLength: 30
          description: A planner-specified code for the donation item. By default, it matches the title.
          example: R5NP4NJYB3D
        minimumAmountAllowedPerInvitee:
          type: number
          minimum: 0.1
          maximum: 999999999
          description: The minimum amount of money an invitee can donate during registration. Donations are in the event currency.
          example: 1
        maximumAmountAllowedPerInvitee:
          type: number
          minimum: 0.1
          maximum: 999999999
          description: The maximum amount of money an invitee can donate during registration. Donations are in the event currency.
          example: 5
        generalLedger:
          $ref: '#/components/schemas/GeneralLedger2'
        registrationTypes:
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/RegistrationTypeID'
          description: Contains unique identifiers for registration types associated with this donation item.
        openForRegistration:
          type: boolean
          description: True indicates the donation item is selectable during registration.
          example: false
        automaticallyClosesOn:
          type: string
          format: date
          description: The ISO 8601 formatted date when the donation item registration automatically closes. The item closes
            at the start (12 AM) of the chosen date, according to UTC timezone.
          example: '2022-08-12'
    filter:
      title: A filter sent in the body of a request
      description: A filter which is sent through the body of the request.
      type: object
      properties:
        filter:
          type: string
          example: property eq 'value'
          description: Filter included in the request.
    fee-items-paginated-response:
      title: FeeItemsResponse
      required:
      - data
      - paging
      type: object
      description: A response of fee item objects.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeeItem'
          description: Collection of fee items.
    event-copy:
      title: EventCopy
