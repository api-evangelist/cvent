        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /sessions/{id}/check-in:
    parameters:
    - $ref: '#/components/parameters/sessionId4'
    post:
      tags:
      - Events
      operationId: sessionCheckIn
      security:
      - OAuth2.clientCredentials:
        - event/session-attendance:write
      - OAuth2.authorizationCode:
        - event/session-attendance:write
      summary: Session Check-In
      description: Check-in attendees to a session based on the attendee IDs provided in the body of the request.
      requestBody:
        description: Attendees to be checked-in. Up to **100 attendees** can be checked-in per call.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/session-bulk-checkin'
        required: true
      responses:
        '207':
          description: Attendee(s) successfully checked-in to the session.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attendee-add-bulk-response1'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    put:
      tags:
      - Events
      operationId: updateSessionCheckIn
      security:
      - OAuth2.clientCredentials:
        - event/session-attendance:write
      - OAuth2.authorizationCode:
        - event/session-attendance:write
      summary: Update Session Check-In
      description: Update check-in details of attendees in a session based on the attendee IDs provided in the body of the
        request.
      requestBody:
        description: Attendee check-in to be updated. Up to **100 attendees** can be updated per call.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/session-checkin-bulk-update'
        required: true
      responses:
        '207':
          description: Successfully updated check-in details of attendees in a session.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attendee-add-bulk-response1'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
