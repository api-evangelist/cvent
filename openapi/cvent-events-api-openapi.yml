              IDs can be matched to registration type details by comparing IDs returned in [List Registration Types](#operation/listRegistrationTypes).
          example:
          - a64b648e-b7b0-4031-8f8a-8d5e0919b936
          - f590f1ee-6c54-4b01-90e6-d701748f0851
    PaymentType-1:
