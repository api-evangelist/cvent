    AttendeeBase:
      title: AttendeeBase
      description: Model representing an attendee to be added or updated to an event. The status determines if this is an
        registration or an invite.
      type: object
      required:
      - event
      properties:
        event:
          type: object
          properties:
            id:
              description: The event ID.
              type: string
              format: uuid
              example: 0a955598-376e-43d4-a796-91d6d5f41e3f
          description: The ID of the event associated with the attendee.
        contact:
          type: object
          properties:
            id:
              description: The contact ID.
              type: string
              format: uuid
              example: ea66a709-2a93-4fa0-8b83-cf4f62df9dc3
          description: The ID of the address book contact associated with the attendee.
        invitationList:
          type: object
          properties:
            id:
              description: The invitation list ID.
              type: string
              format: uuid
              example: 06da38f9-12da-4cb6-a581-7a5954f8e0e2
          description: The ID of the invitation list associated with the attendee.
        referenceId:
          type: string
          description: The reference ID of an attendee. A planner determined string used to track which link attendee's used
            to reach the event registration.
          maxLength: 100
          example: refid-marketingwebsite
        note:
          type: string
          description: A planner created note for an attendee, used to track details about the attendee.
          maxLength: 300
          example: Would like to sit near the front of the room for sessions.
        administrator:
          type: object
          properties:
            id:
              description: The administrator contact ID.
              type: string
              format: uuid
              example: 7949c335-b5b2-46cf-8f5d-f6b21795df51
          description: The ID of the administrator contact whom registered this attendee.
        unsubscribed:
          type: boolean
          description: True indicates this attendee is unsubscribed from this event's emails. They'll still receive emails
            triggered by their own actions (like registration modification). This field is read-only; to update an attendee's
            subscription status, use [PUT /attendees/{id}/email-subscriptions](#operation/updateAttendeeSubscriptionStatus).
          example: false
          readOnly: true
        admissionItem:
          type: object
          properties:
            id:
              description: The admission item ID.
              type: string
              format: uuid
              example: 7949c335-b5b2-46cf-8f5d-f6b21795df51
          description: The ID of the attendee's admission item. Required when registering, updating a registered attendee,
            or cancelling an attendee.
        visibility:
          $ref: '#/components/schemas/AttendeeVisibility'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeAnswer'
          description: The list of answers to the attendee's registration questions.
        sendEmail:
          type: boolean
          description: True indicates a confirmation email should be sent to the attendee. Cancelled attendees will not receive
            emails as a result of this field. If this field is left blank, the event settings for confirmation emails will
            apply.
          example: false
