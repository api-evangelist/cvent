    existing-duration:
      title: Duration
      description: An existing duration.
      required:
      - id
      type: object
      allOf:
      - title: Duration
        description: The amount of time that the attendee was engaged (in person or virtually) in a session or watching a
          video.
        required:
        - event
        - session
        - attendee
        - firstSeen
        - lastSeen
        - duration
        type: object
        allOf:
        - $ref: '#/components/schemas/duration/allOf/0'
        properties:
          event:
            $ref: '#/components/schemas/uuid.json'
          session:
            $ref: '#/components/schemas/uuid.json'
          attendee:
            $ref: '#/components/schemas/uuid.json'
          firstSeen:
            type: string
            format: date-time
            description: The earliest date and time when the attendee was seen, in ISO 8601 format.
            example: '2020-02-03T13:00:00.000Z'
          lastSeen:
            type: string
            format: date-time
            description: The latest date and time when the attendee was seen, in ISO 8601 format.
            example: '2020-02-03T13:00:00.000Z'
          deleted:
            type: boolean
            description: A duration record is deleted if marked as recanted by the algorithm after determining the initial
              information has changed
            example: false
            readOnly: true
          type:
            enum:
            - RFID
            - OA
            - EDIT
            - LIVE
            - ON_DEMAND
            - API
            - MANUAL
            - IMPORT
            - EVENTAPP
            type: string
            description: Describes how the duration was obtained.
            example: API
            readOnly: true
          durationType:
            enum:
            - session
            - appointment
            - exhibitor
            type: string
            description: The target entity for which the duration was collected.
            example: session
            readOnly: true
          duration:
            type: integer
            description: 'The amount of time (in milliseconds) than the attendee was engaged (in person or virtually) in a
              session or watching a video. Note: Duration is calculated based on the time the attendee spent in the session,
              not just on when they were first and last seen'
            example: 300000
      properties:
        id:
          type: string
          description: internal id
          example: ce359543-61f5-492d-b8de-875c3473e8ae_@_0ca2e0af-166b-48fa-b976-980c34e21e82_@_5c068898-3b72-452d-919f-2c046441339f
          readOnly: true
