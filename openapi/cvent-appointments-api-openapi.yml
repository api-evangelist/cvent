      - OAuth2.clientCredentials:
        - appointments/appointments:read
      - OAuth2.authorizationCode:
        - appointments/appointments:read
      summary: Get Appointment
      description: Gets a single appointment by its ID.
      operationId: getAppointmentById
      responses:
        '200':
          description: Successfully retrieved an appointment.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appointment-with-questions'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          description: Response 429 is required for public operations with rate limiting
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    appointment-availability-time-range.json:
      title: AppointmentAvailabilityTimeRange
      description: Time range for an appointment availability.
      type: object
      properties:
        start:
          type: string
          description: The ISO 8601 formatted start datetime of the time range, in the event's timezone.
          example: '2020-04-01T19:00:00.000'
        end:
          type: string
          description: The ISO 8601 formatted end datetime of the time range, in the event's timezone.
          example: '2020-04-01T20:00:00.000'
        type:
          $ref: '#/components/schemas/appointment-availability-type.json'
    uuid.json:
      title: UUID
      description: The reference to the related entity. Contains only the ID of the related entity.
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
    appointment-event-id.json:
      type: object
      description: Represents an appointment event ID.
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of an appointment event.
          readOnly: true
          example: 2d8234f1-55df-483c-abe3-7e2cb98f8275
    appointment-meeting-interest.json:
      title: AppointmentMeetingInterest
      type: object
      description: An individual meeting interest.
      properties:
        name:
          type: string
          description: The name of the exhibitor in which interest is expressed.
          example: Cvent
        exhibitor:
          $ref: '#/components/schemas/uuid.json'
        ranking:
          type: string
          description: The strength of the interest.
          example: '5'
        meetingType:
          type: string
          description: The meeting type of interest.
          example: Group Meeting
        comment:
          type: string
          description: A comment about this interest.
          example: A 1:1 or group meeting works.
    custom-field.json:
      title: CustomField
      description: A Custom Field
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The unique ID representing this custom field.
          format: uuid
        name:
          type: string
          description: The actual text of the custom field.
          example: What is a your favorite color?
          readOnly: true
        type:
          description: The type of data collected by a custom field.
          type: string
          allOf:
          - title: CustomFieldType
            enum:
            - AutoIncrement
            - ConsentQuestion
            - Currency
            - Decimal
            - Date
            - DateTime
            - Email
            - FileUpload
            - FreeText
            - General
            - MultiChoice
            - MultiSelect
            - Number
            - OpenEndedDateTime
            - OpenEndedText
            - SingleChoice
            - SingleSelect
            - USPhoneNumber
            - Unknown
            type: string
            description: The type of data collected by a custom field.
            example: General
          - readOnly: true
            example: MultiSelect
        value:
          type: array
          uniqueItems: true
          items:
            type: string
            description: A question answer value
          description: The set of answers or possible answers to a question.
          example:
          - Choice C
          - Choice A
        order:
          type: integer
          description: The order of this question in the bigger list of questions.
          example: 1
          readOnly: true
    pagination-links.json:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/link.json'
        self:
          $ref: '#/components/schemas/link.json'
        prev:
          $ref: '#/components/schemas/link.json'
    available-time.json:
      title: Available Times
      description: Time availability for an event appointment,
      type: object
      required:
      - id
      - startTime
      - endTime
      - type
      - appointmentType
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID representing the time range.
          example: 0046e875-79a5-4851-8332-da105d58088a
        startTime:
          type: string
          format: date-time
          description: The ISO 8601 formatted start date/time of the time slot in UTC.
          example: '2019-04-12T15:15:00.000Z'
        endTime:
          type: string
          format: date-time
          description: The ISO 8601 formatted end date/time of the time slot in UTC.
          example: '2019-04-12T15:30:00.000Z'
        type:
          $ref: '#/components/schemas/time-range-type.json'
        appointmentType:
          $ref: '#/components/schemas/uuid.json'
        location:
          $ref: '#/components/schemas/uuid.json'
        availableAppointments:
          type: integer
          description: The number of appointments that can be created in this time range. -1 indicates unlimited appointments.
          example: 2
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    appointment-event-type.json:
      title: AppointmentEventType
      enum:
      - STANDARD
      - UNIVERSAL
      - PLANNER_COORDINATED
      - SIMPLE
      type: string
      description: 'Denotes the type of appointment event.<br/>STANDARD: You or attendees can manage schedules based on the
        permissions and settings you choose.<br/>UNIVERSAL: Your staff manages their schedules with attendees, at an event
        your staff is attending.<br/>PLANNER_COORDINATED: You manage attendee schedules for your event based on their preferences.<br/>SIMPLE:
        Import appointments or let attendees schedule them without any restrictions or prior setup.'
      example: STANDARD
    appointment-status.json:
      title: AppointmentStatus
      enum:
      - ACTIVE
      - CONFIRMED
      - CANCELLED
      - PENDING_APPROVAL
      - DENIED
      - PENDING
      - PENDING_ASSIGNMENT
      - PENDING_HOST_ASSIGNMENT
      - PENDING_APPROVAL_AND_ASSIGNMENT
      - TENTATIVE
      type: string
      description: Denotes the status of an appointment.
      example: CONFIRMED
    participant-type.json:
      title: ParticipantType
      enum:
      - Host
      - Attendee
      type: string
      description: Denotes if a participant is a host or attendee of an appointment.
      example: Attendee
    attendee-appointment-meeting-interests-paginated-response:
      title: AttendeeAppointmentMeetingInterestsPaginatedResponse
      type: object
      description: The response for a request of appointment meeting interests, including paging information.
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/attendee-appointment-meeting-interest'
          description: Collection of appointment meeting interests.
    appointment-availability-type.json:
      title: AppointmentAvailabilityType
      type: string
      enum:
      - AVAILABLE
      - UNAVAILABLE
      description: Denotes whether an availability time range represents when an attendee is available or unavailable.
      example: AVAILABLE
    update-appointment-request:
      title: Update Appointment Request
      description: A request to update an appointment.
      type: object
      required:
      - id
      - subject
      - startTime
      - endTime
      - hosts
      allOf:
      - $ref: '#/components/schemas/create-appointment-request/allOf/0'
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the appointment to be updated.
          example: a3d77c44-bb4b-41dd-9c37-18230cc66ce4
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    attendee-appointment-meeting-interest:
      title: AttendeeAppointmentMeetingInterest
      type: object
      description: An attendee's meeting interests for an event.
      properties:
        id:
          type: string
          description: The unique ID of this meeting interest.
          example: 0cdfa3f7-05da-4121-857b-d7732891e01a::52a68001-70ce-4ec4-a6fe-d0888123c715
        attendee:
          title: attendee
          type: object
          description: The appointment attendee the meeting interest is associated to.
          properties:
            id:
              type: string
              description: The unique ID representing the appointment attendee.
              example: 0cdfa3f7-05da-4121-857b-d7732891e01a::52a68001-70ce-4ec4-a6fe-d0888123c715
        appointmentEvent:
          $ref: '#/components/schemas/uuid.json'
        interests:
          type: array
          items:
            $ref: '#/components/schemas/appointment-meeting-interest.json'
          description: An array describing each of the attendee's meeting interests for the given appointment event.
        created:
          type: string
          format: date-time
          description: The ISO 8601 formatted date/time when the meeting interest was created.
          example: '2019-04-01T17:00:00.000Z'
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 formatted date/time when the object was last modified.
          example: '2019-04-01T17:00:00.000Z'
        deleted:
          type: boolean
          description: True indicates the record is deleted.
          example: true
    planner.json:
      title: Planner
      description: Represents a planner for an appointment event and the planner's related details.
      type: object
      properties:
        firstName:
          type: string
          description: The first name of the planner.
          maxLength: 30
          example: Henry
        lastName:
          type: string
          description: The last name of the planner.
          maxLength: 50
          example: Potterfield
        email:
          type: string
          format: email
          description: The email address of the planner.
          minLength: 6
          maxLength: 80
          example: h.potterfield@test.com
        company:
          type: string
          description: The company/organization the planner belongs to.
          minLength: 1
          example: Cvent Inc.
        title:
          type: string
          description: The job title of the planner.
          maxLength: 100
          example: Event Planner
        prefix:
          type: string
          description: Denotes what is traditionally a title of an individual.
          maxLength: 30
          example: Mr.
    appointment-type.json:
      title: Appointment Type
      type: object
      required:
      - id
      - name
      - category
      - timeRangeType
      description: This is used for storing details of an appointment type.
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID representing the appointment type.
          example: 0046e875-79a5-4851-8332-da105d58088a
        name:
          type: string
          description: The name of the appointment type.
          example: Event Appointment
        category:
          $ref: '#/components/schemas/appointment-type-category.json'
        timeRangeType:
          $ref: '#/components/schemas/time-range-type.json'
    participant-response.json:
      title: ParticipantResponse
      enum:
      - CONFIRMED
      - TENTATIVE
      - PENDING
      - DECLINED
      type: string
      description: Denotes a participant response to an appointment.
      example: CONFIRMED
    appointment-types-paginated-response:
      title: Appointment Types Paginated Response
      type: object
      description: The response for a request of appointment types configured for scheduling appointments.
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/appointment-type.json'
          description: The collection of appointment types object.
    time-range-type.json:
      title: Time Range Type
      enum:
      - DEFINED
      - FLEXIBLE
      type: string
      description: 'DEFINED: Appointments of this type can be created at time intervals and locations created by the planner.
        FLEXIBLE: Appointments of this type can be created any time on the schedule in a custom location of the host''s choosing
        or within time intervals and locations created by the planner.'
      example: DEFINED
    appointment-attendee-paginated-response:
      title: AppointmentAttendeePaginatedResponse
      description: The response from a request to get the list of appointment attendees, including paging information.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/appointment-attendee'
          description: Collection of appointment attendees and their related details.
    appointment-event-paginated-response:
      title: AppointmentEventPaginatedResponse
      description: The response from a request to get the list of appointment events, includes the paging object.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/appointment-event'
          description: Collection of appointment events and their related details.
    audit.json:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    paging.json:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/pagination-links.json'
    appointment-type-category.json:
      title: Appointment Type Category
      enum:
      - CUSTOM_APPOINTMENT
      - EXHIBITOR_NETWORKING
      - SELF_SIGN_UP
      type: string
      description: The category of the appointment type.
      example: CUSTOM_APPOINTMENT
    participant-status.json:
      title: ParticipantStatus
      enum:
      - pending
      - pending_proposed
      - confirmed
      - declined
      - cancelled
      - tentative
      type: string
      description: Denotes the status of a participant in an appointment.
      example: confirmed
    appointment-with-questions:
      title: Appointment With Questions
      description: Details of an event appointment including questions.
      type: object
      required:
      - id
      - name
      - start
      - end
      - type
      - participant
      allOf:
      - title: Appointment
        description: Details of an event appointment.
        type: object
        required:
        - id
        - name
        - start
        - end
        - type
        - participant
        allOf:
        - title: Appointment Base
          description: Base entity for an appointment
          type: object
          required:
          - id
          - name
          - start
          - end
          - type
          - participant
          properties:
            id:
              type: string
              format: uuid
              description: The unique ID representing the appointment.
              readOnly: true
              example: 0046e875-79a5-4851-8332-da105d58088a
            code:
              type: string
              description: The unique appointment code in Cvent or unique reference id of an appointment in the external systems.
              minLength: 1
              maxLength: 36
              example: APPT-0001
              pattern: ^[a-zA-Z0-9-.%]+$
            name:
              type: string
              description: The name of the appointment.
              example: Meeting with Cvent
            description:
              type: string
              description: The description of the appointment.
              example: Discuss about marketing.
            start:
              type: string
              format: date-time
              description: The ISO 8601 formatted start date/time of the appointment.
              example: '2019-04-12T15:20:00.000Z'
            end:
              type: string
              format: date-time
              description: The ISO 8601 formatted end date/time of the appointment.
              example: '2019-04-12T15:30:00.000Z'
            status:
              $ref: '#/components/schemas/appointment-status.json'
            location:
              type: object
              description: The location of the appointment.
              properties:
                name:
                  type: string
                  description: The name of the location.
                  example: Hynes Convention Center
            type:
              type: object
              description: The type of the appointment.
              properties:
                name:
                  type: string
                  description: The name of the appointment type.
                  example: Customer Meeting
        - $ref: '#/components/schemas/audit.json'
        properties:
          appointmentEvent:
            $ref: '#/components/schemas/uuid.json'
          participants:
            type: array
            items:
              $ref: '#/components/schemas/appointment-participant.json'
            description: Collection of attendees participating in this appointment, and their related details.
          autoAcceptAttendees:
            type: boolean
            description: True indicates participants will be automatically marked as accepted for the appointment.
            example: false
          enforceScheduleRules:
            type: boolean
            description: True indicates that existing schedule rules were enforced when the appointment was created.
            example: false
          modified:
            type: string
            format: date-time
            description: This field is deprecated please use - lastModified
            deprecated: true
            example: '2019-04-12T15:30:00.000Z'
          deleted:
            type: boolean
            description: True indicates the appointment has been logically deleted.
            example: false
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/custom-field.json'
          description: Collection of custom questions asked to participants of the appointment.
    locations-paginated-response:
      title: Locations Paginated Response
      type: object
      description: The response for a request of locations for scheduling appointments.
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/location.json'
          description: Collection of appointment locations and their associated details.
    location.json:
      title: Location
      type: object
      description: Details of a location.
      allOf:
      - title: Location
        type: object
        required:
        - id
        - name
        description: Details of a location.
        properties:
          id:
            type: string
            format: uuid
            description: The unique ID representing the location.
            example: 0046e875-79a5-4851-8332-da105d58088a
          name:
            type: string
            description: The name of the location.
            example: Conference Room B
      properties:
        parentLocation:
          $ref: '#/components/schemas/location.json/allOf/0'
        capacity:
          type: integer
          description: The number of attendees that can be accommodated in this location. -1 indicates unlimited capacity.
          example: 5
    appointment-attendee:
      title: AppointmentAttendee
      description: Attendee for an event appointment.
      type: object
      required:
      - id
      - contact
      - appointmentEvent
      properties:
        id:
          type: string
          description: The unique ID representing the attendee.
          readOnly: true
          example: 0cdfa3f7-05da-4121-857b-d7732891e01a::52a68001-70ce-4ec4-a6fe-d0888123c715
        code:
          type: string
          description: System generated code for this attendee appointment.
          maxLength: 11
          readOnly: true
          example: GKNNHYW9GFV
        appointmentEvent:
          $ref: '#/components/schemas/uuid.json'
        contact:
          $ref: '#/components/schemas/uuid.json'
        registration:
          $ref: '#/components/schemas/uuid.json'
        created:
          type: string
          format: date-time
          description: The ISO 8601 formatted date/time when the appointment attendee was created.
          example: '2019-04-01T17:00:00.000Z'
        modified:
          type: string
          format: date-time
          description: The ISO 8601 formatted date/time when the appointment attendee was last modified.
          example: '2019-04-01T17:00:00.000Z'
        deleted:
          type: boolean
          description: True indicates the appointment attendee has been logically deleted.
          example: false
    appointment-paginated-response:
      title: AppointmentPaginatedResponse
      description: The response for a request of appointments, including the paging object.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/appointment-with-questions/allOf/0'
          description: Collection of appointments and their related details.
    appointment-participant.json:
      title: AppointmentParticipant
      description: An appointment participant.
      type: object
      required:
      - attendee
      - type
      x-extends:
        $ref: '#/components/schemas/audit.json'
      allOf:
      - $ref: '#/components/schemas/audit.json'
      properties:
        attendee:
          type: object
          description: Reference information for the attendee.
          properties:
            id:
              type: string
              description: The unique ID representing the attendee.
              readOnly: true
              example: 0cdfa3f7-05da-4121-857b-d7732891e01a::52a68001-70ce-4ec4-a6fe-d0888123c715
            contact:
              $ref: '#/components/schemas/uuid.json'
          example:
            id: dd1057b9-a957-4c22-be88-741a29d01471/97f2ca58-0f9e-401f-a6b5-a6f20d3a9568
            contact:
              id: 97f2ca58-0f9e-401f-a6b5-a6f20d3a9568
        type:
          $ref: '#/components/schemas/participant-type.json'
        response:
          $ref: '#/components/schemas/participant-response.json'
        participation:
          type: object
          description: The attendee's participation status.
          properties:
            participated:
              type: boolean
              description: True indicates the attendee was marked as a participant in the appointment.
              example: true
          example:
            participated: true
        questionViewer:
          type: boolean
          description: True indicates custom questions are visible to appointment participant.
          example: false
        privateNoteViewer:
          type: boolean
          description: True indicates private notes are visible to the appointment participant.
          example: false
        deleted:
          type: boolean
          description: True indicates the participant was removed from the appointment.
          example: false
        status:
          $ref: '#/components/schemas/participant-status.json'
    venue-address.json:
      title: Venue Address
      description: Venue Address details
      type: object
      allOf:
      - title: Base Address
        description: Base Address Model
        type: object
        properties:
          address1:
            type: string
            maxLength: 40
            description: The first line of an address.
            example: Cvent Inc.
          address2:
            type: string
            maxLength: 40
            description: The second line of an address.
            example: 4001 West Parmer Lane
          address3:
            type: string
            maxLength: 40
            description: The third line of an address.
            example: PO Box 123
          city:
            type: string
            maxLength: 40
            description: The name of the city.
            example: Austin
          countryCode:
            type: string
            maxLength: 3
            minLength: 2
            description: ISO 3166 two-letter (alpha-2) country code.
            example: US
          postalCode:
            type: string
            maxLength: 25
            description: Postal code (also known as zipcode) of the address.
            example: '78727'
      properties:
        region:
          type: string
          description: The name of the state/province/region of the address.
          readOnly: true
          example: Texas
        regionCode:
          type: string
          description: The abbreviation of the state/province/region of the address.
          minLength: 2
          maxLength: 10
          example: TX
        country:
          type: string
