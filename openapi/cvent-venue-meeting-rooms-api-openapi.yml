      - CONFERENCE
      - CRESCENT_ROUNDS
      - E_SHAPE
      - HOLLOW_SQUARE
      - MAXIMUM_CAPACITY
      - PERIMETER_SEATING
      - ROYAL_CONFERENCE
      - TALK_SHOW
      - THEATER
      - T_SHAPE
      - U_SHAPE
