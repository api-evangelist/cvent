openapi: 3.0.2
info:
  title: Cvent REST APIs — Venue Meeting Rooms
  version: ea
  description: Manage meeting rooms for a venue, including creating and updating room details, configuring capacities and
    amenities, and associating images.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Venue Meeting Rooms
  description: Manage meeting rooms for a venue, including creating and updating room details, configuring capacities and
    amenities, and associating images.
paths:
  /venues/{venueId}/meeting-rooms:
    post:
      operationId: createMeetingRoom
      summary: Create Meeting Room
      description: Create a new meeting room for the specified venue.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-rooms:write
      - OAuth2.clientCredentials:
        - venue/meeting-rooms:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/meetingRoom'
      tags:
      - Venue Meeting Rooms
      responses:
        '201':
          description: Meeting room created successfully.
          headers:
            Location:
              description: URL of the newly created meeting room.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existingMeetingRoom'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/meeting-rooms/overviews:
    get:
      operationId: listMeetingRoomsOverviews
      summary: List Meeting Rooms Overviews
      description: Retrieve a paginated list of meeting room overviews for the specified venue.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-room-overviews:read
      - OAuth2.clientCredentials:
        - venue/meeting-room-overviews:read
      parameters:
      - $ref: '#/components/parameters/venueId'
      - name: limit
        in: query
        required: false
        description: The maximum number of records to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
        example: 100
      - name: token
        in: query
        required: false
        description: The continuation token returned from a previous request. This must be a valid UUID v4 if provided. This
          will override any other pageable parameters provided.
        schema:
          type: string
          format: uuid
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
      - name: filter
        in: query
        required: false
        description: 'Use filter query parameters to limit results to data that matches your criteria. See [Filters](/docs/rest-api/reference/filters)
          for details. Supported fields and operators are listed below:


          * `hiddenOnProfile` (`eq`)

          '
        schema:
          type: string
        example: hiddenOnProfile eq 'false'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully retrieved overview of meeting rooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/meetingRoomsOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/meeting-rooms/{meetingRoomId}:
    put:
      operationId: updateMeetingRoom
      summary: Update Meeting Room
      description: Update a meeting room for the specified venue, replacing the existing meeting room data.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-rooms:write
      - OAuth2.clientCredentials:
        - venue/meeting-rooms:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/existingMeetingRoom'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully updated the meeting room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existingMeetingRoom'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    patch:
      operationId: patchMeetingRoom
      summary: Patch Meeting Room
      description: 'Partially update a meeting room for the specified venue.


        - Only fields present in the request body are updated; omitted fields remain unchanged.

        - Set a field to `null` to unset it.

        - **Arrays (`capacities`, `amenities`) are treated as full replacements** — the entire array is replaced, not merged.

        - All changes are applied atomically.

        '
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-rooms:write
      - OAuth2.clientCredentials:
        - venue/meeting-rooms:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/patchMeetingRoom'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully updated the meeting room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/patchMeetingRoom'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/meeting-rooms/{meetingRoomId}/images:
    put:
      operationId: associateMeetingRoomImage
      summary: Associate Meeting Room Image
      description: 'Associate a previously uploaded image with a meeting room using a file UUID from the <a href="#operation/uploadFile">file
        upload</a> endpoint. This will replace the current image if one is already associated.


        **Note:** The recommended image dimensions are at least 1920 x 1080 pixels. Only JPEG images (.jpg, .jpeg) are accepted.
        Maximum file size is 10 MB.

        '
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-room-images:write
      - OAuth2.clientCredentials:
        - venue/meeting-room-images:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/meetingRoomImageAssociationRequest'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully associated the image with the meeting room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/meetingRoomImageAssociationResponse'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    get:
      operationId: listMeetingRoomImages
      summary: List Meeting Room Images
      description: Retrieves the images associated with a meeting room. Each meeting room has at most one image.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-room-images:read
      - OAuth2.clientCredentials:
        - venue/meeting-room-images:read
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully retrieved the meeting room images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/meetingRoomImagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/meeting-rooms/{meetingRoomId}/images/{imageId}:
    delete:
      operationId: disassociateMeetingRoomImage
      summary: Remove Meeting Room Image
      description: Disassociates the current image from a meeting room.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-room-images:delete
      - OAuth2.clientCredentials:
        - venue/meeting-room-images:delete
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      - $ref: '#/components/parameters/imageId1'
      tags:
      - Venue Meeting Rooms
      responses:
        '204':
          description: Successfully disassociated the image from the meeting room.
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/meeting-rooms/{meetingRoomId}/overview:
    get:
      operationId: getMeetingRoomOverview
      summary: Get Meeting Room Overview
      description: Retrieve an overview of a specific meeting room for the specified venue.
      security:
      - OAuth2.authorizationCode:
        - venue/meeting-room-overviews:read
      - OAuth2.clientCredentials:
        - venue/meeting-room-overviews:read
      parameters:
      - $ref: '#/components/parameters/venueId'
      - $ref: '#/components/parameters/meetingRoomId'
      tags:
      - Venue Meeting Rooms
      responses:
        '200':
          description: Successfully retrieved the meeting room overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/meetingRoomOverview'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    MeetingRoomExhibitCapacity:
      title: Meeting Room Exhibit Capacity
      description: Maximum number of exhibits for a specific exhibit layout type in a meeting room.
      type: object
      properties:
        layoutType:
          $ref: '#/components/schemas/ExhibitLayoutType'
        maxExhibits:
          type: integer
          description: Maximum number of exhibits for this layout type.
          minimum: 0
          maximum: 9999999
          example: 50
      required:
      - layoutType
      - maxExhibits
    VenueID:
      title: Venue ID
      description: A unique identifier for a venue
      type: string
      format: uuid
      example: 6bb0e2db-861f-46e3-a923-eb4d959ffa00
    ExhibitLayoutType:
      title: Exhibit Layout Type
      description: The exhibit setup type for a meeting room. Values represent standard exhibit booth and display configurations.
      type: string
      enum:
      - BOOTH_10x10
      - BOOTH_8x10
      - ISLAND_EXHIBIT
      - PENINSULA_EXHIBIT
      - PERIMETER_EXHIBIT
      - TABLETOP_EXHIBIT
      example: BOOTH_10x10
    MeetingRoomSeatingCapacity:
      title: Meeting Room Seating Capacity
      description: Maximum number of attendees for a specific seating style in a meeting room.
      type: object
      properties:
        layoutType:
          $ref: '#/components/schemas/SeatingLayoutType'
        maxAttendees:
          type: integer
          description: Maximum number of attendees for this seating style.
          minimum: 0
          maximum: 9999999
          example: 250
      required:
      - layoutType
      - maxAttendees
    AreaMeasurement:
      title: Area Measurement
      description: Measurement of area in square feet or square meters.
      type: object
      properties:
        value:
          type: number
          description: The numeric value of the area measurement.
          minimum: 1
          maximum: 9999999
          example: 1500
        unit:
          type: string
          description: The unit of measurement for the area.
          enum:
          - SQUARE_FEET
          - SQUARE_METERS
          example: SQUARE_FEET
      required:
      - value
      - unit
    MeetingRoomCapacities:
      title: Meeting Room Capacities
      description: Capacity information for a meeting room, grouped by category.
      type: object
      properties:
        exhibits:
          type: array
          description: Maximum number of exhibits per room setup.
          maxItems: 6
          items:
            $ref: '#/components/schemas/MeetingRoomExhibitCapacity'
        seating:
          type: array
          description: Maximum number of attendees per seating style.
          maxItems: 14
          items:
            $ref: '#/components/schemas/MeetingRoomSeatingCapacity'
    meetingRoomsOverviewResponse:
      title: Meeting Rooms Overview Response
      description: Paginated overview of meeting rooms for a venue.
      type: object
      required:
      - data
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          description: Overview of meeting rooms.
          minItems: 0
          maxItems: 200
          items:
            $ref: '#/components/schemas/meetingRoomOverview'
    patchMeetingRoom:
      title: MeetingRoomPatch
      description: Partial update payload for a venue meeting room.
      type: object
      properties:
        name:
          type: string
          description: The name of the meeting room.
          example: Grand Ballroom
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          description: The detailed description of the meeting room.
          example: Large conference space with natural lighting
          maxLength: 2500
        dimensions:
          type: object
          description: Physical dimensions for the meeting room.
          properties:
            totalSpace:
              $ref: '#/components/schemas/AreaMeasurement'
            ceilingHeight:
              $ref: '#/components/schemas/Dimension'
            length:
              $ref: '#/components/schemas/Dimension'
            width:
              $ref: '#/components/schemas/Dimension'
        displayOrder:
          type: integer
          description: The position of this meeting room in the venue's room listing.
          example: 1
          minimum: 1
        externalSourceId:
          type: string
          nullable: true
          description: The provider's own identifier for this meeting room.
          example: EXT-RM-12345
          maxLength: 100
        rates:
          type: object
          nullable: true
          description: Rate information for move in/out and events.
          properties:
            moveIn:
              $ref: '#/components/schemas/MeetingRoomRate'
            moveOut:
              $ref: '#/components/schemas/MeetingRoomRate'
            event:
              $ref: '#/components/schemas/MeetingRoomRate'
        capacities:
          type: object
          nullable: true
          description: Capacity information for the meeting room, grouped by category.
          properties:
            exhibits:
              type: array
              nullable: true
              description: Maximum number of exhibits per room setup.
              maxItems: 6
              items:
                $ref: '#/components/schemas/MeetingRoomExhibitCapacity'
            seating:
              type: array
              nullable: true
              description: Maximum number of attendees per seating style.
              maxItems: 14
              items:
                $ref: '#/components/schemas/MeetingRoomSeatingCapacity'
        amenities:
          type: array
          nullable: true
          description: List of amenities available in the meeting room.
          maxItems: 50
          items:
            $ref: '#/components/schemas/MeetingRoomAmenity'
        hiddenOnProfile:
          type: boolean
          description: True indicates the meeting room is hidden on the venue profile.
          example: false
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    meetingRoomImagesResponse:
      title: Meeting Room Images Response
      type: object
      description: The images associated with a meeting room. Each meeting room has at most one image.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/meetingRoomImage'
          maxItems: 1
          description: The images for a meeting room. Contains at most one item.
    meetingRoomImageAssociationRequest:
      title: Meeting Room Image Association Request
      description: Request body for associating an uploaded image file with a meeting room.
      type: object
      required:
      - file
      properties:
        file:
          type: object
          description: The previously uploaded image file to associate with the meeting room.
          required:
          - id
          properties:
            id:
              type: string
              format: uuid
              description: The unique identifier of a previously uploaded image file.
              example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    meetingRoomOverview:
      title: Meeting Room Overview
      description: An overview of a venue meeting room containing key identifiers and display properties.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the meeting room.
          readOnly: true
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name:
          type: string
          description: The display name of the meeting room.
          example: Grand Ballroom
        hiddenOnProfile:
          type: boolean
          description: True indicates the meeting room is hidden on the venue profile.
          example: false
        displayOrder:
          type: integer
          description: Position of this meeting room in the venue's room listing, with 1 being the first position.
          minimum: 1
          example: 1
    meetingRoom:
      title: Meeting Room
      description: A venue meeting room.
      allOf:
      - $ref: '#/components/schemas/Audit'
      type: object
      required:
      - name
      - dimensions
      properties:
        name:
          type: string
          description: The name of the meeting room.
          minLength: 1
          maxLength: 100
          example: Grand Ballroom
        description:
          type: string
          description: The detailed description of the meeting room.
          maxLength: 2500
          example: Large conference space with natural lighting
        dimensions:
          type: object
          description: Physical dimensions for the meeting room.
          required:
          - totalSpace
          properties:
            totalSpace:
              $ref: '#/components/schemas/AreaMeasurement'
            ceilingHeight:
              $ref: '#/components/schemas/Dimension'
            length:
              $ref: '#/components/schemas/Dimension'
            width:
              $ref: '#/components/schemas/Dimension'
        displayOrder:
          type: integer
          description: The position of this meeting room in the venue's room listing.
          minimum: 1
          example: 1
        externalSourceId:
          type: string
          description: The provider's own identifier for this meeting room.
          maxLength: 100
          example: EXT-123
        rates:
          type: object
          description: Rate information for move in/out and events.
          properties:
            moveIn:
              $ref: '#/components/schemas/MeetingRoomRate'
            moveOut:
              $ref: '#/components/schemas/MeetingRoomRate'
            event:
              $ref: '#/components/schemas/MeetingRoomRate'
        capacities:
          $ref: '#/components/schemas/MeetingRoomCapacities'
        amenities:
          type: array
          description: List of amenities available in the meeting room.
          maxItems: 50
          items:
            $ref: '#/components/schemas/MeetingRoomAmenity'
        hiddenOnProfile:
          type: boolean
          description: True indicates the meeting room is hidden on the venue profile.
          default: false
          example: false
    MeetingRoomAmenity:
      title: Meeting Room Amenity
      description: Available amenities for a meeting room.
      type: string
      example: PROJECTOR
      enum:
      - AUDIO_RECORDING
      - BACKGROUND_MUSIC
      - BLACKBOARD
      - BUILT_IN_SCREEN
      - CLOSED_CIRCUIT_VIDEO
      - DRY_ERASE_BOARD
      - DVD_PLAYER
      - EASEL
      - ELECTRIC_POINTER
      - FLIPCHART_MARKERS
      - INTERNET
      - LECTERN
      - MICROPHONE
      - MONITOR_CART
      - OUTDOOR_SPACE
      - PERSONAL_COMPUTER
      - POWERED_SPEAKER
      - PRIVATE_SPACE
      - PROJECTION_STAND
      - PROJECTOR
      - SEMI_PRIVATE_SPACE
      - TELEVISION
      - VHS_PLAYER
      - VIDEO_CAMERA
      - VIDEO_MONITOR
      - VIDEO_RECORDING
      - WHEELCHAIR_ACCESSIBLE
    MeetingRoomRate:
      title: Meeting Room Rate
      description: Meeting room rate with a value and application type.
      type: object
      properties:
        value:
          type: number
          description: The monetary value of the rate.
          minimum: 0
          maximum: 999999
          multipleOf: 0.01
          example: 500
        applicationType:
          $ref: '#/components/schemas/RateApplicationType'
      required:
      - value
      - applicationType
    RateApplicationType:
      title: Rate Application Type
      description: 'How the rate is applied to the meeting room booking.


        Values:

        - `COMPLIMENTARY` — Complimentary

        - `INCLUDED` — Included

        - `ONETIME_FEE` — One-Time Fee

        - `PER_DAY` — Per Day

        - `PER_HOUR` — Per Hour

        - `PER_SQ_FT` — Per Square Foot

        - `PER_SQ_MTR` — Per Square Meter

        - `TOTAL` — Total'
      type: string
      enum:
      - COMPLIMENTARY
      - INCLUDED
      - ONETIME_FEE
      - PER_DAY
      - PER_HOUR
      - PER_SQ_FT
      - PER_SQ_MTR
      - TOTAL
      example: PER_DAY
    meetingRoomImageAssociationResponse:
      title: Meeting Room Image Association Response
      description: Response body after successfully associating an image with a meeting room.
      type: object
      allOf:
      - $ref: '#/components/schemas/meetingRoomImage'
      - required:
        - file
        properties:
          file:
            type: object
            description: The file uploaded to be associated with the meeting room.
            readOnly: true
            required:
            - id
            properties:
              id:
                type: string
                format: uuid
                description: The ID of the uploaded image file.
                example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    Dimension:
      title: Dimension
      description: A dimension measurement in feet or meters.
      type: object
      properties:
        value:
          type: number
          description: The numeric value of the dimension.
          minimum: 0
          maximum: 99999.99
          example: 12.5
        unit:
          type: string
          description: The unit of measurement for the dimension.
          enum:
          - FEET
          - METERS
          example: FEET
      required:
      - value
      - unit
    meetingRoomImage:
      title: Meeting Room Image
      description: The image associated with a meeting room.
      type: object
      required:
      - id
      - href
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The ID of the associated meeting room image.
          example: 286e2866-b443-4d09-ab0f-0fac45cc026f
        href:
          type: string
          format: uri
          readOnly: true
          description: URL of the meeting room image.
          example: https://images.cvent.com/production/csn/3c7be8c9-cddb-4eaf-93a8-27da3250ed4f/images/83142ebfecbb42d2ac3be0433a180829_extrasmall!_!5b5c517134afb758b6fbbefb0e94d819.jpg
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
