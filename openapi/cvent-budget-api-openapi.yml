    BudgetItem:
      title: BudgetItem
      description: Budget item associated with an event.
      type: object
      required:
      - name
      - costType
      - category
      - date
      - costIncludesTaxGratuity
      - calculateTaxOnGratuity
      - currency
      - conversionRate
      - gratuityType
      - status
      allOf:
      - $ref: '#/components/schemas/EventId2'
      properties:
        id:
          type: string
          description: The identifier of the budget item.
          format: uuid
          example: 9463c74e-18c6-401a-a710-ae0f485bf959
          readOnly: true
        costType:
          $ref: '#/components/schemas/BudgetCostType'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the budget item.
          example: Airport Transportation
        code:
          type: string
          maxLength: 60
          description: User defined code of the budget item.
          example: AIRTRP
        category:
          $ref: '#/components/schemas/BudgetCategory'
        subCategory:
          $ref: '#/components/schemas/BudgetSubCategory'
        status:
          $ref: '#/components/schemas/BudgetStatus'
        vendor:
          $ref: '#/components/schemas/BudgetVendor'
        rfp:
          $ref: '#/components/schemas/BudgetRFP'
        date:
          type: string
          format: date-time
          description: The ISO 8601 zoned date and time assigned to the budget item, typically denotes the date and time of
            spending.
          example: '2020-02-07T00:00:00.000Z'
        lastModifiedDate:
          type: string
          format: date-time
          description: The ISO 8601 zoned date and time when the budget item was last modified.
          example: '2020-02-07T00:00:00.000Z'
          readOnly: true
        generalLedger:
          $ref: '#/components/schemas/GeneralLedger1'
        costAvoidance:
          $ref: '#/components/schemas/BudgetCostAvoidance'
        costIncludesTaxGratuity:
          type: boolean
          description: True indicates the budget item cost includes tax and gratuity.
          example: true
        calculateTaxOnGratuity:
          type: boolean
          description: True indicates the tax should be calculated on gratuity.
          example: false
        gratuityType:
          $ref: '#/components/schemas/BudgetTaxGratuityType'
        internalNote:
          type: string
          maxLength: 5000
          description: User defined note associated with the budget item.
          example: This item is inclusive of taxes.
        currency:
          type: string
          description: The ISO 4217 currency code assigned to the budget item's costs.
          maxLength: 3
          example: USD
        conversionRateLocked:
          type: boolean
          description: Determines which conversion rate to apply when a currency has multiple conversion rates for the same
            dates. If set as 'True', the conversion rate defined in the budget item is used for reporting and calculations.
          example: true
        conversionRate:
          type: number
          description: Conversion rate for converting an amount into a different currency. Value must be greater than 0.000001
          example: 5.2
        costDetail:
          type: array
          maxItems: 5
          minItems: 1
          items:
            $ref: '#/components/schemas/BudgetCostDetail-1'
          description: The list of cost details for a budget item.
        savings:
          type: array
          items:
            $ref: '#/components/schemas/BudgetSavings'
          description: Result of user-defined formula comparing two columns of a budget item cost. Typically this is the difference
            between budgeted and actual cost.
          readOnly: true
        associatedRegistrants:
          type: array
          items:
            $ref: '#/components/schemas/BudgetAssociatedRegistrant'
          description: The list of registrants associated to a budget item. Typically used to attribute cost to specific registrants
            in reporting.
        associatedSession:
          type: string
          description: Identifies the session associated with the budget item.
          format: uuid
          example: 9463c74e-18c6-401a-a710-ae0f485bf959
