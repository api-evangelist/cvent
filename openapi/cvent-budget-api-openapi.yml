  /events/{id}/budget-items/{budgetItemId}/custom-fields/{customFieldId}/answers:
    parameters:
    - $ref: '#/components/parameters/id4'
    - $ref: '#/components/parameters/budgetItemId'
    - $ref: '#/components/parameters/customFieldId3'
    put:
      tags:
      - Budget
      operationId: answerBudgetCustomField
      security:
      - OAuth2.clientCredentials:
        - budget/budget-items:write
      - OAuth2.authorizationCode:
        - budget/budget-items:write
      summary: Update Budget Cstm Fld Answers
      description: "Updates answers to a budget custom field using the details you provided in the body of the request. Answers\
        \ must be formatted correctly according to the specific type of custom field. The available fields and their formats\
        \ are listed below:\n* **Open Ended Text - Date/Time**. This field type has several possible user-selected answer\
        \ formats:\n  - Date/Time (2022-01-01T12:00:00.000Z). Denoted by *DateTime* in the response payload.\n  - Date (2022-01-01).\
        \ Denoted by *Date* in the response payload.\n* **Open Ended Text - One Line**. This field type has several possible\
        \ user-selected answer formats:\n  - General (Text). Denoted by *General* in the response payload.\n  - Number (Whole\
        \ numbers, 10, -10). Denoted by *Number* in the response payload.\n  - Currency (Positive decimal value, 10.5). Denoted\
        \ by *Currency* in the response payload.\n  - Decimal (-20.5). Denoted by *Decimal* in the response payload.\n  -\
        \ US Phone Number (123-456-7890). Denoted by *USPhoneNumber* in the response payload.\n  - Email Address (h.potterfield@test.com).\
        \ Denoted by *Email* in the response payload.\n* **Open Ended Text - Comment Box**. Answer format is free-text (any\
        \ value). Denoted by *FreeText* in the\n    response payload.\n* **Choice - Single Answer (Drop-Down, Vertical, Horizontal).**\
        \ Answer format is exactly one response to a\n    list of user-defined choices. Denoted by *SingleSelect* in the response\
        \ payload.\n* **Choice - Multiple Answers (Multi-Select Box, Vertical, Horizontal).** Answer format is one or more\n\
        \    responses from a list of user-defined choices. Denoted by *MultiSelect* in the response payload.\n\nTo delete\
        \ a custom field answer, either omit the `value` parameter or provide an empty list of answers for the specified custom\
        \ field ID.\n"
      requestBody:
        description: Custom field answer to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom-field'
        required: true
      responses:
        '200':
          description: Successfully updated custom field answer in the budget.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-field'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/budget-payments:
    parameters:
    - $ref: '#/components/parameters/id4'
    get:
      security:
      - OAuth2.clientCredentials:
        - budget/payments:read
      - OAuth2.authorizationCode:
        - budget/payments:read
      summary: List Budget Payments
      description: Gets a paginated list of payments for budget items in an event.
      operationId: getPayments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - name: filter
        in: query
        required: false
        description: 'Use filter query parameters to limit results

          to data that matches your criteria. See

          [Filters](/docs/rest-api/reference/filters) for details.


          Supported fields and operators are listed below:


          | Field            | Operators              | Notes                                                                                                                                                                                         |

          |:-----------------|:-----------------------|:----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

          | budgetItem.id    | `eq`                   |                                                                                                                                                                                               |

          | id               | `eq`                   |                                                                                                                                                                                               |

          | budgetVersion.id | `eq`                   |                                                                                                                                                                                               |

          | lastModified     | `gt`, `ge`, `lt`, `le` | `lastModified` refers to the date the associated budget item was last
          modified. Filtering by `lastModified` returns payments linked to budget items modified within the specified date
          range. |


          The following logical operators are supported for combining filters:

          * and

          * or

          '
        schema:
          type: string
          example: budgetItem.id eq '2c3a755a-d440-498d-baab-30f45dae3cf5' or id eq '1b3a755a-d440-498d-baab-30f45dae3cf5'
      tags:
      - Budget
      responses:
        '200':
          description: Successfully retrieved a paginated list of budget item payments.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/budget-payments/{paymentId}/invoices/{invoiceId}:
