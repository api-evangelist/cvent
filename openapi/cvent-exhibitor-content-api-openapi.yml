openapi: 3.0.2
info:
  title: Cvent REST APIs — Exhibitor Content
  version: ea
  description: 'Exhibitor Content operations for an exhibitor. This API allows you to upload & get exhibitor content data
    such as files, weblinks.

    '
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Exhibitor Content
  description: 'Exhibitor Content operations for an exhibitor. This API allows you to upload & get exhibitor content data
    such as files, weblinks.

    '
paths:
  /events/{id}/exhibitors/{exhibitorId}/files:
    get:
      summary: List Exhibitor Files
      description: Retrieves a list of files associated with an exhibitor.
      operationId: listExhibitorFiles
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      responses:
        '200':
          description: Successfully retrieved a list of files.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file-list-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/files/{fileId}:
    get:
      summary: Get Exhibitor File
      description: Get a single file for an exhibitor.
      operationId: getExhibitorFile
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/fileId1'
      responses:
        '200':
          description: Successfully retrieved exhibitor file.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-file'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    put:
      summary: Associate Exhibitor File
      description: 'Associate a file to an exhibitor using a file ID taken from the <a href="#operation/uploadFile">file upload</a>
        endpoint.

        '
      operationId: updateExhibitorFile
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:write
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/fileId1'
      requestBody:
        description: Exhibitor file content to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file'
      responses:
        '200':
          description: Successfully added the exhibitor file content.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-file'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '422':
          $ref: '#/components/responses/UnprocessableEntity13'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    delete:
      summary: Disassociate Exhibitor File
      description: Disassociate a single file from an exhibitor.
      operationId: disassociateExhibitorFile
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:delete
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:delete
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/fileId1'
      responses:
        '204':
          description: Successfully disassociated exhibitor file.
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/weblinks:
    get:
      summary: List Exhibitor Weblinks
      description: Retrieves a list of content weblinks associated with an exhibitor.
      operationId: listExhibitorWeblinks
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      responses:
        '200':
          description: Successfully retrieved a list of weblinks.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/weblink-list-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    post:
      summary: Create Exhibitor Weblink
      description: Creates a single content weblink for an exhibitor.
      operationId: createExhibitorWeblink
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:write
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      requestBody:
        description: Exhibitor content weblink details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/weblink'
      responses:
        '201':
          description: Successfully created the exhibitor weblink.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-weblink'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '422':
          $ref: '#/components/responses/UnprocessableEntity13'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/weblinks/{weblinkId}:
    get:
      summary: Get Exhibitor Weblink
      description: Retrieves a single content weblink for an exhibitor.
      operationId: getExhibitorWeblink
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/weblinkId'
      responses:
        '200':
          description: Successfully retrieved exhibitor weblink.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-weblink'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    put:
      summary: Update Exhibitor Weblink
      description: Updates content weblink data in an event for a given exhibitor ID.
      operationId: updateExhibitorWeblink
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:write
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/weblinkId'
      requestBody:
        description: Exhibitor content to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/weblink'
      responses:
        '200':
          description: Successfully updated exhibitor content.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-weblink'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '422':
          $ref: '#/components/responses/UnprocessableEntity13'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    delete:
      summary: Delete Exhibitor Weblink
      description: Deletes a single exhibitor content weblink.
      operationId: deleteExhibitorWeblink
      tags:
      - Exhibitor Content
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-contents:delete
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-contents:delete
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/weblinkId'
      responses:
        '204':
          description: Successfully deleted exhibitor weblink.
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    file-list-response:
      title: FileListResponse
      description: A JSON object containing a list of files associated with an exhibitor.
      type: object
      properties:
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/existing-file'
          description: List of files associated with an exhibitor.
    Event4:
      description: The Associated Event.
      title: Event
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 3db28cfc-db22-11eb-8d19-0242ac130003
          description: Event id
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    existing-file:
      description: Content of existing exhibitor file
      title: File Response
      type: object
      allOf:
      - $ref: '#/components/schemas/file'
      properties:
        id:
          description: Unique ID of the file.
          readOnly: true
          format: uuid
          example: 3d44b9e4-8c1a-403d-a20a-0b981f539935
          type: string
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    weblink:
      description: Content of exhibitor weblink.
      title: Weblink Request
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        name:
          description: Display name of the weblink.
          example: Marketing Page
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          description: The URL of the weblink.
          example: http://www.example.com
        hidden:
          type: boolean
          description: True indicates the weblink is hidden from attendees.
          default: false
        order:
          description: Display order for exhibitor weblink content.
          type: integer
          example: 3
          minimum: 1
      required:
      - event
      - exhibitor
      - url
      - name
      - order
    weblink-list-response:
      title: WeblinkListResponse
      type: object
      description: A response object containing a list of weblinks associated with an exhibitor.
      properties:
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/existing-weblink'
          description: List of weblinks associated with an exhibitor.
    existing-weblink:
      description: Content of existing exhibitor weblink
      title: Weblink Response
      type: object
      allOf:
      - $ref: '#/components/schemas/weblink'
      properties:
        id:
          description: Unique ID of the weblink.
          readOnly: true
          format: uuid
          example: 4d44b9e4-8c1a-403d-a20a-0b981f539935
          type: string
    Exhibitor:
      description: The Associated Exhibitor.
      title: Exhibitor
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 4888db54-db22-11eb-8d19-0242ac130003
          description: Exhibitor id
    file:
      description: Content of exhibitor file.
      title: File Request
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        displayName:
          description: Display name of the file.
          example: Marketing Page
          type: string
          minLength: 1
        hidden:
          type: boolean
          description: True indicates the file is hidden from attendees.
          default: false
        order:
          description: Display order for exhibitor file content.
          type: integer
          example: 3
          minimum: 1
      required:
      - event
      - exhibitor
      - displayName
      - order
    error-response:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  parameters:
    fileId1:
      in: path
      name: fileId
      description: ID of a file.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    weblinkId:
      in: path
      name: weblinkId
      description: ID of an exhibitor weblink.
      required: true
      schema:
        type: string
        format: uuid
        example: 4d44b9e4-8c1a-403d-a20a-0b981f539935
    id6:
      in: path
      name: id
      description: ID of an event.
      required: true
      schema:
        type: string
        format: uuid
        example: 3db28cfc-db22-11eb-8d19-0242ac130003
    exhibitorId:
      in: path
      name: exhibitorId
      description: ID of an exhibitor.
      required: true
      schema:
        type: string
        format: uuid
        example: 4888db54-db22-11eb-8d19-0242ac130003
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    UnprocessableEntity13:
      description: Was not able to process the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error-response'
          example:
            code: 422
            message: Unprocessable Entity
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  securitySchemes:
    OAuth2.clientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials Flow.
      flows:
        clientCredentials:
          tokenUrl: https://api-platform.cvent.com/ea/oauth2/token
          scopes:
            account/hooks:delete: Allows the deletion of hooks.
            account/hooks:read: Allows the reading of hooks.
            account/hooks:write: Allows the creation/updation of hooks.
            account/user-groups:delete: Allows deletion for user groups
            account/user-groups:read: Allows the reading of user groups
            account/user-groups:write: Allows the writing of user groups
            account/users:delete: Allows the deletion of User
            account/users:read: Allows the reading of User, User Group
            account/users:write: Allows the creation/updating of User
            appointments/appointment-attendees:read: Allows the reading of appointment attendees and their related entities.
            appointments/appointment-events:read: Allows the reading of appointment events and their related entities.
            appointments/appointment-types:read: Allows the reading of appointment types and their related entities.
            appointments/appointments:read: Allows the reading of appointment and their related entities.
            appointments/appointments:write: Allows the writing of appointments and their related entities.
            appointments/available-times:read: Allows the reading of availability times.
            appointments/locations:read: Allows the reading of appointment locations and their related entities.
            attendee-insights/attendee-insights:read: Allows the reading of engagement scores (attendee insights).
            attendee-insights/scores:read: Allows the reading of scores.
            attendee-insights/stats:read: Allows the reading of engagement score (attendee insight) stats.
            budget/budget-items:delete: Allows the deletion of budget items
            budget/budget-items:read: Allows the reading of all budget items
            budget/budget-items:write: Allows creation/updation of budget item
            budget/budget-totals:read: Allows the reading of all event budget totals
            budget/budget-vendors:read: Allows reading of account-level budget vendors.
            budget/cards:read: Allows the reading of cards
            budget/currency-conversion-rate:delete: Allows deletion of currency conversion rate for currency.
            budget/currency-conversion-rate:read: Allows reading of currency conversion rate for currency.
            budget/currency-conversion-rate:write: Allows creation/update of currency conversion rate for currency.
            budget/payments:delete: Allows deletion of payments.
            budget/payments:read: Allows reading of payment for budget item.
            budget/payments:write: Allows creation of payment in a budget item.
            budget/transactions:delete: Allows delete card transactions.
            budget/transactions:read: Allows the reading of all card's transactions
            budget/transactions:write: Allows creation of card transactions.
            bulk/bulk-jobs:read: Allows the reading of bulk job related entities
            bulk/bulk-jobs:write: Allows the creation, update and deletion of bulk job related entities
            business-transient/bids:read: Allows the reading of Business Transient Bid data
            business-transient/proposals:read: Allows the reading of Business Transient Proposal data
            business-transient/supplier-brands:read: Allows the reading of a supplier brand or a list of travel supplier brands.
            business-transient/supplier-chains:read: Allows the reading of a travel supplier chain or a list of travel supplier
              chains.
            business-transient/supplier-properties:read: Allows the reading of a travel supplier property or a list of travel
              supplier properties.
            business-transient/supplier-property-rooms:read: Allows the reading of a list of travel supplier property rooms.
            business-transient/travel-accounts:read: Allows the reading of business transient travel account data.
            business-transient/travel-program-questions:read: Allows the reading of business transient travel program question
              data.
            business-transient/travel-programs:read: Allows the reading of business transient travel program data.
            business-transient/travel-supplier-accounts:read: Allows the reading of business transient travel supplier account
              data.
            business-travel/bids:read: Allows the reading of Business Travel Bid data
            business-travel/proposals:read: Allows the reading of Business Travel Proposal data
            business-travel/travel-accounts:read: Allows the reading of business travel account data.
            business-travel/travel-program-questions:read: Allows the reading of business travel program question data.
            business-travel/travel-programs:read: Allows the reading of business travel program data.
            compliance/communications:read: Allows the reading of communication compliance
            compliance/communications:write: Allows the writing of communication compliance
            email/bounces:read: Allow the reading of email bounces.
            email/email-status:read: Allows the reading of email statuses.
            email/emails:read: Allows the reading of emails.
            eMarketing/campaigns:read: Allows the reading of campaigns.
            emarketing/emarketing-email-status:read: Allows the reading of eMarketing email statuses.
