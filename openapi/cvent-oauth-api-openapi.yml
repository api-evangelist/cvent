openapi: 3.0.2
info:
  title: Cvent REST APIs — Authentication
  version: ea
  description: Endpoints for obtaining, refreshing, and validating OAuth2 access tokens.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Authentication
  description: Endpoints for obtaining, refreshing, and validating OAuth2 access tokens.
paths:
  /oauth2/authorize:
    get:
      tags:
      - Authentication
      summary: Get Authorization Code
      description: 'Initiates the OAuth2 authorization code flow by directing the user-agent to the Cvent authorization server.
        The client typically triggers this request via a browser. For the `redirect_uri` HTTPS is required; `http://localhost`
        is permitted for local testing only. On success, the authorization server redirects the user-agent back to the client''s
        `redirect_uri` with an authorization code. The client can then exchange that code via [Get Token](#operation/oauth2Token)
        to obtain an access token.

        '
      operationId: oauth2Authorize
      parameters:
      - in: query
        name: response_type
        description: 'The response type must be code. Indicates the client wants an authorization code (authorization code
          grant flow).


          **Note:** *implicit flow* or the *token* value is not supported at this time.

          '
        schema:
          type: string
          enum:
          - code
        example: code
        required: true
      - in: query
        name: client_id
        description: 'The OAuth2 Client application ID.


          Must be a pre-registered client created in the developer portal.

          '
        schema:
          type: string
        example: ad398u21ijw3s9w3939
        required: true
      - in: query
        name: redirect_uri
        description: 'The URL to which the authorization server redirects the browser after authorization has been granted
          by the user.


          A redirect URI must:


          * Be an absolute URI.

          * Be pre-registered with a client.

          * **NOT** include a fragment component.

          * Wildcards are **NOT** supported


          Requires HTTPS over HTTP except for http://localhost for testing purposes only.


          **Note:** App callback URLs such as *com.myclientapp://myclient/redirect* are also supported.

          '
        schema:
          type: string
        example: https://example.com/redirect
        required: true
      - in: query
        name: state
        description: 'An opaque value the client application adds to the initial request. The authorization server

          includes this value when redirecting back to the client.


          This value must be used by the client to prevent CSRF attacks.


          **Optional** but strongly recommended.

          '
        schema:
          type: string
        example: abc123xyz
        required: false
      - in: query
        name: scope
        description: 'Can be a combination of any scopes associated with a client. Scopes must be separated by spaces.

          Any scope used must be pre-associated with the client or it will be ignored at runtime.


          **Note:** If the client doesn''t request any scopes, the authorization server uses all

          scopes associated with the client.

          '
        schema:
          type: string
        example: event/events:read event/attendees:read
        required: false
      responses:
        '302':
          description: Redirect back to calling application.
          headers:
            Location:
              schema:
                type: string
              description: "**Positive Response**\n\nThe authorization server redirects the user-agent back to the client's\
                \ redirect URI with the authorization code and state.\nThe code and state must be returned in the query string\
                \ parameters.\n\n**Negative Responses**\n\n- If client_id and redirect_uri are valid but there are other problems\
                \ with the request parameters\n(for example, if response_type is not included), the authorization server redirects\
                \ the error to\nclient's redirect_uri.\n  - Location: https://client_redirect_uri?error=invalid_request\n\n\
                - If the client requests 'code' in response_type but does not have permission for these requests,\nthe authorization\
                \ server should return unauthorized_client to client's redirect_uri.\n  - Location: https://client_redirect_uri?error=unauthorized_client\n\
                \n- If the client requests invalid, unknown, malformed scope, the authorization server should return\ninvalid_scope\
                \ to the client's redirect_uri, as follows.\n  - Location: https://client_redirect_uri?error=invalid_scope\n\
                \n- If there is any unexpected error in the server, the authorization server should return\nserver_error to\
                \ client's redirect_uri. It should not be the HTTP 500 error displayed to\nthe end user in the browser, because\
                \ this error doesn't get sent to the client.\n  - Location: https://client_redirect_uri?error=server_error\n\
                \n- In the rare case where the authorization server encounters an exception in the communication\nprotocol\
                \ while making any connection to an external identity provider, the authorization\nserver redirects the error\
                \ to the client's redirect_uri with either of the following messages.\n  - Location: https://client_redirect_uri?error=invalid_request&error_description=Connection+reset\n\
                \  - Location: https://client_redirect_uri?error=invalid_request&error_description=Read+timed+out\n"
              example: https://client_redirect_uri?code=AUTHORIZATION_CODE&state=STATE
        '400':
          description: The request is missing a required parameter.
  /oauth2/token:
    post:
      tags:
      - Authentication
      summary: Get Token
      description: 'Obtains an access token and, optionally, a refresh token. Read the [Developer Quickstart](/docs/rest-api/tutorials/developer-quickstart)
        for an example request.


        **Note:** The token endpoint returns refresh_token only when the grant_type is authorization_code.

        '
      operationId: oauth2Token
      parameters:
      - in: header
        name: Authorization
        description: 'The client must pass its client_id and client_secret in the authorization header through Basic HTTP
          authorization.


          An example is `Basic Base64Encode(client_id:client_secret)` where `Base64Encode` means that the client id and secret
          are base64 encoded.

          '
        schema:
          type: string
        example: Basic Y2xpZW50X2lkOmNsaWVudF9zZWNyZXQ=
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Oauth2TokenApplicationXWwwFormUrlencodedPostRequest'
      responses:
        '200':
          description: A successful response returning an access token and a possible refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oauth2TokenPostResponse'
        '400':
          description: A bad token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oauth2TokenPostResponse-0'
        '401':
          description: Client authentication failed. The credentials provided in the Authorization header are invalid or missing.
  /token-validation:
    get:
      tags:
      - Authentication
      summary: Validate Token
      description: Verifies presented authentication token is valid.
      operationId: validateToken
      security:
      - OAuth2.clientCredentials: []
      - OAuth2.authorizationCode: []
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/ValidToken'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    Oauth2TokenPostResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The access token contains scopes and groups and is used to grant access to authorized resources.
          example: eyJz9sdfsdfsdfsd
        refresh_token:
          type: string
          description: The refresh token contains the information necessary to obtain a new access token.
          example: dn43ud8uj32nk2je
        token_type:
          type: string
          description: The OAuth2 token type. Always `Bearer`.
          example: Bearer
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token.
          default: 3600
          example: 3600
      required:
      - access_token
      - token_type
      - expires_in
    Oauth2TokenApplicationXWwwFormUrlencodedPostRequest:
      type: object
      properties:
        grant_type:
          description: Controls the OAuth2 grant flow used to obtain tokens.
          enum:
          - client_credentials
          - authorization_code
          - refresh_token
          example: client_credentials
        client_id:
          description: 'The OAuth2 Client application ID.


            Must be a pre-registered client created in the developer portal.

            '
          type: string
          example: djc98u3jiedmi283eu928
        scope:
          description: 'Can be a combination of any scopes associated with a client. Any scope requested must be pre-associated
            with the client or it will be ignored at runtime.

            If the client doesn''t request any scopes, the authorization server uses all scopes associated with the client.


            **Optional** - Only used if the grant_type is client_credentials.

            '
          type: string
          example: event/events:read event/attendees:read
        redirect_uri:
          description: 'Must be the same *redirect_uri* that was used to get *authorization_code* in */oauth2/authorize*.


            **Required only if grant_type is authorization_code.**

            '
          type: string
          example: https://example.com/redirect
        refresh_token:
          description: 'The refresh token.


            **Note:** The token endpoint returns *refresh_token* only when the grant_type is *authorization_code*.

            '
          type: string
          example: dn43ud8uj32nk2je
        code:
          description: 'The code that is returned from a successful */oauth2/authorize*.


            **Required if grant_type is authorization_code.**

            '
          type: string
          example: AUTHORIZATION_CODE
      required:
      - grant_type
      - client_id
    Oauth2TokenPostResponse-0:
      type: object
      properties:
        error_description:
          type: string
          description: Additional error information, when available.
        error:
          type: string
          description: '**invalid_request**


            The request is missing a required parameter, includes an unsupported parameter value (other than unsupported_grant_type),
            or is otherwise malformed. For example, grant_type is refresh_token but refresh_token is not included.


            **invalid_client**


            Client authentication failed. For example, when the client includes client_id and client_secret in the authorization
            header, but there''s no such client with that client_id and client_secret.


            **invalid_grant**


            Refresh token has been revoked.


            Authorization code has been consumed already or does not exist.


            **unauthorized_client**


            Client is not allowed for code grant flow or for refreshing tokens.


            **unsupported_grant_type**


            Returned if grant_type is anything other than authorization_code or refresh_token.

            '
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          example: invalid_request
    ValidToken:
      title: Valid Token
      description: Validity status of an authentication token.
      type: object
      properties:
        tokenValid:
          type: boolean
          description: True indicates the presented authentication token is valid.
          example: true
        statusCode:
          type: integer
          description: Supplementary status code. Typically will be 200 for a success case.
          example: 200
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
    ValidToken:
      description: A confirmation message that the token is valid
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidToken'
