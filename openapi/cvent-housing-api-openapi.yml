      name: Cvent-Access-Code
      description: 'Example:


        Cvent-Access-Code: c44bf029-f7f1-43dc-95c7-79403b247e2a



        Access code for the event. It can be provided to integration partner in an email.

        '
      required: true
      schema:
        type: string
    availableNightsFilter:
      name: filter
      in: query
      required: false
      description: '"A filter query string narrows search results and supports the combination of logical and comparison operators.
        The filter adheres to the pattern filter=''field'' comparisonType ''value''."


        These are the comparison types that can be used in filter expressions:

        * equal: eq

        * less or equal: le

        * greater or equal: ge

        * greater than: gt

        * less than: lt


        The following fields are filterable:

        * attendeeType.codes (eq)

        * attendeeType.id (eq)

        * roomType.id (eq)

        * date (eq|le|ge|lt|gt)


        Limits for the number of fields that can be passed in a filter: 36


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: attendeeType.codes eq 'PEWATT0524317' and (date ge '2023-01-12' and date le '2023-01-15')
    availabilityLimit:
      in: query
      name: limit
      description: Limit to this number of search results. Maximum of 50, default of 10.
      required: false
      example: 10
      schema:
        type: integer
        maximum: 50
        minimum: 1
        default: 10
    paginationParam:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    roomTypesFilter:
      name: filter
      in: query
      required: false
      description: '"A filter query string narrows search results and supports the combination of logical and comparison operators.
        The filter adheres to the pattern filter=''field'' comparisonType ''value''."


        These are the comparison types that can be used in filter expressions:

        * equal: eq


        The following fields are filterable:

        * attendeeTypes.id (eq)

        * attendeeTypes.codes (eq)


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: attendeeTypes.id eq 10345 or attendeeTypes.codes eq 'PEWATT0524317'
    locale2:
      name: locale
      required: false
      description: Locale code in IETF Language tag format. Indicates desired locale of return values.
      in: query
      schema:
        $ref: '#/components/schemas/Locale'
    housingEventId:
