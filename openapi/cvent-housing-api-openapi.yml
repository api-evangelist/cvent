openapi: 3.0.2
info:
  title: Cvent REST APIs — Housing
  version: ea
  description: "RegLink APIs allow you to exchange data with Cvent Passkey events and hotel reservation-booking engines.\n\
    Generally, there are four primary categories of functionality that RegLink APIs support:\n  * **Sync Registrants.** Allow\
    \ individual registrant information to be sent to Cvent Passkey, streamlining the hotel reservation process for attendees.\
    \ Attendees can then be directed to Passkey post-registration and reserve a hotel room without re-entering their data\
    \ again. This is done with the reservation request endpoint.\n  * **Fetch Rooms.** The ability for an external system\
    \ to fetch Passkey event details and hotel room availability based on various criteria.\n  * **Fetch Reservations.** The\
    \ ability for an external system to fetch detailed reservation information for individual registrants. This is done with\
    \ the Reservation endpoint and the Callback system.\n  * **Manage Reservations.** The ability for an external system to\
    \ create, modify or cancel a registrant's hotel reservation directly or indirectly.\n\nIf you need authentication credentials\
    \ or have any questions regarding the RegLink APIs, contact the [Cvent Passkey Integrations Team](https://web.cvent.com/survey/c6a60a30-d981-4ae8-af28-686af0eeb9b7/welcome).\n\
    \n* **Passkey.** A software solution allowing your invitees to book room reservations directly with hotels.\n* **Housing\
    \ Event.** An Passkey event where invitees will be able to register and book rooms.\n* **Reservation Request.** Represents\
    \ a request to book rooms in the housing event.\n* **RegLink.** A feature that links Passkey events to your registration\
    \ events, enabling you to sync data between the two events.\n* **Callback.** [Passkey's callback system](/docs/passkey/REST/callbacks)\
    \ allows for a push notification to be sent to your system when a reservation is created, modified or cancelled.\n"
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Housing
  description: "RegLink APIs allow you to exchange data with Cvent Passkey events and hotel reservation-booking engines.\n\
    Generally, there are four primary categories of functionality that RegLink APIs support:\n  * **Sync Registrants.** Allow\
    \ individual registrant information to be sent to Cvent Passkey, streamlining the hotel reservation process for attendees.\
    \ Attendees can then be directed to Passkey post-registration and reserve a hotel room without re-entering their data\
    \ again. This is done with the reservation request endpoint.\n  * **Fetch Rooms.** The ability for an external system\
    \ to fetch Passkey event details and hotel room availability based on various criteria.\n  * **Fetch Reservations.** The\
    \ ability for an external system to fetch detailed reservation information for individual registrants. This is done with\
    \ the Reservation endpoint and the Callback system.\n  * **Manage Reservations.** The ability for an external system to\
    \ create, modify or cancel a registrant's hotel reservation directly or indirectly.\n\nIf you need authentication credentials\
    \ or have any questions regarding the RegLink APIs, contact the [Cvent Passkey Integrations Team](https://web.cvent.com/survey/c6a60a30-d981-4ae8-af28-686af0eeb9b7/welcome).\n\
    \n* **Passkey.** A software solution allowing your invitees to book room reservations directly with hotels.\n* **Housing\
    \ Event.** An Passkey event where invitees will be able to register and book rooms.\n* **Reservation Request.** Represents\
    \ a request to book rooms in the housing event.\n* **RegLink.** A feature that links Passkey events to your registration\
    \ events, enabling you to sync data between the two events.\n* **Callback.** [Passkey's callback system](/docs/passkey/REST/callbacks)\
    \ allows for a push notification to be sent to your system when a reservation is created, modified or cancelled.\n"
paths:
  /connections:
    post:
      tags:
      - Housing
      summary: Create Connection
      description: 'Create a connection between an integration partner and an event using an access code provided by the Passkey

        event owner. This connection is required to authorize all other API calls for the event. Only one active

        connection is supported per access code at a time.

        '
      operationId: createConnection
      security:
      - OAuth2.clientCredentials:
        - housing/connections:write
      parameters:
      - $ref: '#/components/parameters/accessCode'
      responses:
        '200':
          description: Successfully connected.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connection-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
  /housing-events/summaries:
    get:
      tags:
      - Housing
      summary: Get Housing Events Summaries
      description: 'Gets a paginated list of summary information for your individual housing events. Use this endpoint to
        discover

        which events your integration has access to and to retrieve housing event IDs for use in other endpoints.

        '
      operationId: getHousingEventsSummaries
      security:
      - OAuth2.clientCredentials:
        - housing/housing-events:read
      parameters:
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/housingEventsSummariesFilter'
      responses:
        '200':
          description: Successfully retrieved a paginated list of summary information for your individual housing events.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/housing-event-summary-list'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}:
    get:
      tags:
      - Housing
      summary: Get Housing Event Info
      description: 'Retrieves housing event details based on the given housing event ID. Use this endpoint to get event-level

        information such as event name, dates, attendee types, and related configuration. Get the housing event ID

        from the [Get Housing Events Summaries](#operation/getHousingEventsSummaries) endpoint, from the

        [Create Connection](#operation/createConnection) response, or directly from the Passkey event owner.

        '
      operationId: getHousingEventInfo
      security:
      - OAuth2.clientCredentials:
        - housing/housing-events:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      responses:
        '200':
          description: Successfully retrieved the housing events details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/housing-event'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels:
    get:
      tags:
      - Housing
      summary: Get Housing Event Hotels
      description: 'Get a list of hotels for the given housing event. Returns a paginated list of all hotels in the housing
        event''s

        room block, including hotel names, addresses, and IDs. Use the hotel IDs from this response to query

        [room types](#operation/getHousingEventRoomTypes), [availability](#operation/getHousingEventHotelAvailability), and
        [inventory](#operation/getRoomTypeInventory).

        '
      operationId: getHousingEventHotels
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-hotels:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/locale2'
      responses:
        '200':
          description: Successfully retrieved a paginated list of hotels for the housing event, and their related details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/housing-event-hotels-list'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels/{hotelId}:
    get:
      tags:
      - Housing
      summary: Get Housing Event Hotel
      description: 'Gets a single hotel''s details in a housing event. Returns detailed information about a specific hotel,

        including address and localized content. Use this endpoint when you need full details for

        a single hotel rather than the [summary list](#operation/getHousingEventHotels).

        '
      operationId: getHousingEventHotel
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-hotels:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/hotelId1'
      - $ref: '#/components/parameters/locale2'
      responses:
        '200':
          description: Successfully retrieved a hotel's details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/housing-event-hotel'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels/{hotelId}/available-nights:
    get:
      tags:
      - Housing
      summary: Get Event Hotel Availability
      description: 'Get a filterable list of available room nights for a particular hotel and housing event. Returns availability

        by date, showing which nights have rooms remaining.


        Filter by attendee type and date range to narrow results.

        '
      operationId: getHousingEventHotelAvailability
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-available-nights:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/hotelId1'
      - $ref: '#/components/parameters/availableNightsFilter'
      - $ref: '#/components/parameters/availabilityLimit'
      - $ref: '#/components/parameters/paginationParam'
      responses:
        '200':
          description: Successfully retrieved a paginated list of room nights.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/available-nights'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels/{hotelId}/room-types:
    get:
      tags:
      - Housing
      summary: Get Housing Event Room Types
      description: 'Get a filterable list of room types for a given hotel in a housing event. Room types represent categories
        of

        rooms (for example, Standard King or Double Queen) available at the hotel for this event. Use the returned

        room type IDs to query [room details](#operation/getRoomTypeDetails) and [inventory](#operation/getRoomTypeInventory).


        Filter by attendee type to retrieve only the room types available to a specific attendee segment.

        '
      operationId: getHousingEventRoomTypes
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-room-types:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/hotelId1'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/roomTypesFilter'
      - $ref: '#/components/parameters/locale2'
      responses:
        '200':
          description: Successfully retrieved a paginated list of room types.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/housing-event-room-types-list'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels/{hotelId}/room-types/{roomTypeId}:
    get:
      tags:
      - Housing
      summary: Get Room Type Details
      description: 'Get a room type''s details for the given housing event, hotel, and room type. Returns detailed information
        about

        a specific room type, including room description and available images.

        '
      operationId: getRoomTypeDetails
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-room-types:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/hotelId1'
      - $ref: '#/components/parameters/roomTypeId'
      - $ref: '#/components/parameters/locale2'
      responses:
        '200':
          description: Successfully retrieved room details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/room-type-details'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/hotels/{hotelId}/room-types/{roomTypeId}/inventory:
    get:
      tags:
      - Housing
      summary: Get Room Type Inventory
      description: 'Gets a list of room type inventory details (by date) for the given housing event, hotel, and room type.
        Returns

        date-by-date inventory counts (total rooms, rooms picked up, and rooms remaining) for a specific room type.


        Filter by date range to retrieve inventory for specific nights.

        '
      operationId: getRoomTypeInventory
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-inventory:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/hotelId1'
      - $ref: '#/components/parameters/roomTypeId'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/inventoryFilter'
      responses:
        '200':
          description: Successfully retrieved a paginated list of room type inventory details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory-details-list'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/inventory:
    get:
      tags:
      - Housing
      summary: Get Housing Event Inventory
      description: 'Gets a list (sorted by date) of housing event inventory details for the given housing event. Returns aggregated

        inventory across all hotels and room types in the event. This provides a high-level view of total event capacity

        and pickup.


        For per-hotel or per-room-type breakdowns, use [Get Room Type Inventory](#operation/getRoomTypeInventory) instead.

        '
      operationId: getHousingEventInventory
      security:
      - OAuth2.clientCredentials:
        - housing/housing-event-inventory:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/inventoryFilter'
      responses:
        '200':
          description: Successfully retrieved a paginated list of housing event inventory details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory-details-list'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /housing-events/{housingEventId}/reservations:
    get:
      tags:
      - Housing
      summary: Get Housing Event Reservations
      description: 'Get a list of reservation details for the given housing event. Returns a paginated list of all reservations
        in

        the event, including guest details, stay dates, hotel, room type, and reservation status. Use the `before`

        and `after` parameters to filter by when a reservation was added or last updated, which is useful for incremental
        syncing.


        Returns an empty list when no reservations match the criteria.

        '
      operationId: getHousingEventReservations
      security:
      - OAuth2.clientCredentials:
        - housing/reservations:read
      parameters:
      - $ref: '#/components/parameters/housingEventId'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/paginationParam'
      - $ref: '#/components/parameters/housingReservationsFilter'
      responses:
        '200':
          description: Successfully returned reservations details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservations-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /reservation-requests:
    post:
      tags:
      - Housing
      summary: Create Reservation Request
      description: 'Creates a reservation request from guest details.


        A reservation request represents a registration and stores guest details such as name, email, and preferences.

        The response includes a guest-specific `bookingSite` URL. When the guest books through that URL, Passkey

        pre-populates their details and links the new reservation to the reservation request for tracking.

        '
      operationId: createReservationRequest
      security:
      - OAuth2.clientCredentials:
        - housing/reservation-requests:write
      requestBody:
        description: Reservation request information.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reservation-request'
      responses:
        '200':
          description: Successfully created reservation request.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation-request'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /reservation-requests/{reservationRequestsId}:
    get:
      tags:
      - Housing
      summary: Get Reservation Request
      description: 'Returns reservation request details for a given reservation request ID. The response includes guest details,

        the `bookingSite` URL, and a linked Reservation ID/ack number if present.

        '
      operationId: getReservationRequest
      security:
      - OAuth2.clientCredentials:
        - housing/reservation-requests:read
      parameters:
      - $ref: '#/components/parameters/reservationRequestsId'
      responses:
        '200':
          description: Successfully returned response with reservation request information.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation-request'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    put:
      tags:
      - Housing
      summary: Update Reservation Request
      description: 'Update a reservation request using the given reservation request ID. Use this endpoint to update guest
        details

        (name, email, preferences) on the reservation request. The request body overwrites the current version entirely.


        If a reservation has already been booked through this request, changes to the reservation request do not affect

        the linked reservation. To update the hotel booking itself, use [Update Reservation](#operation/updateReservationSync)
        instead.


        You cannot update a cancelled reservation request.

        '
      operationId: updateReservationRequest
      security:
      - OAuth2.clientCredentials:
        - housing/reservation-requests:write
      requestBody:
        description: Reservation request details. This data will overwrite the current version of the reservation request
          for the given ID.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/existing-reservation-request'
      parameters:
      - $ref: '#/components/parameters/reservationRequestsId'
      responses:
        '200':
          description: Successfully returned response with updated reservation request information.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation-request'
        '400':
          description: Reservation request was cancelled and cannot be modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
              example:
                code: 400
                message: The reservation request is cancelled and cannot be modified.
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    delete:
      tags:
      - Housing
      summary: Cancel Reservation Request
      description: 'Update the status of a reservation request to cancelled. If a reservation has already been booked through
        this

        request, cancelling the request does not cancel the linked reservation. To cancel the hotel booking itself,

        use [Cancel Reservation](#operation/cancelReservation).


        You cannot cancel a reservation request that already has a linked reservation. [Unlink the reservation](#operation/unlinkReservation)
        first,

        then cancel the request.

        '
      operationId: cancelReservationRequest
      security:
      - OAuth2.clientCredentials:
        - housing/reservation-requests:delete
      parameters:
      - $ref: '#/components/parameters/reservationRequestsId'
      responses:
        '204':
          description: Successfully cancelled reservation request.
        '400':
          description: Reservation already exists for given reservation request, so we cannot cancel it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
              example:
                code: 400
                message: Reservation record already present.
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /reservation-requests/{reservationRequestsId}/reservations/{reservationId}:
    post:
      tags:
      - Housing
      summary: Link Reservation
      description: 'Link an existing reservation to a reservation request. Commonly used when a reservation was created outside
        the

        normal booking flow, such as when a guest calls the hotel directly or when staff books through the Passkey

        Call Center. Linking associates the reservation with the registration represented by the reservation request,

        enabling tracking and callback reporting.

        '
      operationId: linkReservation
      security:
      - OAuth2.clientCredentials:
        - housing/reservations-link:write
      parameters:
      - $ref: '#/components/parameters/reservationRequestsId'
      - $ref: '#/components/parameters/reservationId'
      responses:
        '204':
          description: Successfully linked reservation to reservation request.
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    delete:
      tags:
      - Housing
      summary: Unlink Reservation
      description: 'Unlink a reservation from a reservation request. Commonly used when a linked reservation has been cancelled
        and

        you need to free up the reservation request so a new reservation can be linked in its place.

        Unlinking does not cancel or change the reservation itself.


        After unlinking, you can [link a new reservation](#operation/linkReservation) or allow the guest to book again using
        the reservation

        request''s `bookingSite` URL.

        '
      operationId: unlinkReservation
      security:
      - OAuth2.clientCredentials:
        - housing/reservations-link:delete
      parameters:
      - $ref: '#/components/parameters/reservationRequestsId'
      - $ref: '#/components/parameters/reservationId'
      responses:
        '204':
          description: Successfully removed link between reservation request and reservation.
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /reservations:
    post:
      tags:
      - Housing
      summary: Create Reservation
      description: 'Create a hotel reservation in a housing event based on the details provided in the request body. This
        endpoint

        directly creates a hotel booking on behalf of a guest. Requires a valid hotel ID, room type ID, and guest

        details (including arrival and departure dates).


        To generate a booking URL that guests complete themselves, use [Create Reservation Request](#operation/createReservationRequest)
        instead.

        '
      operationId: createReservation
      security:
      - OAuth2.clientCredentials:
        - housing/reservations:write
      requestBody:
        description: Reservation you are creating.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-reservation'
      responses:
        '200':
          description: Successfully created the reservation.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /reservations/{reservationId}:
    get:
      tags:
      - Housing
      summary: Get Reservation
      description: 'Get reservation details for the given reservation ID. Commonly used in response to

        [Passkey callbacks](/docs/passkey/REST/callbacks), where a callback payload includes the reservation ID.

        Call this endpoint to retrieve the full reservation details after receiving a callback notification.

        '
      operationId: getReservation
      security:
      - OAuth2.clientCredentials:
        - housing/reservations:read
      parameters:
      - $ref: '#/components/parameters/reservationId'
      responses:
        '200':
          description: Successfully returned reservation details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    delete:
      tags:
      - Housing
      summary: Cancel Reservation
      description: 'Cancel a reservation for the given reservation ID. Cancelling a reservation does not cancel the linked

        reservation request. If you need to also [cancel the reservation request](#operation/cancelReservationRequest), do
        so separately. After cancellation,

        [unlink the reservation](#operation/unlinkReservation) from its reservation request so you can link a new one.

        '
      operationId: cancelReservation
      security:
      - OAuth2.clientCredentials:
        - housing/reservations:delete
      parameters:
      - $ref: '#/components/parameters/reservationId'
      responses:
        '204':
          description: Successfully cancelled reservation.
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    put:
      tags:
      - Housing
      summary: Update Reservation
      description: 'Updates an existing reservation for the given reservation ID. This is a synchronous operation that returns

        the updated reservation in the response. The request body must include the full reservation object.

        Use [Get Reservation](#operation/getReservation) to retrieve the current reservation before making changes.


        To update stay dates, room type, or guest details, include all required fields in the request body.

        '
      operationId: updateReservationSync
      security:
      - OAuth2.clientCredentials:
        - housing/reservations:write
      parameters:
      - $ref: '#/components/parameters/reservationId'
      requestBody:
        description: Updated reservation data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-reservation'
      responses:
        '200':
          description: Successfully updated reservation details.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-reservation'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    existing-reservation:
      type: object
      title: ExistingReservation
      description: Details about existing reservation.
      allOf:
      - $ref: '#/components/schemas/Reservation'
      required:
      - id
      - sendAcknowledgement
      - startDate
      - endDate
      - numberOfAdults
      - numberOfChildren
      - guests
      - bookingSite
      - housingEvent
      - hotel
      - attendeeType
      - roomType
      properties:
        housingEvent:
          description: Information about Passkey event for this reservation.
          type: object
          allOf:
          - readOnly: true
          - $ref: '#/components/schemas/HousingEventId'
        hotel:
          $ref: '#/components/schemas/HotelInfo'
        totalCharges:
          description: Calculated total charges for this reservation.
          type: object
          allOf:
          - readOnly: true
          - $ref: '#/components/schemas/ReservationTotalCharges'
        bookingSite:
          $ref: '#/components/schemas/BookingWebsiteLink'
        callCenter:
          $ref: '#/components/schemas/CallCenterLink'
        bookingContact:
          description: Booking contact information.
          type: object
          required:
          - id
          properties:
            id:
              description: Group booking ID.
              type: string
              example: 323CZK3H
        addOns:
          description: List of room add-ons.
          type: array
          items:
            $ref: '#/components/schemas/AddOn'
        blockCode:
          description: Block Code. DEPRECATED - use attendee type and room type to identify block code instead.
          type: string
          example: '85439769333'
          deprecated: true
    room-inventory:
      description: Room inventory details for single night.
      type: object
      required:
      - housingEvent
      - hotel
      - roomType
      - date
      allOf:
      - $ref: '#/components/schemas/inventory-details'
      properties:
        housingEvent:
          $ref: '#/components/schemas/HousingEventId'
        hotel:
          $ref: '#/components/schemas/HotelId'
        roomType:
          $ref: '#/components/schemas/RoomId'
        date:
          description: Inventory date.
          type: string
          format: date
          example: '2024-12-01'
        freeSell:
          description: Number of inventory that can be sold to any attendee type.
          type: integer
          example: 80
        unassigned:
          description: Number of unassigned inventory. Inventory left in unassigned will not be sold until allocated to an
            attendee type or marked for free-sell to any attendee type.
          type: integer
          example: 20
        allocation:
          description: Inventory allocation by attendee type.
          type: array
          items:
            $ref: '#/components/schemas/InventoryAllocation'
          minItems: 1
    housing-event-hotels-list:
      type: object
      title: HotelsList
      description: List of hotels associated with a particular housing event.
      required:
      - paging
      - data
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/housing-event-hotel'
          description: List of hotels associated with a particular housing event.
    HousingEventStatus:
      description: Housing event status.
      title: HousingEventStatus
      type: string
      enum:
      - Open
      - PreOpen
      - Closed
      - Cancelled
      - New
    TravelDepartureArrival:
      title: TravelDepartureArrival
      type: object
      description: Common object that holds travel departure/arrival information.
      properties:
        time:
          description: The ISO 8601 formatted date.
          type: string
          format: date-time
          example: '2024-12-01T00:00:00Z'
        carrier:
          description: ICAO code.
          type: string
          example: JBU
          maxLength: 3
        carrierNumber:
          description: Carrier number.
          type: string
          example: '12345'
          maxLength: 32
    RoomId:
      type: object
      title: RoomId
      description: Contains unique ID of the room.
      required:
      - id
      properties:
        id:
          description: The unique ID of the room.
          type: integer
          example: 11549984
    OtherPay:
      description: Other payment details.
      title: OtherPay
      type: object
      properties:
        amount:
          description: Amount paid.
          type: integer
          example: 0
        paymentDate:
          description: Payment due date or date of payment.
          type: string
          example: '2021-12-31'
          format: date
        referenceItem:
          description: Payment reference item.
          type: string
          example: Reference Item
        checkNumber:
          description: Pay check number.
          type: string
          example: Check Num
        received:
          description: True indicates a payment was received.
          type: boolean
          example: false
        note:
          description: Payment note.
          type: string
          example: No Comment
          maxLength: 250
    ReservationNightRate:
      description: Rate details for a single reservation night.
      title: ReservationNightRate
      type: object
      required:
      - base
      - currency
      allOf:
      - $ref: '#/components/schemas/night-rate'
      properties:
        additionalGuestFees:
          description: List of additional guest fees.
          type: array
          items:
            $ref: '#/components/schemas/AdditionalGuestFees'
          maxItems: 4
        displayRate:
          $ref: '#/components/schemas/DisplayRate'
    Venue:
      title: Venue
      description: Event venue details.
      type: object
      properties:
        name:
          description: Venue name.
          type: string
          example: Holiday Inn
        address:
          $ref: '#/components/schemas/VenueAddress'
    ReservationContact:
      title: ReservationContact
      description: Reservation contact details for this event.
      type: object
      properties:
        phone:
          description: Phone number.
          type: string
          example: 2345239540-123
        fax:
          description: Fax number.
          type: string
          example: 25123-234-12
        tollFree:
          description: Toll-free number.
          type: string
          example: 323-324
        email:
          description: Email address.
          type: string
          example: venue@example.com
    RewardProgram:
      title: RewardProgram
      type: object
      description: Represents reward program information.
      required:
      - id
      properties:
        id:
          description: Reward ID.
          type: integer
          example: 10000
        name:
          description: Reward name.
          type: string
          example: Test name
    BookingWebsiteLink:
      type: object
      title: BookingWebsiteLink
      description: Unique URL for a guest to access a reservation in Passkey's booking tool.
      readOnly: true
      allOf:
      - $ref: '#/components/schemas/Link'
      example:
        href: https://book.passkey.com/entry?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJwYXlsb2FkIjp7ImVudHJ5IjoiUkVHSVNUUkFUSU9OIiwicGFyYW1zIjpbeyJuYW1lIjoiYnJpZGdlSWQiLCJ2YWx1ZSI6IlQ3VFdNTEhQLUdFNEQifV19fQ.7sH1gO_1Aambk-SRRlO2c7ac2DOpqLmCB-zsxB71q_A
    AttendeeType:
      title: AttendeeType
      description: Attendee type details.
      type: object
      allOf:
      - $ref: '#/components/schemas/AttendeeTypeId'
      required:
      - id
      - name
      - codes
      properties:
        name:
          description: The name of the attendee type.
          type: string
          example: Staff
        codes:
          description: A list of attendee type codes.
          type: array
          minItems: 1
          maxItems: 6
          items:
            description: An attendee type code.
            type: string
            example: PEWATT0524317
    CustomFields:
      description: Custom fields.
      title: CustomFields
      type: object
      example:
        customField1: CustomField1
        customField2: CustomField2
        customField3: CustomField3
        customField4: CustomField4
        customField5: CustomField5
        customField6: CustomField6
      properties:
        customField1:
          description: Custom field 1.
          type: string
          example: CustomField1
        customField2:
          description: Custom field 2.
          type: string
          example: CustomField2
        customField3:
          description: Custom field 3.
          type: string
          example: CustomField3
        customField4:
          description: Custom field 4.
          type: string
          example: CustomField4
        customField5:
          description: Custom field 5.
          type: string
          example: CustomField5
        customField6:
          description: Custom field 6.
          type: string
          example: CustomField6
    inventory-details-list:
      type: object
      title: InventoryDetailsList
      description: List of inventory details for room type by night.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/room-inventory'
          description: List of inventory details by night.
    RoomAttendeeType:
      title: RoomAttendeeType
      description: Attendee type details specific to room.
      type: object
      allOf:
      - $ref: '#/components/schemas/AttendeeType'
      properties:
        cancelPolicy:
          description: Room cancellation policy for the attendee types.
          type: string
          example: If you wish to cancel your reservation, please do so 72 hours prior to your arrival date.
        taxPolicy:
          description: Room tax policy for the attendee types.
          type: string
          example: New York State Sales Tax is currently 8.875% per night.
    TaxAndFee:
      title: TaxAndFee
      description: A single tax or fee applicable to a room.
      type: object
      required:
      - name
      - amount
      - amountType
      - frequency
      - partOfBaseRate
      - partOfDisplayRate
      properties:
        name:
          description: Name of the tax or fee.
          type: string
          example: State Tax
        amount:
          description: Amount or percentage value of the tax or fee.
          type: number
          example: 6
        amountType:
          description: Specifies if the amount is a fixed value or a percentage.
          type: string
          enum:
          - amount
          - percentage
          example: percentage
        frequency:
          description: 'Defines how often the tax or fee is applied.

            - per_guest: Applied per guest.

            - per_room: Applied per room.

            - per_night: Applied per night.

            - per_stay: Applied per stay.'
          type: string
          enum:
          - per_guest
          - per_room
          - per_night
          - per_stay
          example: per_room
        partOfBaseRate:
          description: 'Indicates if the tax or fee is included in the base room rate set by the hotel (before any taxes or
            fees are applied).


            - true: The tax or fee is already part of the nightly rate set by the hotel.

            - false: The tax or fee will be added to the hotel nightly rate as a separate charge.'
          type: boolean
          example: false
        partOfDisplayRate:
          description: 'Indicates if the tax or fee is included in the displayed rate shown to the guest.


            - true: The tax or fee is included in the displayed rate as part of the room rate. (Displayed rate = base room
            rate + tax/fee.)

            - false: The tax or fee is listed separately at the end of the booking process. (Displayed rate is the room rate
            only.)'
          type: boolean
          example: false
    Locale:
      title: Locale
      description: Locale code
      type: string
      example: en-US
      minLength: 1
      maxLength: 200
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
    CallCenterLink:
      type: object
      title: CallCenterLink
      description: Unique URL for Passkey users (rather than guests) to access a reservation in Passkey's call center tool.
      readOnly: true
      allOf:
      - $ref: '#/components/schemas/Link'
      example:
        href: https://manage.passkey.com/Login?src=api&redirect=ccbridge&regacknumber=WODS7LK4-GA8C
    HotelId:
      type: object
      title: HotelId
      description: Contains unique ID of the hotel.
      required:
      - id
      properties:
        id:
          description: The unique ID of the hotel.
          type: integer
          example: 49543342
    RoomCategoryId:
      type: object
      title: RoomCategoryId
      description: Contains the unique ID of the room category.
      required:
      - id
      properties:
        id:
          description: The unique ID of the room category.
          type: integer
          example: 12345
    ReservationRequestStatus:
      title: ReservationRequestStatus
      description: Reservation request status.
      readOnly: true
      type: string
      enum:
      - Active
      - Cancel
    TokenizedCreditCard:
      description: Credit card info.
      title: Tokenized Credit Card
      type: object
      required:
      - paymentToken
      allOf:
      - $ref: '#/components/schemas/CreditCard'
      properties:
        number:
          description: Credit card number. DEPRECATED - use 'lastFour' instead.
          type: string
          example: '************1111'
          readOnly: true
          deprecated: true
        lastFour:
          description: Last four digits of the credit card number.
          type: string
          example: '1111'
          readOnly: true
        expiration:
          description: Card expiration date.
          type: string
          example: '2021-12-31'
          format: date
          readOnly: true
        paymentToken:
          description: Credit card token. Use Tokenization API to generate.
          type: string
          writeOnly: true
          example: '1234567890'
    InventoryAllocation:
      description: Inventory allocation for specific attendee type.
      title: InventoryAllocation
      type: object
      required:
      - attendeeType
      - openForReservation
      allOf:
      - $ref: '#/components/schemas/inventory-details'
      properties:
        attendeeType:
          $ref: '#/components/schemas/AttendeeTypeId'
        openForReservation:
          description: Indicates if this night is available for sale.
          type: boolean
          example: true
        freeSellEnabled:
          description: Indicates if free-sell is enabled for this night, which allows any attendee type to purchase the room.
          type: boolean
          example: true
        sellHighestRate:
          description: Indicates if this night inventory should be sold by highest possible rate.
          type: boolean
          example: false
        waitListEnabled:
          description: Indicates if wait list is enabled for this night.
          type: boolean
          example: false
        guaranteed:
          description: Indicates if attendee has guaranteed their blocks. Enabling this option will ensure that any unsold
            guaranteed rooms will be included in the total pickup.
          type: boolean
          example: true
        arrivals:
          description: Number of reservations starting from this night.
          type: integer
          example: 10
          minimum: 0
    inventory-details:
      description: Inventory details for single night.
      type: object
      required:
      - rate
      - currentBlock
      - pickup
      - available
      properties:
        hideRates:
          description: Indicates if rates are hidden on booking site for this night.
          type: boolean
          example: false
        rate:
          $ref: '#/components/schemas/night-rate'
        originalBlock:
          description: Number of inventory blocked on event creation.
          type: integer
          example: 100
          minimum: 0
        currentBlock:
          description: Current inventory number.
          type: integer
          example: 150
          minimum: 0
        pickup:
          description: Number of rooms sold.
          type: integer
          example: 50
          minimum: 0
        finalPickup:
          description: Reported number of sold rooms.
          type: integer
          example: 45
          minimum: 0
        maxGuests:
          $ref: '#/components/schemas/MaxGuests'
        minLengthOfStay:
          description: Minimum number nights of stay when starting from this night.
          type: integer
          example: 1
          minimum: 1
          maximum: 10
        waitListRequests:
          description: Number of reservations in wait list.
          type: integer
          example: 1
          minimum: 0
        available:
          description: Number of unsold rooms.
          type: integer
          example: 30
    night-rate:
      description: Rate details for single night.
      type: object
      required:
      - base
      - currency
      properties:
        base:
          description: Base rate.
          type: number
          example: 150
        currency:
          $ref: '#/components/schemas/Currency1'
    rooms-sort-type:
      description: 'Rooms sort type. CustomOrder: A user-defined sort order. PriceAscending: Data sorted with lowest price
        first. PriceDescending: Data sorted by highest price first.'
      type: string
      enum:
      - CustomOrder
      - PriceAscending
      - PriceDescending
    ReservationPaymentInfo:
      description: Payment information.
      title: Reservation Payment Info
      allOf:
      - $ref: '#/components/schemas/PaymentInfo'
      properties:
        creditCard:
          $ref: '#/components/schemas/TokenizedCreditCard'
    credit-card-types:
      description: Credit card type.
      type: string
      enum:
      - VISA
      - MasterCard
      - AmericanExpr
      - Discover
      - DinersClub
      - JCB
      - UnionPay
      - AliPay
      - NotSupported
    PaymentInfo:
      description: Payment information.
      title: PaymentInfo
      type: object
      properties:
        paymentType:
          $ref: '#/components/schemas/payment-types'
        fullName:
          description: Full name.
          type: string
          example: Gustav Schultz
        address:
          $ref: '#/components/schemas/Address3'
        phone:
          description: Phone number.
          type: string
          example: (231)213-1222
        other:
          $ref: '#/components/schemas/OtherPay'
    HotelInfo:
      title: HotelInfo
      type: object
      description: Hotel information.
      readOnly: true
      allOf:
      - $ref: '#/components/schemas/HotelId'
      properties:
        name:
          description: Hotel name.
          type: string
          example: Northern Hotel
    DisplayRate:
      description: The room rate displayed to guests, which includes any fees configured to display in the hotel tax settings.
      title: DisplayRate
      type: number
      example: 150
    RoomInfo:
      title: RoomInfo
      type: object
      description: Room information.
      allOf:
      - $ref: '#/components/schemas/RoomId'
      properties:
        name:
          description: Room name.
          type: string
          example: King
          readOnly: true
        roomCategory:
          $ref: '#/components/schemas/RoomCategory'
    AdditionalGuestFees:
      title: AdditionalGuestFees
      description: Details about additional fees for extra guests.
      type: object
      required:
      - guestCount
      - fee
      properties:
        guestCount:
          description: The number of guests for which the additional fee applies.
          type: integer
          example: 2
          minimum: 2
          maximum: 5
        fee:
          description: The value of the additional fee for extra guests.
          type: number
          example: 20
    AttendeeTypeId:
      type: object
      title: AttendeeTypeId
      description: Contains the unique ID of the attendee type.
      required:
      - id
      properties:
        id:
          description: The unique ID of the attendee type.
          type: integer
          example: 34549966
    Address3:
      title: Address
      description: Address details. Required to create/update a guest's reservation if the hotel/event requires an address
        in reservations.
      type: object
      properties:
        address1:
          description: Address line 1.
          type: string
          example: West St. 1
        address2:
          description: Address line 2.
          type: string
          example: Apt. 16
        city:
          description: City name.
          type: string
          example: Austin
        region:
          description: Region name.
          type: string
          example: Texas
        regionCode:
          description: Region code.
          type: string
          example: TX
        postalCode:
          description: Postal code.
          type: string
          example: 23452AB
        country:
          description: Country name.
          type: string
          example: United States of America
        countryCode:
          description: ISO 3166 alpha-2 country code.
          type: string
          example: US
    ReservationGuest:
      type: object
      title: ReservationGuest
      description: Guest details for confirmed reservation.
      required:
      - firstName
      - lastName
      - arrival
      - departure
      - email
      allOf:
      - $ref: '#/components/schemas/Guest1'
      properties:
        ageQualifyingCode:
          description: Code that specifies if the guest is an adult or child. (10 - adult, 8 - child)
          type: integer
          enum:
