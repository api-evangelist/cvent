openapi: 3.0.2
info:
  title: Cvent REST APIs — Badge Print Job
  version: ea
  description: Badge print jobs can be scheduled to a printer pool, so a printer in the printer pool can consume the job and
    print the badge.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Badge Print Job
  description: Badge print jobs can be scheduled to a printer pool, so a printer in the printer pool can consume the job and
    print the badge.
paths:
  /events/{eventId}/badge-print-jobs:
    parameters:
    - $ref: '#/components/parameters/eventId'
    post:
      summary: Create Badge Print Job
      description: Creates a new badge print job
      operationId: createBadgePrintJob
      tags:
      - Badge Print Job
      security:
      - OAuth2.clientCredentials:
        - remote-printing/badge-print-jobs:write
      - OAuth2.authorizationCode:
        - remote-printing/badge-print-jobs:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/badge-print-job-created'
      responses:
        '201':
          description: Successfully created a badge print job.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badge-print-job-created'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    get:
      summary: List Badge Print Jobs
      description: Gets a paginated list of badge print jobs for a given event.
      operationId: getEventBadgePrintJobs
      tags:
      - Badge Print Job
      security:
      - OAuth2.clientCredentials:
        - remote-printing/badge-print-jobs:read
      - OAuth2.authorizationCode:
        - remote-printing/badge-print-jobs:read
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - name: filter
        in: query
        required: false
        description: 'A filter query string narrows search results and supports the combination of logical and comparison
          operators.

          The filter adheres to the pattern filter=''field'' comparisonType ''value''.


          These are the comparison types that can be used in filter expressions:

          * equal: eq

          * not equal: ne


          The following fields are filterable:

          * id (eq|ne)

          * pool.id (eq|ne)

          * printer.id (eq|ne)

          * status (eq|ne)

          '
        schema:
          type: string
          example: poolId eq '{UUID}' and status eq 'ASSIGNED'
      responses:
        '200':
          description: Successfully retrieved a paginated list of badge print jobs.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badge-print-jobs-paginated-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{eventId}/badge-print-jobs/{jobId}:
    parameters:
    - $ref: '#/components/parameters/eventId'
    - $ref: '#/components/parameters/jobId1'
    get:
      summary: Get Badge Print Job
      description: Gets a badge print job
      operationId: getBadgePrintJob
      tags:
      - Badge Print Job
      security:
      - OAuth2.clientCredentials:
        - remote-printing/badge-print-jobs:read
      - OAuth2.authorizationCode:
        - remote-printing/badge-print-jobs:read
      responses:
        '200':
          description: Successfully retrieved a badge print job.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existing-badge-print-job'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    BadgePrintJobStatus:
      title: BadgePrintJobStatus
      enum:
      - Scheduled
      - Rescheduled
      - Assigned
      - Failed
      - Done
      - Canceled
      description: This is used to indicate the status of the badge print job.
      example: Scheduled
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    UUIDProperty1:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      readOnly: true
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    badge-print-jobs-paginated-response:
      title: BadgePrintJobsPaginatedResponse
      description: Page of Badge Print Jobs.
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/existing-badge-print-job'
          description: Collection of badge print jobs.
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    BadgePrinterPoolRef:
      title: BadgePrinterPoolRef
      description: Reference to a Badge Print Pool.
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
    badge-print-job-created:
      title: BadgePrintJobCreated
      description: The Badge Print Job that was created.
      type: object
      required:
      - pool
      - badgeId
      properties:
        id:
          $ref: '#/components/schemas/UUIDProperty1'
        status:
          $ref: '#/components/schemas/BadgePrintJobStatus'
        pool:
          $ref: '#/components/schemas/BadgePrinterPoolRef'
        badgeId:
          type: string
          description: A unique id of the attendee for badge printing, which could be confirmation number or secured badge
            id depending on whether secured badge id is enabled
          maxLength: 36
          example: VNNDLJ6DKVK
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
    BadgePrintJobErrorCode:
      title: BadgePrintJobErrorCode
      enum:
      - BadgeNotFound
      - BadgeRenderIssue
      - Connection
      - PrinterError
      - AttendeeDataMissing
      - Unknown
      type: string
      description: This is used to indicate the error code returned from a badge printer.
      example: Connection
    BadgePrinter:
      title: BadgePrinter
      description: An entity that represents a badge printer.
      required:
      - id
      - name
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        name:
          type: string
          description: The name of the printer that will be displayed to attendees.
          example: Printing Station 1
          maxLength: 100
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    existing-badge-print-job:
      title: ExistingBadgePrintJob
      description: Badge Print Job.
      type: object
      required:
      - id
      - status
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        status:
          $ref: '#/components/schemas/BadgePrintJobStatus'
        pool:
          type: object
          allOf:
          - $ref: '#/components/schemas/BadgePrinterPoolRef'
          readOnly: true
          description: A unique identifier of the badge printer pool.
        badgeId:
          type: string
          description: A unique id of the attendee for badge printing, which could be confirmation number or secured badge
            id depending on whether secured badge id is enabled
          maxLength: 36
          readOnly: true
          example: VNNDLJ6DKVK
        printer:
          type: object
          description: Badge Print Jobs.
          allOf:
          - $ref: '#/components/schemas/BadgePrinter'
          readOnly: true
        code:
          $ref: '#/components/schemas/BadgePrintJobErrorCode'
        message:
          type: string
          maxLength: 500
          description: A human readable message that summarizes the context, cause, and general solution for the error at
            hand.
          example: The printer is out of paper. Please contact an onsite staff for assistance.
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2017-01-02T03:00:00Z'
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  parameters:
    token:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    jobId1:
      name: jobId
      in: path
      description: Id of a badge print job
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    eventId:
      in: path
      name: eventId
      description: Id of an event
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 100
        example: 100
  securitySchemes:
    OAuth2.clientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials Flow.
      flows:
