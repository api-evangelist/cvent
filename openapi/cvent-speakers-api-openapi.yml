      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    EventId:
      title: EventId
      description: The unique identifier for an event.
      type: string
      format: uuid
      example: 2ef03846-fced-4ce3-a077-d64ca891a4b1
    ProgramItemId:
      title: ProgramItemId
      description: The unique identifier for a program item.
      type: string
      format: uuid
      example: 221984b2-9e3e-4c1c-8ef4-306b1b75fa3e
    ProgramItemLite:
      required:
      - id
      type: object
      title: ProgramItemLite
      description: The unique identifier of a program item.
      properties:
        id:
          $ref: '#/components/schemas/ProgramItemId'
    speaker-file:
      title: SpeakerFile
      description: A file reference related to a speaker.
      required:
      - file
      - href
      properties:
        file:
          properties:
            id:
              $ref: '#/components/schemas/uuid-property'
        href:
          format: uri
          type: string
          description: URL of the speaker's image.
          readOnly: true
          example: https://custom.cvent.com/a5154f85f71a4cf2464e037feb75b308/00000000000000000000000000000000/files/universal-file/tmp/e209d73d845746b7a6deda4da9d91b2c.png
        friendlyName:
          type: string
          description: Friendly name of the file
          example: Important Document
          readOnly: true
        type:
          type: string
          description: Mime type of the file
          example: image/png
          readOnly: true
        size:
          type: integer
          description: Size of the file in bytes
          example: 150
          readOnly: true
        displayEnabled:
          type: boolean
          description: Display this file to the public
          example: true
          readOnly: true
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    SessionId:
      title: SessionId
      description: The unique identifier for a session.
      type: string
      format: uuid
      example: 832cb481-74c5-4859-ba21-bbb5be8b86e0
    speaker-paginated-response:
      title: SpeakerPaginatedResponse
      description: The response from a request to get the list of speakers.  This includes the paging object as well as the
        collection of speakers.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/existing-speaker'
          description: Collection of speakers.
    SessionLite:
      required:
      - id
      type: object
      title: SessionLite
      description: The unique identifier of a session.
      properties:
        id:
          $ref: '#/components/schemas/SessionId'
    SpeakerId:
      title: SpeakerId
      description: The unique identifier for a speaker.
      type: string
      format: uuid
      example: 6077a9f1-a230-40cd-9e32-b493a84aaa80
    filter:
      title: A filter sent in the body of a request
      description: A filter which is sent through the body of the request.
      type: object
      properties:
        filter:
          type: string
          example: property eq 'value'
          description: Filter included in the request.
    existing-speaker-category:
      title: SpeakerCategory
      description: An existing speaker category.
      type: object
      allOf:
      - $ref: '#/components/schemas/speaker-category'
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        active:
          type: boolean
          description: The speaker category is active or not active
          readOnly: true
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    EventLite:
      required:
      - id
      type: object
      title: EventLite
      description: The unique identifier of an event.
      properties:
        id:
          $ref: '#/components/schemas/EventId'
    program-item-speaker-paginated-response:
      title: ProgramItemSpeakerPaginatedResponse
      description: The response from a request to get the list of program item speakers.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/speaker-program-item'
          description: Collection of program item speakers.
          maxItems: 200
    SpeakerLite:
      required:
      - id
      type: object
      title: SpeakerLite
      description: The unique identifier of a speaker.
      properties:
        id:
          $ref: '#/components/schemas/SpeakerId'
    ContactLinks:
      title: ContactLinks
      type: object
      description: Collection of social media links for the contact.
      properties:
        twitterUrl:
          $ref: '#/components/schemas/Link'
        facebookUrl:
          $ref: '#/components/schemas/Link'
        linkedInUrl:
          $ref: '#/components/schemas/Link'
        profilePicture:
          type: object
          description: Reference to a profile picture.
          title: Link
          required:
          - href
          readOnly: true
          properties:
            href:
              type: string
              description: The url of the contact's profile picture
              example: https://cvent.com/picture123
    speaker-program-item:
      title: SpeakerProgramItem
      type: object
      description: Represents a program item object that will be added to a speaker.
      required:
      - event
      - session
      - speaker
      - programItem
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          description: ID of the speaker to program item relationship.
          type: string
          format: uuid
          example: 38db6ae2-0dc3-487b-953e-86d6abbdf7d3
          readOnly: true
        event:
          $ref: '#/components/schemas/EventLite'
        session:
          $ref: '#/components/schemas/SessionLite'
        speaker:
          $ref: '#/components/schemas/SpeakerLite'
        programItem:
          $ref: '#/components/schemas/ProgramItemLite'
    NamedObject:
      title: NamedObject
      description: A Named object
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        name:
          type: string
          description: Name of the object
          example: Sample Object name
    speaker-category:
      title: SpeakerCategory
      description: A speaker category.
      type: object
      properties:
        name:
          type: string
          description: The name of the speaker category
          maxLength: 50
          example: Presenters
    SpeakerCategory:
      title: SpeakerCategory
      description: A defined speaker category.
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/uuid-property'
        name:
          type: string
          description: The name of the speaker category
          maxLength: 50
          example: Presenters
    Relevance:
      title: Relevance
      description: Returned when the `match` filter is applied. Indicates how relevant the `match` filter term is to the search
        result. Larger numbers represent higher relevance with respect to other search results in the request. Null if no
        `match` filter is provided.
      type: number
      exclusiveMinimum: true
      example: 2.3
      minimum: 0
    speaker-document-paginated-response:
      title: SpeakerDocumentPaginatedResponse
      description: The response from a request to get the list of documents for a single speaker.  This includes the paging
        object as well as the collection of documents.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/speaker-file'
          description: Collection of a speaker's documents.
    speaker-session-paginated-response:
      title: SpeakerSessionPaginatedResponse
      description: The response from a request to get the list of speaker sessions.  This includes the paging object as well
        as the collection of speaker sessions.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerSession'
          description: Collection of speaker sessions.
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    SpeakerLite1:
      required:
      - id
      type: object
      title: SpeakerLite
      description: The unique identifier of a speaker.
      properties:
        id:
          $ref: '#/components/schemas/SpeakerId1'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    existing-speaker:
      title: Speaker
      description: An existing, event speaker.
      type: object
      allOf:
      - $ref: '#/components/schemas/speaker'
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the speaker
        order:
          type: integer
          description: The order of speaker
          example: 1
          minimum: 0
          maximum: 32767
          readOnly: true
        contact:
          type: object
          title: Speaker Contact
          description: The reference to speaker contact. Contains only the Id of contact.
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
              title: Contact Id
              example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
              description: A string that has to be a format matching the industry standard uuid
    baseErrorResponse:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
    SpeakerId1:
      title: SpeakerId
      description: The unique identifier for a speaker.
      type: string
      format: uuid
    speaker-category-paginated-response:
      title: SpeakerCategoryPaginatedResponse
      description: The response from a request to get the list of speaker categories.  This includes the paging object as
        well as the collection of speaker categories.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/existing-speaker-category'
          description: Collection of speaker categories.
    speaker:
      title: Speaker
      description: An event speaker.
      type: object
      required:
      - firstName
      - lastName
      - event
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Event ID.
          description: The event the speaker is linked to.
        firstName:
          type: string
          description: The speaker's first name.
          maxLength: 30
          example: Barbra
        lastName:
          type: string
          description: The speaker's last name.
          maxLength: 50
          example: Smith
        code:
          type: string
          description: The unique code associated with the speaker in an event
          maxLength: 30
          example: sbarbra
        email:
          type: string
          format: email
          description: The speaker's email address
          maxLength: 80
          minLength: 6
          example: barbrasmith@cvent.com
        prefix:
          type: string
          description: Used to denote what is traditionally a title of an individual. For example, Mr., Mrs., Dr., etc.
          maxLength: 30
          example: Dr.
        designation:
          type: string
          description: The speaker's Designation
          maxLength: 30
          example: PhD
        company:
          type: string
          description: The company to which the speaker is associated
          maxLength: 100
          example: Cvent
        title:
          type: string
          description: The speaker's title
          maxLength: 100
          example: Lead Engineer
        category:
          $ref: '#/components/schemas/SpeakerCategory'
        links:
          $ref: '#/components/schemas/ContactLinks'
        visibility:
          type: boolean
          description: Indicates if a given speaker should be displayed on Event Website
          default: true
          example: false
        biography:
          type: string
          description: The speaker's biography
          maxLength: 2500
          example: Presentation and Speaking voice expert, Barbara is a highly regarded coach and facilitator
        internalNote:
          type: string
          description: The Internal Note of the speaker
          maxLength: 300
          example: Barbara is multilingual
        featured:
          type: boolean
          description: Indicates if a given speaker is a featured speaker
          default: false
          example: false
        relevance:
          $ref: '#/components/schemas/Relevance'
    SpeakerSession:
      title: SpeakerSession
      type: object
      description: A speaker to session relationship.
      properties:
        id:
