openapi: 3.0.2
info:
  title: Cvent REST APIs — Users
  version: ea
  description: Operations for managing account users and user groups, including creation, retrieval, update, and deletion.
    Use these endpoints to administer user access and roles within your account.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Users
  description: Operations for managing account users and user groups, including creation, retrieval, update, and deletion.
    Use these endpoints to administer user access and roles within your account.
paths:
  /account-user-groups:
    get:
      summary: List Account User Groups
      description: Gets a list of user groups in your account.
      operationId: getAccountUserGroups
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:read
      - OAuth2.clientCredentials:
        - account/user-groups:read
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token1'
      - name: filter
        in: query
        required: false
        style: form
        explode: true
        description: 'Filters narrow the results returned and support a combination of logical and comparison operators. The
          filter adheres to the pattern filter=''field'' comparisonType ''value''. The following logical operators and fields
          are supported:



          | Field Path      | Operators                          |

          |-----------------|------------------------------------|

          | name            | `in`, `eq`, `ne`, `sw`, `ew`, `co` |

          | createdBy       | `in`, `eq`, `ne`, `sw`, `ew`, `co` |

          | lastModifiedBy  | `in`, `eq`, `ne`, `sw`, `ew`, `co` |

          | created         | `eq`, `ne`, `lt`, `gt`, `le`, `ge` |

          | lastModified    | `eq`, `ne`, `lt`, `gt`, `le`, `ge` |

          '
        schema:
          type: string
          example: name eq 'My User Group'
      responses:
        '200':
          $ref: '#/components/responses/UserGroups'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    post:
      summary: Create Account User Group
      operationId: createAccountUserGroup
      description: 'Creates a new Account User Group.

        '
      tags:
      - Users
      parameters: []
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:write
      - OAuth2.clientCredentials:
        - account/user-groups:write
      requestBody:
        $ref: '#/components/requestBodies/UserGroup'
      responses:
        '200':
          $ref: '#/components/responses/UserGroup'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /account-user-groups/{userGroupId}:
    get:
      summary: Get Account User Group
      description: Gets a single account user group by its ID.
      operationId: getAccountUserGroup
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:read
      - OAuth2.clientCredentials:
        - account/user-groups:read
      parameters:
      - $ref: '#/components/parameters/userGroupId'
      responses:
        '200':
          $ref: '#/components/responses/UserGroup'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    put:
      summary: Update Account User Group
      description: Update a given account user group using details in the body of the request.
      operationId: updateAccountUserGroup
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:write
      - OAuth2.clientCredentials:
        - account/user-groups:write
      parameters:
      - $ref: '#/components/parameters/userGroupId'
      requestBody:
        $ref: '#/components/requestBodies/UserGroup'
      responses:
        '200':
          $ref: '#/components/responses/UserGroup'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    delete:
      summary: Delete Account User Group
      description: Deletes an account user group using its ID.
      operationId: deleteAccountUserGroup
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:delete
      - OAuth2.clientCredentials:
        - account/user-groups:delete
      parameters:
      - $ref: '#/components/parameters/userGroupId'
      responses:
        '204':
          description: 'No content, the group has been deleted.

            '
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /account-user-groups/{userGroupId}/users/{userId}:
    post:
      summary: Associate User to Group
      description: Associates a user to an account user group.
      operationId: addUserToAccountUserGroup
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:write
      - OAuth2.clientCredentials:
        - account/user-groups:write
      parameters:
      - $ref: '#/components/parameters/userGroupId'
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: 'No content, the user has been added to the group.

            '
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    delete:
      summary: Delete User from Group
      description: Removes a user from an account user group.
      operationId: deleteUserFromAccountUserGroup
      tags:
      - Users
      security:
      - OAuth2.authorizationCode:
        - account/user-groups:delete
      - OAuth2.clientCredentials:
        - account/user-groups:delete
      parameters:
      - $ref: '#/components/parameters/userGroupId'
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: 'No content, the user has been removed from the group.

            '
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    AccountUserGroup:
      title: Account User Group
      description: A collection of account users which is used to help manage access and visibility to various other Cvent
        domain entities like events, surveys, account emails, and more. For example, a user group can be associated to specific
        events to allow the users within that group to view the events within Cvent's platform.
      required:
      - id
      - name
      - created
      - createdBy
      - lastModified
      - lastModifiedBy
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the user group.
          example: EBF2273A-35A5-BD67-A292-397539D13270
          readOnly: true
        name:
          type: string
          description: The name of the user group.
          example: MyUserGroup
          minLength: 1
          maxLength: 50
        description:
          type: string
          description: The description of the user group.
          example: MyUserGroupDescription
          maxLength: 300
    UserGroups:
      title: User Groups
      description: A paginated result for a list of user groups.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountUserGroup'
          description: The list of user groups retrieved for the specified page.
          readOnly: true
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  parameters:
    userGroupId:
      in: path
      name: userGroupId
      description: 'The User Group''s Id.

        '
      required: true
      schema:
        type: string
        format: uuid
        example: B089AC31-1212-63FB-AAEA-382037E1BCDF
    token1:
      in: query
      name: token
      description: 'The pagination token returned from a previous call.

        This will override any other pageable parameters provided.

        '
      required: false
      style: form
      explode: true
      schema:
        type: string
        example: 1a2b3c4d5e6f7g8h9i10j11k
    userId:
      in: path
      name: userId
      description: 'The Account User''s Id.

        '
      required: true
      schema:
        type: string
        format: uuid
        example: FF8AF134-3505-4D67-AAEA-1975D8E1327C
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 100
        example: 100
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    UserGroups:
      description: List of User Groups
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserGroups'
    UserGroup:
      description: A User Group
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountUserGroup'
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  requestBodies:
    UserGroup:
      description: A User Group
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountUserGroup'
  securitySchemes:
    OAuth2.clientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials Flow.
      flows:
        clientCredentials:
          tokenUrl: https://api-platform.cvent.com/ea/oauth2/token
          scopes:
            account/hooks:delete: Allows the deletion of hooks.
            account/hooks:read: Allows the reading of hooks.
            account/hooks:write: Allows the creation/updation of hooks.
            account/user-groups:delete: Allows deletion for user groups
            account/user-groups:read: Allows the reading of user groups
            account/user-groups:write: Allows the writing of user groups
            account/users:delete: Allows the deletion of User
            account/users:read: Allows the reading of User, User Group
            account/users:write: Allows the creation/updating of User
            appointments/appointment-attendees:read: Allows the reading of appointment attendees and their related entities.
            appointments/appointment-events:read: Allows the reading of appointment events and their related entities.
            appointments/appointment-types:read: Allows the reading of appointment types and their related entities.
            appointments/appointments:read: Allows the reading of appointment and their related entities.
            appointments/appointments:write: Allows the writing of appointments and their related entities.
            appointments/available-times:read: Allows the reading of availability times.
            appointments/locations:read: Allows the reading of appointment locations and their related entities.
            attendee-insights/attendee-insights:read: Allows the reading of engagement scores (attendee insights).
            attendee-insights/scores:read: Allows the reading of scores.
            attendee-insights/stats:read: Allows the reading of engagement score (attendee insight) stats.
            budget/budget-items:delete: Allows the deletion of budget items
            budget/budget-items:read: Allows the reading of all budget items
            budget/budget-items:write: Allows creation/updation of budget item
            budget/budget-totals:read: Allows the reading of all event budget totals
            budget/budget-vendors:read: Allows reading of account-level budget vendors.
            budget/cards:read: Allows the reading of cards
            budget/currency-conversion-rate:delete: Allows deletion of currency conversion rate for currency.
            budget/currency-conversion-rate:read: Allows reading of currency conversion rate for currency.
            budget/currency-conversion-rate:write: Allows creation/update of currency conversion rate for currency.
            budget/payments:delete: Allows deletion of payments.
            budget/payments:read: Allows reading of payment for budget item.
            budget/payments:write: Allows creation of payment in a budget item.
            budget/transactions:delete: Allows delete card transactions.
            budget/transactions:read: Allows the reading of all card's transactions
