  parameters:
    contactGroupId:
      in: path
      name: id
      description: ID of a contact group.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    after:
      name: after
      required: false
      description: Used to query records that have been added or updated after this time point. Default to the beginning of
        time of the data store.
      in: query
      schema:
        type: string
        format: date-time
        example: '2017-01-02T02:00:00Z'
    includePurged:
      in: query
      required: false
      name: includePurged
      description: 'True means purged contacts can be included in the response. Purged contacts contain only limited display
        data (`id`, `lastModified`, and `purged`). When true, the filter query parameter can only filter by the `id` field.
        The `before`, `after`, `limit`, and `token` query parameters are still valid query parameters to use with this parameter.
        If false, only contacts that have not been purged will be returned.

        '
      schema:
        type: boolean
        default: false
    id:
      in: path
      name: id
      description: ID of a contact.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    before:
      name: before
      required: false
      in: query
      description: Used to query records that have been added or updated before this time point.
      schema:
        type: string
        format: date-time
        example: '2017-01-02T02:00:00Z'
    contactId:
      in: path
      name: contactId
      description: ID of a contact.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    obfuscateId:
      in: path
      name: obfuscateId
      description: ID of an obfuscation request.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    customFieldId:
      in: path
      name: customFieldId
      description: ID of a custom field.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    token:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    relatedContactId:
      in: path
      name: relatedContactId
      description: ID of a related contact.
      required: true
      schema:
        $ref: '#/components/schemas/uuid-property'
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 100
        example: 100
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
