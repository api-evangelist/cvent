      properties:
        eventId:
          type: string
          format: uuid
          description: ID of the event.
        contactId:
          type: string
          format: uuid
          description: ID of the contact.
    ContactGroupType:
      title: ContactGroupType
      enum:
      - BLACKLIST
      - DISTRIBUTION_LIST
      - STANDARD
      type: string
      description: Type of contact group. `BLACKLIST` are contacts that are not allowed to register for your events. `DISTRIBUTION_LIST`
        is a group of contacts you plan to send eMarketing emails to. `STANDARD` is a multi-purpose group for organizing contacts.
      example: STANDARD
      default: STANDARD
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    contact-patch:
      title: ContactPatch
      description: This entity is used to represent a single item that is requested for a contact patch.
      required:
      - id
      allOf:
      - $ref: '#/components/schemas/contact'
      - properties:
          company: {}
          title: {}
          _links:
            properties:
              facebookUrl:
                properties:
                  href: {}
          homeAddress:
            properties:
              address3: {}
              countryCode: {}
          dateOfBirth: {}
          gender: {}
          homePhone: {}
          socialSecurityNumber: {}
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    AddressType:
      title: AddressType
