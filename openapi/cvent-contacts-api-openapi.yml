        updatedDate:
          description: The ISO 8601 formatted date-time when the associated contact, of this single instance of change in
            contact change history, was updated.
          type: string
          format: date-time
          example: '2023-08-03T14:51:00.777Z'
        updatedBy:
          description: The name of a person who updated a contact that is associated with this single instance of change in
            contact change history.
          type: string
          example: John Doe
