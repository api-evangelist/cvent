  /contacts/{id}/custom-fields/{customFieldId}/answers:
    parameters:
    - $ref: '#/components/parameters/id'
    - $ref: '#/components/parameters/customFieldId'
    put:
      summary: Update Custom Field Answers
      description: Update custom field answers for a single custom field and single contact
      operationId: updateContactCustomFieldAnswers
      security:
      - OAuth2.clientCredentials:
        - event/contacts:write
      - OAuth2.authorizationCode:
        - event/contacts:write
      tags:
      - Contacts
      requestBody:
        description: "Custom Field answers to be updated. Answer values must be formatted correctly for a given Custom Field.\
          \ The available fields and their supported formats are listed below.\n* **Open Ended Text - Date/Time**. This field\
          \ type has several possible user-selected answer formats:\n  - Date/Time (2022-01-01T12:00:00Z). Denoted by *DateTime*\
          \ in the response payload. Milliseconds are truncated.\n  - Date (2022-01-01). Denoted by *Date* in the response\
          \ payload.\n* **Open Ended Text - One Line**. This field type has several possible user-selected answer formats:\n\
          \  - General (Text). Denoted by *General* in the response payload.\n  - Number (Whole numbers, 10, -10). Denoted\
          \ by *Number* in the response payload.\n  - Currency (Positive decimal value, 10.5). Denoted by *Currency* in the\
          \ response payload.\n  - Decimal (-20.5). Denoted by *Decimal* in the response payload.\n  - US Phone Number (123-456-7890).\
          \ Denoted by *USPhoneNumber* in the response payload.\n  - Email Address (h.potterfield@test.com). Denoted by *Email*\
          \ in the response payload.\n* **Open Ended Text - Comment Box**. Answer format is free-text (any value). Denoted\
          \ by *FreeText* in the\n    response payload.\n* **Choice - Single Answer (Drop-Down, Vertical, Horizontal).** Answer\
          \ format is exactly one response to a\n    list of user-defined choices. Denoted by *SingleSelect* in the response\
          \ payload.\n* **Choice - Multiple Answers (Multi-Select Box, Vertical, Horizontal).** Answer format is one or more\n\
          \    responses from a list of user-defined choices. Denoted by *MultiSelect* in the response payload.\n\nTo delete\
          \ a Custom Field Answer, send an empty list of answers for a given Custom Field ID.\n"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom-field'
      responses:
        '200':
          description: Successfully updated custom field answers for a contact
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-field'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /contacts/{id}/merge:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      requestBody:
        description: "Merge the 'main' contact with one or two other 'secondary' contacts. By default, the main contact's\
          \ values will be used for the merged contact if present. Otherwise, the secondary contact's value is used. For contact\
          \ memberships and contact profile image, only the main contact's data is used.\n\nWhen merging contacts that contain\
          \ secure fields, the `event/contacts:write-sensitive` scope is required.\n\n**Conflict Resolution**\n\n* **contactFields**:\
          \ A conflict arises for a contact field if it is empty in the main contact, two secondary contacts are provided,\
          \ and both secondary contacts have values for the field.\n  - You must provide the fieldName of the conflicted field\
          \ and the ID of the contact whose value is to be kept to continue with the merge.\n  - This array can also be used\
          \ to override the default behavior and choose which contact to pull values from for each contact field.\n  - The\
          \ following contact fields are supported:\n    - `sourceId`\n    - `firstName`\n    - `lastName`\n    - `prefix`\n\
          \    - `email`\n    - `ccEmail`\n    - `company`\n    - `type.id`\n    - `nickname`\n    - `title`\n    - `workPhone`\n\
          \    - `middleName`\n    - `mobilePhone`\n    - `gender`\n    - `npi`\n    - `homeFax`\n    - `designation`\n  \
          \  - `homePhone`\n    - `pager`\n    - `workFax`\n    - `lastModifiedBy`\n    - `lastModified`\n    - `created`\n\
          \    - `createdBy`\n    - `workAddress` (for address fields, the full address of work or home are taken all together\
          \ from a given contact)\n    - `homeAddress`\n    - `deleted`\n    - `optOut.date`\n    - `_links.linkedInUrl`\n\
          \    - `_links.facebookUrl`\n    - `_links.twitterUrl`\n    - `customField.{uuid of custom field}`\n* **events**:\
          \ A conflict arises for an event if it contains attendees associated with at least two of the provided contacts.\n\
          \  - You must provide the ID of the conflicted event and the ID of the contact whose attendee is to be associated\
          \ with the merged contact to continue with the merge.\n  - Attendees with a 'No Response' or 'Visited' status whose\
          \ linked contacts are not chosen in this step will be deleted. Attendees with other statuses will be kept but will\
          \ be associated with an inactive contact.\n\n* **surveys**: A conflict arises for a survey containing respondents\
          \ associated with at least two of the provided contacts.\n  - You must provide the ID of the conflicted survey and\
          \ the ID of the contact whose respondent will be associated with the merged contact to continue with the merge.\n\
          \  - Respondents with a 'No Response' or 'Visited' status whose linked contacts are not chosen in this step will\
          \ be deleted. Respondents with other statuses will be kept but will be associated with an inactive contact.\n  -\
          \ Only legacy surveys support merge functionality at this time.\n* **contactRelationships**: By default, the main\
          \ contact's relationships are carried over to the merged contact, and those of the other contact(s) are discarded.\
          \ This is the default regardless of whether the main contact has relationships or not.\n  - You can provide a secondary\
          \ contact's ID to carry over its relationships instead of the main contact. Only one contact's relationships can\
          \ be carried over.\n"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/contact-merge'
      security:
      - OAuth2.clientCredentials:
        - event/contacts:write
        - event/contacts:write-sensitive
      - OAuth2.authorizationCode:
        - event/contacts:write
        - event/contacts:write-sensitive
      summary: Merge Contacts
      description: Merges two or three contacts into a single contact.
      operationId: mergeContacts
      tags:
      - Contacts
      responses:
        '200':
          description: The successfully merged contact.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contact'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '409':
          $ref: '#/components/responses/Conflict1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /contacts/{id}/obfuscate:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      security:
      - OAuth2.clientCredentials:
        - event/contacts:write
      - OAuth2.authorizationCode:
        - event/contacts:write
      summary: Obfuscate a Contact
      description: 'Initiate obfuscation of a contact based on the given ID. Verify the status of the obfuscation using

        [Get Obfuscation Status](#operation/getContactObfuscationStatusById). Once this process succeeds, all

        the data for the contact will be obfuscated and will no longer be retrievable. See the

        [Obfuscation User Guide](https://developers.cvent.com/docs/rest-api/guides/obfuscation-guide) for

        more details.

        '
      operationId: obfuscateContactById
      tags:
      - Contacts
      responses:
        '202':
          description: Successfully initiated obfuscation of the contact. Check the <a href="#operation/getContactObfuscationStatusById">contact's
            obfuscation status</a>.
          headers:
            Location:
              example: /contacts/obfuscate/9463c74e-18c6-401a-a710-ae0f485bf059/status
              description: This is the location to check the status of the obfuscation of the contact.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contact-obfuscation-status'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '409':
          $ref: '#/components/responses/Conflict1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      deprecated: false
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /contacts/{id}/profile-images:
    parameters:
    - $ref: '#/components/parameters/id'
