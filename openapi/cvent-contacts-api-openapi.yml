        status:
          $ref: '#/components/schemas/DistributionListStatus'
    Passport:
      title: Passport
      description: This entity represents a contact's passport information.
      type: object
      properties:
        number:
          type: string
          description: "The passport number of the contact.\n\n Reading and writing of this field require the `event/contacts:read-sensitive`\
            \ and `event/contacts:write-sensitive` scopes respectively."
          example: '123456789'
          maxLength: 100
        country:
          type: string
          description: The passport country of the contact.
          example: United Kingdom
          readOnly: true
        countryCode:
          type: string
          description: The passport country code of the contact.
          example: GB
