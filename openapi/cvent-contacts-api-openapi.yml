components:
  schemas:
    contact:
      title: ExistingContact
      description: Represents a contact that has been created and has an id.
      type: object
      allOf:
      - $ref: '#/components/schemas/Contact'
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the contact.
        parentId:
          type: string
          format: uuid
          description: ID of the parent contact, applicable with contact snapshot.
          readOnly: true
        event:
          description: Event ID
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: ID of the event where the contact was created, applicable when contact snapshot is enabled for
                an event.
          readOnly: true
    ContactMembership:
      title: ContactMembership
      description: Contact Membership information
      type: object
      readOnly: true
      properties:
        type:
          type: string
          description: The type of membership the contact has signed up for.
          maxLength: 300
          example: Corporate Sponsor
        plan:
          type: string
          description: Describes the specific plan the contact has signed up for.
          maxLength: 300
          example: Gold Level
        joined:
          type: string
          format: date
          description: The ISO-8601 formatted date the contact began their membership.
          readOnly: true
          example: '2017-02-10'
        expiration:
          type: string
          format: date
          description: The ISO-8601 formatted date the contact's membership will expire.
          readOnly: true
          example: '2020-02-09'
        lastRenewal:
          type: string
          format: date
          description: The ISO-8601 formatted date the contact last renewed their membership.
          readOnly: true
          example: '2019-02-08'
        amountDue:
          type: number
          description: The amount currently due for this membership.
          readOnly: true
          minimum: 0
          example: 50.5
        listInDirectory:
          type: boolean
          description: Indicates if the member details should be included in the member directory.
          example: false
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    CustomFieldBase:
      title: CustomFieldBase
      description: Base schema for Custom Field - allows type to be customized by extending schemas
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The unique ID representing this custom field.
          format: uuid
        name:
          type: string
          description: The actual text of the custom field.
          example: What is your favorite color?
          readOnly: true
        value:
          type: array
          uniqueItems: true
          items:
            type: string
            description: A question answer value
            maxLength: 16000
          description: The set of answers or possible answers to a question.
          example:
          - Choice C
          - Choice A
        order:
          type: integer
          description: The order of this question in the bigger list of questions.
          example: 1
          readOnly: true
    contact-id-paginated-response:
      title: ContactIdPaginatedResponse
      description: The response from a request to get the ids of contacts in a contact group or relationship. This includes
        the paging object as well as the collection of contact ids.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/IdOnlyEntity'
          description: Collection of contact ids.
    Gender:
      title: Gender
      enum:
      - Male
      - Female
      - Non-binary
      - Rather not say
      type: string
      description: The gender of the contact.
      example: Male
    custom-field:
      title: CustomField
      description: A Custom Field
      type: object
      allOf:
      - $ref: '#/components/schemas/CustomFieldBase'
      properties:
        type:
          description: The type of data collected by a custom field.
          type: string
          allOf:
          - $ref: '#/components/schemas/CustomFieldType'
          - readOnly: true
            example: MultiSelect
    contact-bulk-update:
      type: array
      items:
        $ref: '#/components/schemas/contact-update'
    contact-group:
      title: ContactGroup
      required:
      - id
      - name
      description: A group of contacts.
      allOf:
      - $ref: '#/components/schemas/Audit'
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the contact group.
          readOnly: true
        name:
          type: string
          description: Name of the contact group.
          maxLength: 100
          example: group name
        shortDescription:
          type: string
          description: Short description of the contact group.
          example: short description
        description:
          type: string
          description: Full description of the contact group.
          example: long description
        type:
          $ref: '#/components/schemas/ContactGroupType'
        note:
          deprecated: true
          type: string
          description: Moved to internalNote in the DistributionListInfo object. The note field only applies to Distribution
            List.
          example: Sample internal note
        distributionListInfo:
          $ref: '#/components/schemas/DistributionListInfo'
    contact-group-paginated-response:
      title: ContactGroupPaginatedResponse
      description: The response from a request to get the list of contact groups.  This includes the paging object as well
        as the collection of contact-groups.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/contact-group'
          description: Collection of contact groups.
    CustomFieldType:
      title: CustomFieldType
      enum:
      - AutoIncrement
      - ConsentQuestion
      - Currency
      - Decimal
      - Date
      - DateTime
      - Email
      - FileUpload
      - FreeText
      - General
      - MultiChoice
      - MultiSelect
      - Number
      - OpenEndedDateTime
      - OpenEndedText
      - SingleChoice
      - SingleSelect
      - USPhoneNumber
      - Unknown
      type: string
      description: The type of data collected by a custom field.
      example: General
    ContactId:
      title: ContactId
      description: A contact id.
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the contact.
    uuid-property:
