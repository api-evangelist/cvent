          maxLength: 3
    Compliance:
      title: Compliance
      description: Privacy compliance fields for a contact.
      type: object
      properties:
        creationTime:
          type: string
          format: date-time
          description: Date-time (in GMT) when privacy compliance details were created for the contact.
          example: '2021-03-08T17:30:01.727Z'
        complianceScope:
          type: string
          description: Scope of privacy compliance.
          example: CCPA
          enum:
          - CCPA
        action:
          type: string
          description: Action to take for a compliance request.
          example: DO_NOT_SELL
          enum:
          - DO_NOT_SELL
          - OK_TO_SELL
        createdBy:
          type: string
          description: Denotes how the compliance request was created.
          example: PLANNER
          enum:
          - ATTENDEE
          - PLANNER
          - IMPORT
          - SOAP_API
          - REST_API
          - MARKETO
          - SALEFORCE
          - VIDEO_CENTER_MEMBER
          - RESPONDENT
          - NOT_SET
    IdOnlyEntity:
