      allOf:
      - $ref: '#/components/schemas/Contact'
      properties:
        parentId:
          deprecated: true
          type: string
          format: uuid
          description: ID of the parent contact, applicable with contact snapshot. This field has been deprecated. If the
            event has contact snapshot enabled, snapshot will be automatically created through the Add attendees API.
        event:
          deprecated: true
          description: Event ID
          type: object
          properties:
            id:
              deprecated: true
              type: string
              format: uuid
              description: ID of the event where the contact was created, applicable when contact snapshot is enabled for
                an event. This field has been deprecated. If the event has contact snapshot enabled, snapshot will be automatically
                created through the Add attendees API.
    Address:
      title: Address
