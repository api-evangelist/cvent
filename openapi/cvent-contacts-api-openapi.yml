      type: object
      allOf:
      - $ref: '#/components/schemas/BaseAddress'
      properties:
        region:
          type: string
          description: The name of the state/province/region of the address.
          readOnly: true
          example: Texas
        regionCode:
          type: string
          description: The abbreviation of the state/province/region of the address.
          minLength: 2
          maxLength: 10
          example: TX
        country:
          type: string
          description: Name of the country of the address.
          readOnly: true
          example: United States of America
    DistributionListStatus:
      title: DistributionListStatus
      enum:
      - PENDING
      - PROCESSING
      - COMPLETE
      type: string
      description: Type of distribution list status.
      readOnly: true
      example: PENDING
    contact-bulk-patch:
      type: array
      items:
        $ref: '#/components/schemas/contact-patch'
    EventContactId:
      title: EventContactId
