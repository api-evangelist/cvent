    BaseAddress:
      title: Base Address
      description: Base Address Model
      type: object
      properties:
        address1:
          type: string
          maxLength: 40
          description: The first line of an address.
          example: Cvent Inc.
        address2:
          type: string
          maxLength: 40
          description: The second line of an address.
          example: 4001 West Parmer Lane
        address3:
          type: string
          maxLength: 40
          description: The third line of an address.
          example: PO Box 123
        city:
          type: string
          maxLength: 40
          description: The name of the city.
          example: Austin
        countryCode:
          type: string
          maxLength: 3
          minLength: 2
          description: ISO 3166 two-letter (alpha-2) country code.
          example: US
        postalCode:
          type: string
          maxLength: 25
          description: Postal code (also known as zipcode) of the address.
          example: '78727'
    contact-type-paginated-response:
      title: ContactTypePaginatedResponse
      description: The response from a request to get the list of contact types. This includes the paging object as well as
        the collection of contact-types.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactType'
          description: Collection of contact types.
    Contact:
      title: Contact
      description: Represents a contact and their related information.
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        firstName:
          type: string
          description: The first name of the contact.
          maxLength: 30
          example: Henry
        lastName:
          type: string
          description: The last name of the contact.
          maxLength: 50
          example: Potterfield
        middleName:
          type: string
          description: The middle name of the contact.
          maxLength: 30
          example: A
        nickname:
          type: string
          description: The nickname of the contact.
          maxLength: 30
          example: Harry
        email:
          type: string
          format: email
          description: The email address of the contact.
          minLength: 6
          maxLength: 80
          example: h.potterfield@test.com
        ccEmail:
          type: string
          format: email
          description: An alternate email address of the contact that can be cc'd on email communications.
          minLength: 6
          maxLength: 80
          example: h.porter@tesing.com
        gender:
          $ref: '#/components/schemas/Gender'
        company:
          type: string
          description: The company/organization the contact belongs to.
          maxLength: 100
          example: Cvent Inc.
        designation:
          type: string
          description: The designation of the contact, typically an award or credential.
          maxLength: 30
          example: CPA
        title:
          type: string
          description: The job title of the contact.
          maxLength: 100
          example: Event Planner
        type:
          $ref: '#/components/schemas/AttendeeContactType'
        membership:
          $ref: '#/components/schemas/ContactMembership'
        primaryAddressType:
          $ref: '#/components/schemas/AddressType'
        homeAddress:
          $ref: '#/components/schemas/Address'
        homePhone:
          type: string
          description: The phone number of the contact at their place of residence.
          maxLength: 30
          example: 555-555-5555
        homeFax:
          type: string
          description: The fax number of the contact at their place of residence.
          maxLength: 30
          example: 555-555-5555
        workAddress:
          $ref: '#/components/schemas/Address'
        workPhone:
          type: string
          description: The phone number of the contact at their place of work.
          maxLength: 30
          example: 555-555-5555
        workFax:
          type: string
          description: The fax number of the contact at their place of work.
          maxLength: 30
          example: 555-555-5555
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/custom-field'
          description: Collection of custom fields.
          readOnly: true
        sourceId:
          description: 'This is a ID for the contact in an external system. NOTE: This value is expected to be unique for
            each contact within an account. Consider adding the external system name as part of the ID.'
          type: string
          maxLength: 50
          example: system-a-00000000-0000-0000-0000-000000000000
        mobilePhone:
          type: string
          description: The contact's mobile phone number.
          maxLength: 30
          example: 555-555-5555
        compliance:
          type: array
          items:
            $ref: '#/components/schemas/Compliance'
          description: Detail related to compliance with the contact's privacy rights under various legislation.
          readOnly: true
        prefix:
          type: string
          description: Denotes what is traditionally a title of an individual.
          maxLength: 30
          example: Mr.
        pager:
          type: string
          description: The pager number of the contact.
          maxLength: 30
          example: 555-555-5555
        deleted:
          type: boolean
          description: True indicates a contact is deleted. Deleted contacts still have their data retained, but the contact
            is inactive.
          default: false
          example: false
          readOnly: true
        purged:
          type: boolean
          description: True indicates a contact is purged. Purged contacts have only partial data retained, and will be permanently
            deleted in 30 days.
          default: false
          example: false
          readOnly: true
        optOut:
          $ref: '#/components/schemas/ContactOptOut'
        npi:
          type: string
          description: Unique 10-digit identification number issued by the Centers for Medicare and Medicaid Services for
            health care providers in the United States.
          minLength: 10
          maxLength: 10
          example: '5555555555'
        _links:
          $ref: '#/components/schemas/ContactLinks'
        dateOfBirth:
          type: string
          format: date
          description: "The date of birth of the contact.\n\n Reading and writing of this field require the `event/contacts:read-sensitive`\
            \ and `event/contacts:write-sensitive` scopes respectively."
          example: '1990-01-01'
        passportNumber:
          type: string
          description: "The passport number of the contact.\n\n Reading and writing of this field require the `event/contacts:read-sensitive`\
            \ and `event/contacts:write-sensitive` scopes respectively. This field has been deprecated. Instead, use the passport.number\
            \ field."
          example: '123456789'
          maxLength: 100
          deprecated: true
        passport:
          $ref: '#/components/schemas/Passport'
        socialSecurityNumber:
          type: string
          description: "The social security number of the contact.\n\n Reading and writing of this field require the `event/contacts:read-sensitive`\
            \ and `event/contacts:write-sensitive` scopes respectively."
          example: 123-45-6789
          maxLength: 11
        nationalIdentificationNumber:
          type: string
          example: '123456789'
          description: "The national identification number of the contact.\n\n Reading and writing of this field require the\
            \ `event/contacts:read-sensitive` and `event/contacts:write-sensitive` scopes respectively."
          maxLength: 25
        headline:
          type: string
          description: The headline of the contact's profile, which summarizes their professional experience and qualities.
          example: Marketing Director Crafting Memorable Campaigns that Engage Audiences and Elevate Brands
          maxLength: 2500
        personalWebsite:
          type: string
          description: A contact's personal website URL.
          format: uri
          example: https://www.example.com
          maxLength: 2500
        biography:
          type: string
          description: A contact's biographical writeup.
          example: I am a marketing professional with experience in event planning and brand strategy.
          maxLength: 2500
        pronouns:
          type: string
          description: Represents the preferred pronouns of a contact.
          example: he/him/she/her/they/them
          maxLength: 50
    AttendeeContactType:
      title: AttendeeContactType
      type: object
      description: Contains details related to the attendee's contact type.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the contact type
          example: 861B51EC-AA7E-475F-B38D-4C8E35C47D63
        name:
          type: string
          description: A descriptive name for the contact type
          example: VIP Member
          readOnly: true
    contact-merge:
      title: ContactMergeRequest
      description: This entity represents a request to merge one or two contacts with another 'main' contact.
      required:
      - secondaryContacts
      properties:
        secondaryContacts:
          type: array
          items:
            $ref: '#/components/schemas/uuid-property'
          minItems: 1
          maxItems: 2
          description: Id of the contact(s) to be merged to the main contact.
        conflictResolution:
          type: object
          description: Represents choices in resolving conflicts in the contacts to be merged or to optionally select fields
            to keep from a secondary contact, overriding default behavior.
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventContactId'
              description: For each event (designated by event id), choose a contact id whose linked attendee will be associated
                with the resulting merged contact. Use whenever at least two contacts exist as attendees in a single event.
            surveys:
              type: array
              items:
                $ref: '#/components/schemas/SurveyContactId'
              description: For each survey (designated by survey id), choose a contact id whose linked respondent will be
                associated with the resulting merged contact. Use whenever at least two contacts exist as respondents in a
                single survey.
            relatedContacts:
              type: string
              format: uuid
              description: The id of the contact to keep the relationships of in the resulting merged contact. Only one contact
                can be chosen, and relationships of the other contact(s) will be discarded.
            contactFields:
              type: array
              items:
                $ref: '#/components/schemas/ContactMergeField'
              description: Specify which contact to use values from for any contact field.
    ContactLinks:
      title: ContactLinks
      type: object
      description: Collection of social media links for the contact.
      properties:
        twitterUrl:
          $ref: '#/components/schemas/Link'
        facebookUrl:
          $ref: '#/components/schemas/Link'
        linkedInUrl:
          $ref: '#/components/schemas/Link'
        profilePicture:
          type: object
          description: Reference to a profile picture.
          title: Link
          required:
          - href
          readOnly: true
          properties:
            href:
              type: string
              description: The url of the contact's profile picture
              example: https://cvent.com/picture123
    DistributionListSecurityType:
      title: DistributionListSecurityType
      enum:
      - PRIVATE
      - SEMI_PRIVATE
      - PUBLIC
      type: string
      description: Type of distribution list security. For a public list, contacts can sign up themselves. For a semi-private
        list, contacts can add themselves, but a planner must approve their membership before they can receive emails. For
        a private list, only planners can add contacts. Contacts can always remove themselves from lists on the Manage Profile
        page.
    ContactOptOut:
      title: ContactOptOut
      description: Details of an opt-out for a Contact.
      type: object
      properties:
        optedOut:
          type: boolean
          default: false
          description: Used to denote if a contact has opted-out of receiving system generated emails.
          example: false
        date:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this contact was opted-out. This value can change if the contact
            opts out multiple times.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        by:
          $ref: '#/components/schemas/OptoutBy'
    ContactBulkResponseItem:
      title: ContactBulkResponseItem
      description: This entity is used to represent a single item that is returned as part of a Bulk request call.
      allOf:
      - $ref: '#/components/schemas/BulkResponseItem'
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/contact'
          - $ref: '#/components/schemas/ErrorResponse-12'
    BulkResponseItem:
      title: BulkResponseItem
      description: Represents a single item that is returned as part of a Bulk request call.
      type: object
      required:
      - status
      - data
      properties:
        data:
          type: object
          description: The data returned for a single item in the bulk request call.
          example:
            event_id: 1234
            attendee_count: 50
          additionalProperties: true
        status:
          type: integer
          description: http status code representing processing status of a single item
          example: 400
        message:
          type: string
          description: Quick description of what happened with processing
          example: Example error message.
        request:
          type: object
          description: The processed request tied to this response. This field is only sent when processing fails.
          example:
            operation: PUT
            headers:
              header1: header1Value
              header2: header2Value
            queryParams:
              param1: param1Value
              param2: param2Value
          additionalProperties: true
      additionalProperties: false
    CreateContact:
      title: CreateContact
