            message: Not found
    Conflict1:
      description: The request conflicts with current state of the target resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 409
            message: Conflict
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
