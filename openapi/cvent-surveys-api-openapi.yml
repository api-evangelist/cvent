components:
  schemas:
    questions-paginated-response:
      title: SurveyQuestionsPaginatedResponse
      description: Response include paging and collection of questions of surveys
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/question.json1'
          description: Collection of questions for surveys.
    looping-choice.json:
      title: LoopingChoice
      description: Loop Choice is the choice for which the chapter is looped. Questions in the looping chapter get repeated
        once for each choice selected in the parent question
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9463c74e-18c6-401a-a710-ae0f485bf059
          description: Loop Choice ID.
    event-survey-respondents-paginated-response:
      title: EventSurveyRespondentsPaginatedResponse
      description: Response includes paging and respondents data for a event survey
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/event-survey-respondent'
          description: Respondent information for an event survey
    respondent-chapter-reference.json:
      title: RespondentChapterReference
      description: Respondent chapter reference.
      type: object
      allOf:
      - $ref: '#/components/schemas/respondent-event-survey-reference.json/allOf/0'
      properties:
        loopingChoice:
          $ref: '#/components/schemas/looping-choice.json'
    uuid-property:
      title: UUID Property
      description: A string that has to be a format matching the industry standard uuid
      type: string
      format: uuid
      example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    surveys-paginated-response:
      title: SurveysPaginatedResponse
      description: The response from a request to get the list of surveys. This includes the paging object as well as the
        collection of surveys.
      required:
      - paging
      - data
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/paging.json'
        data:
          type: array
          items:
            $ref: '#/components/schemas/survey.json'
          description: Collection of surveys.
    respondent-chapter-reference.json-0:
      title: RespondentChapterReference
      description: Respondent chapter details for survey respondents (Event and Standalone).
      type: object
      allOf:
      - $ref: '#/components/schemas/respondent-event-survey-reference.json/allOf/0'
      properties:
        loopingChoice:
          type: object
          allOf:
          - readOnly: true
          - $ref: '#/components/schemas/looping-choice.json'
        session:
          type: object
          description: Associated session.
          properties:
            id:
              type: string
              format: uuid
              description: Session ID.
          readOnly: true
        evaluationResult:
          $ref: '#/components/schemas/evaluation-result.json'
        attempt:
          $ref: '#/components/schemas/attempt.json'
    paging.json:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/pagination-links.json'
    invitation-list-common.json:
      title: InvitationListCommon
      type: object
      description: Invitation list of respondents
      properties:
        id:
          type: string
          format: uuid
          example: 9463c74e-18c6-401a-a710-ae0f485bf059
          description: ID of the invitation list in which respondent is present.
    standard-survey-respondent:
      title: StandardSurveyRespondent
      description: Standard survey respondent.
      type: object
      allOf:
      - $ref: '#/components/schemas/event-survey-respondent/allOf/0'
      properties:
        contact:
          description: Respondent contact.
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 9463c74e-18c6-401a-a710-ae0f485bf059
              description: Contact Id of the respondent
        status:
          $ref: '#/components/schemas/respondent-status.json'
        unsubscribed:
          type: boolean
          description: Whether or not the respondent has unsubscribed from Survey
          example: false
          readOnly: true
        unsubscribedBy:
          type: string
          description: Who unsubscribed the respondent
          example: Respondent
          readOnly: true
        invitationList:
          $ref: '#/components/schemas/invitation-list-common.json'
        chapters:
          description: List of respondent chapters.
          type: array
          items:
            $ref: '#/components/schemas/respondent-chapter-reference.json'
          readOnly: true
        transactionId:
          $ref: '#/components/schemas/transaction-id-common.json'
    survey-status.json:
      title: SurveyStatus
      enum:
      - Draft
      - Active
      - Closed
      - Archived
      type: string
      description: Survey Status
      example: Active
      readOnly: true
    survey-author.json:
      title: SurveyAuthor
      description: Author of the survey
      type: object
      properties:
        firstName:
          type: string
          description: First Name of Author
          example: Vivek
        lastName:
          type: string
          description: Last Name of Author
          example: Singh
        company:
          type: string
          description: Company Name
          example: Cvent
        title:
          type: string
          description: Designation
          example: Sales Manager
        email:
          type: string
          format: email
          description: The email address of the author
          minLength: 6
          maxLength: 80
          example: dummyemail@cvent.com
    event-survey-availability.json:
      title: EventSurveyAvailability
      enum:
      - Event Registrants
      - Event Participants
      - Session Registrants
      - Session Participants
      type: string
      description: Describes the availability of the event survey
      example: Session Registrants
      readOnly: true
    text-field.json:
      title: TextField
      description: A survey text field.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Text field ID.
          readOnly: true
        text:
          type: string
          description: text Value of the Field
          example: Field value
        shortText:
          type: string
          description: Reporting value of the Category, Its like a custom abbreviation
          example: Category 1 Reporting value
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
    survey.json:
      title: Survey
      type: object
      description: 'Parent survey detail object. It can be of two types namely: ''Event'' and ''Standalone'''
      allOf:
      - title: SurveyCommon
        description: Base model with common properties for a survey.
        type: object
        allOf:
        - $ref: '#/components/schemas/response-common/allOf/0'
        properties:
          id:
            type: string
            format: uuid
            description: Id of the survey or Id of the chapter in case of event survey
            readOnly: true
            example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          title:
            type: string
            description: Title of the survey or Title of the chapter in case of event survey
            example: Demo Survey
          code:
            type: string
            description: Survey Code or Chapter Code in case of event survey
            example: NDOU2RDQH5Q
          timezone:
            type: string
            description: Timezone of the survey
            maxLength: 29
            example: America/New_York
          author:
            $ref: '#/components/schemas/survey-author.json'
          description:
            type: string
            description: Survey description
            example: This is a test survey
          closeAfter:
            type: string
            format: date-time
            description: The survey will be closed after this ISO 8601 formatted date and time.
            example: '2022-02-01T23:59:00.000Z'
      properties:
        responseCount:
          description: Count of responses.
          type: integer
          minimum: 0
          example: 10
        status:
          $ref: '#/components/schemas/survey-status.json'
        type:
          $ref: '#/components/schemas/survey-type.json'
        activateDate:
          type: string
          format: date-time
          description: The survey will be activated on this ISO 8601 formatted date and time.
          example: '2022-02-01T23:59:00.000Z'
        events:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/event.json1'
          description: List of events with which this survey is linked.
    event-survey-audience-type.json:
      title: EventSurveyAudienceType
      enum:
      - Attendee
      - Stakeholder
      - Speaker
      type: string
      description: Audience types of event surveys
      example: Attendee
      readOnly: true
    answer.json:
      title: Answer
      description: A survey answer.
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/answer-type.json'
        value:
          type: string
          description: 'Value property is used to send information like string, number and date in case of following types
            of answers only: ChoiceText, Text, Comment, Other. In case of Rank Order question, rank should be put into value.
            Refer to questions resource to get choice label or category label from their respective ids.'
          example: '1'
        choice:
          $ref: '#/components/schemas/uuid.json'
        category:
          $ref: '#/components/schemas/uuid.json'
        subCategory:
          $ref: '#/components/schemas/uuid.json'
        field:
          $ref: '#/components/schemas/uuid.json'
    pagination-links.json:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/link.json'
        self:
          $ref: '#/components/schemas/link.json'
        prev:
          $ref: '#/components/schemas/link.json'
    standard-survey-send-email-response:
      title: StandardSurveySendEmailResponse
      description: A standard survey, sent-email response.
      type: object
      properties:
        survey:
          description: Survey of response.
          type: object
          properties:
            id:
