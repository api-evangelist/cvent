openapi: 3.0.2
info:
  title: Cvent REST APIs — Exhibitor Team
  version: ea
  description: '* **Exhibitor Admin -** Exhibitor Admins are administrators that have access to the exhibitor portal. In the
    portal, they are able to complete pre-event tasks, manage their team, purchase LeadCapture (if applicable), and download
    leads. Use this API to get details for existing admins, create new admins, and update admin details.


    * **Exhibitor Booth Staff -** Exhibitor booth staff is someone that manages the frontline of the exhibitor''s booth onsite
    or virtually. Booth staff needs to be registered for the event in order to be associated with an exhibitor. Use this API
    to get details for the existing booth staff(s) for a specific exhibitor, associate new booth staff to the exhibitor, and
    delete the association of a booth staff if required.

    '
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Exhibitor Team
  description: '* **Exhibitor Admin -** Exhibitor Admins are administrators that have access to the exhibitor portal. In the
    portal, they are able to complete pre-event tasks, manage their team, purchase LeadCapture (if applicable), and download
    leads. Use this API to get details for existing admins, create new admins, and update admin details.


    * **Exhibitor Booth Staff -** Exhibitor booth staff is someone that manages the frontline of the exhibitor''s booth onsite
    or virtually. Booth staff needs to be registered for the event in order to be associated with an exhibitor. Use this API
    to get details for the existing booth staff(s) for a specific exhibitor, associate new booth staff to the exhibitor, and
    delete the association of a booth staff if required.

    '
paths:
  /events/{id}/exhibitors/{exhibitorId}/admins:
    get:
      summary: List Exhibitor Admins
      description: Retrieves a paginated list of exhibitor admins for an exhibitor within an event.
      operationId: listExhibitorAdmins
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-admins:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-admins:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      responses:
        '200':
          description: Successfully retrieved exhibitor admins.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exhibitor-admins-list-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    post:
      summary: Create Exhibitor Admin
      description: Creates an exhibitor admin for the given exhibitor.
      operationId: postExhibitorAdmin
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-admins:write
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-admins:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      requestBody:
        description: Exhibitor Admin details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/exhibitor-admin-request'
      responses:
        '201':
          description: Successfully created an Exhibitor Admin.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exhibitor-admin-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/admins/{adminId}:
    get:
      summary: Get Exhibitor Admin
      description: Gets the details of a single exhibitor admin, such as name or contact email.
      operationId: getExhibitorAdmin
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-admins:read
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-admins:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/adminId'
      responses:
        '200':
          description: Successfully retrieved details for an exhibitor admin.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exhibitor-admin-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    put:
      summary: Update Exhibitor Admin
      description: Updates a single exhibitor admin.
      operationId: updateExhibitorAdmin
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/exhibitor-admins:write
      - OAuth2.authorizationCode:
        - exhibitor/exhibitor-admins:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/adminId'
      requestBody:
        description: Exhibitor Admin details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/exhibitor-admin-request'
      responses:
        '200':
          description: Successfully updated the Exhibitor Admin.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exhibitor-admin-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/booth-staff:
    get:
      summary: List Booth Staff
      description: Gets a list of booth staff members for a given event and exhibitor id.
      operationId: listBoothStaff
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/booth-staff:read
      - OAuth2.authorizationCode:
        - exhibitor/booth-staff:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      responses:
        '200':
          description: Successfully retrieved booth staff list.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/booth-staff-list-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    post:
      summary: Create Booth Staff
      description: Associates a registered attendee as a booth staff to a specific exhibitor id within an event.
      operationId: associateBoothStaff
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/booth-staff:write
      - OAuth2.authorizationCode:
        - exhibitor/booth-staff:write
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      requestBody:
        description: Booth Staff details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/booth-staff-request'
      responses:
        '201':
          description: Successfully associated booth staff
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/booth-staff-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
  /events/{id}/exhibitors/{exhibitorId}/booth-staff/{boothstaffId}:
    get:
      summary: Get Booth Staff member
      description: Retrieves the attendee id associated with an exhibitor booth staff member.
      operationId: getBoothStaff
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/booth-staff:read
      - OAuth2.authorizationCode:
        - exhibitor/booth-staff:read
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/boothstaffId'
      responses:
        '200':
          description: Successfully retrieved details for a booth staff member.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/booth-staff-response'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
    delete:
      summary: Delete Booth Staff member
      description: Disassociate a single booth staff member from a single exhibitor.
      operationId: deleteBoothStaff
      tags:
      - Exhibitor Team
      security:
      - OAuth2.clientCredentials:
        - exhibitor/booth-staff:delete
      - OAuth2.authorizationCode:
        - exhibitor/booth-staff:delete
      parameters:
      - $ref: '#/components/parameters/id6'
      - $ref: '#/components/parameters/exhibitorId'
      - $ref: '#/components/parameters/boothstaffId'
      responses:
        '204':
          description: Successfully deleted booth staff member.
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
      externalDocs:
        description: More about OAuth2 authorization code support for administrators
        url: '#oauth2-auth-code-planner-admin'
components:
  schemas:
    Link:
      title: Link
      required:
      - href
      type: object
      description: Represents a link to a related resource.
      properties:
        href:
          type: string
          description: A url provided that can be followed for linking
          example: ?token=90c5f062-76ad-4ea4-aa53-00eb698d9262
    Event4:
      description: The Associated Event.
      title: Event
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 3db28cfc-db22-11eb-8d19-0242ac130003
          description: Event id
    exhibitor-admin-response:
      title: Exhibitor Admin
      type: object
      allOf:
      - $ref: '#/components/schemas/exhibitor-admin-request'
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Exhibitor Admin id
          readOnly: true
      description: Existing Exhibitor Admin with an id property
    booth-staff-list-response:
      title: BoothStaffListResponse
      type: object
      description: Represents the booth staff list response, with paging information and a list of booth staff.
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/booth-staff-response'
          description: List of booth staff.
    ErrorResponseBase1:
      title: ErrorResponseBase
      type: object
      description: Represents an error response with no additional details.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: The HTTP status code representing the error.
          example: 400
        message:
          type: string
          description: A brief description of the error.
          example: Bad Request
        target:
          type: string
          description: The target resource of the error.
          example: example target
    Attendee1:
      description: The associated Attendee.
      title: Attendee
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
          description: Attendee id
    OSSAudit:
      title: OSS-Audit
      description: OSS Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.This filed is deprecated.
          deprecated: true
          readOnly: true
          example: hporter
    exhibitor-admin-request:
      title: Exhibitor Admin
      type: object
      description: An object representing the exhibitor admin.
      allOf:
      - $ref: '#/components/schemas/OSSAudit'
      required:
      - exhibitor
      - email
      - firstName
      - lastName
      properties:
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
        firstName:
          type: string
          description: The first name of the exhibitor admin
          minLength: 1
          maxLength: 30
          example: John
        lastName:
          type: string
          description: The last name of the exhibitor admin
          minLength: 1
          maxLength: 30
          example: Eddy
        email:
          type: string
          format: email
          description: The email address of the exhibitor admin
          example: john.eddy@test.com
    Exhibitor:
      description: The Associated Exhibitor.
      title: Exhibitor
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          example: 4888db54-db22-11eb-8d19-0242ac130003
          description: Exhibitor id
    PaginationLinks:
      title: PaginationLinks
      type: object
      description: Represents pagination links for navigating between pages of data.
      properties:
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Paging:
      title: Paging
      required:
      - _links
      type: object
      description: Represents pagination information for a collection of resources.
      properties:
        previousToken:
          type: string
          description: The pagination token for the previous page, if one exists. You can use this token to navigate to the
            previous page of data.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        nextToken:
          type: string
          description: The pagination token for the next page. If this value is present in the response, there is another
            page of data you can fetch.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        currentToken:
          type: string
          description: The pagination token for the current page.
          example: 1a2b3c4d5e6f7g8h9i10j11k
        limit:
          type: integer
          description: The number of records to return on the page. Not to exceed 200.
          example: 100
        totalCount:
          type: integer
          description: The total number of records available. This field may return blank, even if there are more records.
            To confirm if there are more records, check the `nextToken` field.
          example: 2
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    booth-staff-response:
      title: Booth Staff
      type: object
      description: Booth staff with an associated ID.
      allOf:
      - $ref: '#/components/schemas/booth-staff-request'
      properties:
        id:
          type: string
          format: uuid
          example: 4e0f5152-515e-11ee-be56-0242ac120002
          description: ID of an exhibitor booth staff member.
          readOnly: true
    exhibitor-admins-list-response:
      title: ExhibitorAdminsListResponse
      type: object
      description: Exhibitor Admins List Response schema
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        data:
          type: array
          items:
            $ref: '#/components/schemas/exhibitor-admin-response'
          description: List of exhibitor admins.
    Audit:
      title: Audit
      description: Audit information
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was created.
          readOnly: true
          example: '2017-01-02T02:00:00Z'
        createdBy:
          type: string
          description: The identifier of the user that created this record.
          readOnly: true
          example: hporter
        lastModified:
          type: string
          format: date-time
          description: The ISO 8601 zoned date time when this record was updated.
          readOnly: true
          example: '2019-02-12T03:00:00Z'
        lastModifiedBy:
          type: string
          description: The identifier of the user that last updated this record.
          readOnly: true
          example: hporter
    booth-staff-request:
      title: Booth Staff
      description: A JSON schema representing booth staff.
      required:
      - attendee
      - event
      - exhibitor
      type: object
      allOf:
      - $ref: '#/components/schemas/Audit'
      properties:
        attendee:
          $ref: '#/components/schemas/Attendee1'
        event:
          $ref: '#/components/schemas/Event4'
        exhibitor:
          $ref: '#/components/schemas/Exhibitor'
    ErrorResponse-12:
      title: ErrorResponse
      description: Represents an error response with additional details of cascading error messages.
      allOf:
      - $ref: '#/components/schemas/ErrorResponseBase1'
      type: object
      required:
      - code
      - message
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseBase1'
          description: Additional details of cascading error messages.
  responses:
    NotFound1:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 404
            message: Not found
    BadRequest1:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 400
            message: Bad Request
    TooManyRequests1:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 429
            message: Limit Exceeded
    Unauthorized1:
      description: Bad or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 401
            message: Unauthorized
    Forbidden1:
      description: You do not have access to the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse-12'
          example:
            code: 403
            message: Access Forbidden
  parameters:
    adminId:
      in: path
      name: adminId
      description: ID of an exhibitor admin.
      required: true
      schema:
        type: string
        format: uuid
        example: 04ca6ae2-0dc3-487b-953e-86d6abbdf7d3
    token:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    boothstaffId:
      in: path
      name: boothstaffId
      description: ID of a booth staff member.
      required: true
      schema:
        type: string
        format: uuid
        example: 4e0f5152-515e-11ee-be56-0242ac120002
    id6:
      in: path
      name: id
      description: ID of an event.
      required: true
      schema:
        type: string
        format: uuid
        example: 3db28cfc-db22-11eb-8d19-0242ac130003
    exhibitorId:
      in: path
      name: exhibitorId
      description: ID of an exhibitor.
      required: true
      schema:
        type: string
        format: uuid
        example: 4888db54-db22-11eb-8d19-0242ac130003
    limit:
      name: limit
      in: query
      description: The maximum number of records to return per page.
      style: form
      explode: true
      schema:
        maximum: 200
        minimum: 1
        type: integer
        default: 100
        example: 100
  securitySchemes:
    OAuth2.clientCredentials:
      type: oauth2
      description: OAuth2 Client Credentials Flow.
      flows:
        clientCredentials:
          tokenUrl: https://api-platform.cvent.com/ea/oauth2/token
          scopes:
            account/hooks:delete: Allows the deletion of hooks.
            account/hooks:read: Allows the reading of hooks.
            account/hooks:write: Allows the creation/updation of hooks.
            account/user-groups:delete: Allows deletion for user groups
            account/user-groups:read: Allows the reading of user groups
            account/user-groups:write: Allows the writing of user groups
            account/users:delete: Allows the deletion of User
            account/users:read: Allows the reading of User, User Group
            account/users:write: Allows the creation/updating of User
            appointments/appointment-attendees:read: Allows the reading of appointment attendees and their related entities.
            appointments/appointment-events:read: Allows the reading of appointment events and their related entities.
            appointments/appointment-types:read: Allows the reading of appointment types and their related entities.
            appointments/appointments:read: Allows the reading of appointment and their related entities.
            appointments/appointments:write: Allows the writing of appointments and their related entities.
            appointments/available-times:read: Allows the reading of availability times.
            appointments/locations:read: Allows the reading of appointment locations and their related entities.
            attendee-insights/attendee-insights:read: Allows the reading of engagement scores (attendee insights).
            attendee-insights/scores:read: Allows the reading of scores.
            attendee-insights/stats:read: Allows the reading of engagement score (attendee insight) stats.
            budget/budget-items:delete: Allows the deletion of budget items
            budget/budget-items:read: Allows the reading of all budget items
            budget/budget-items:write: Allows creation/updation of budget item
            budget/budget-totals:read: Allows the reading of all event budget totals
            budget/budget-vendors:read: Allows reading of account-level budget vendors.
            budget/cards:read: Allows the reading of cards
            budget/currency-conversion-rate:delete: Allows deletion of currency conversion rate for currency.
            budget/currency-conversion-rate:read: Allows reading of currency conversion rate for currency.
            budget/currency-conversion-rate:write: Allows creation/update of currency conversion rate for currency.
            budget/payments:delete: Allows deletion of payments.
            budget/payments:read: Allows reading of payment for budget item.
            budget/payments:write: Allows creation of payment in a budget item.
            budget/transactions:delete: Allows delete card transactions.
