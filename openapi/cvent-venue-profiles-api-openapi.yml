        - `GOLF_COURSE` — Golf Course

        - `HOTEL` — Hotel

        - `INTERNAL_VENUE` — Internal Venue

        - `LUXURY_HOTEL` — Luxury Hotel

        - `MOVIE_THEATRE` — Movie Theatre

        - `RESORT` — Resort

        - `RESTAURANT` — Restaurant

        - `SPECIAL_EVENT_VENUE` — Special Event Venue'
