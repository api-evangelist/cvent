openapi: 3.0.2
info:
  title: Cvent REST APIs — Venue Profiles
  version: ea
  description: Manage venue profile details including type, contact information, address, and other venue properties.
  contact:
    name: Cvent Development Platform
    url: https://developers.cvent.com/
externalDocs:
  description: Cvent REST API documentation
  url: https://developers.cvent.com/documentation
servers:
- url: https://api-platform.cvent.com/ea
- url: https://api-platform-eur.cvent.com/ea
tags:
- name: Venue Profiles
  description: Manage venue profile details including type, contact information, address, and other venue properties.
paths:
  /venues/{venueId}/details:
    put:
      operationId: updateVenueDetails
      summary: Update Venue Details
      description: Update venue details for the specified venue, replacing the existing venue details data.
      security:
      - OAuth2.authorizationCode:
        - venue/venue-details:write
      - OAuth2.clientCredentials:
        - venue/venue-details:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/existingVenueDetails'
      tags:
      - Venue Profiles
      responses:
        '200':
          description: Successfully updated the venue details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existingVenueDetails'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    patch:
      operationId: patchVenueDetails
      summary: Patch Venue Details
      description: 'Partially updates the specified venue''s details using JSON Merge Patch, as defined in [RFC 7396](https://www.rfc-editor.org/rfc/rfc7396.html).


        - Only fields present in the request body are updated; omitted fields remain unchanged.

        - Set a field to `null` to unset it.

        - If any part of the patch fails, the entire request will fail.


        **Array Handling:**

        - Arrays (`locationTypes`) are treated as **full replacements**, not partial updates.

        - If an array property is not included in the payload, no updates are made to that field.

        - If an empty array is sent, it replaces the existing array with an empty array.

        '
      security:
      - OAuth2.authorizationCode:
        - venue/venue-details:write
      - OAuth2.clientCredentials:
        - venue/venue-details:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/venueDetailsPatch'
      tags:
      - Venue Profiles
      responses:
        '200':
          description: Successfully updated the venue details. The response contains only the fields that were provided in
            the request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/venueDetailsPatch'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/details/overview:
    get:
      operationId: getVenueDetailsOverview
      summary: Get Venue Details Overview
      description: Retrieve an overview of venue details for the specified venue.
      security:
      - OAuth2.authorizationCode:
        - venue/venue-details-overview:read
      - OAuth2.clientCredentials:
        - venue/venue-details-overview:read
      parameters:
      - $ref: '#/components/parameters/venueId'
      tags:
      - Venue Profiles
      responses:
        '200':
          description: Successfully retrieved the venue details overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/venueDetailsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
  /venues/{venueId}/facility:
    put:
      operationId: updateVenueFacility
      summary: Update Venue Facility
      description: 'Update the facility information for the specified venue, replacing all existing values with those provided
        in the request body.


        Field applicability varies by venue type:

        - Most facility information fields do not apply to CVB/DMC or Restaurant venues.

        '
      security:
      - OAuth2.authorizationCode:
        - venue/venue-facility:write
      - OAuth2.clientCredentials:
        - venue/venue-facility:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/existingVenueFacility'
      tags:
      - Venue Profiles
      responses:
        '200':
          description: Successfully updated the venue facility information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/existingVenueFacility'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
    patch:
      operationId: patchVenueFacility
      summary: Patch Venue Facility
      description: 'Partially update the facility information for the specified venue using JSON Merge Patch, as defined in
        [RFC 7396](https://www.rfc-editor.org/rfc/rfc7396.html).


        - Only fields present in the request body are updated; omitted fields remain unchanged.

        - Set a field to `null` to unset it.

        - If any part of the patch fails, the entire request will fail.

        - `proximityFromAirport.unit` is required when `proximityFromAirport.distance` is provided.


        Field applicability varies by venue type:

        - Most facility information fields do not apply to CVB/DMC or Restaurant venues.

        '
      security:
      - OAuth2.authorizationCode:
        - venue/venue-facility:write
      - OAuth2.clientCredentials:
        - venue/venue-facility:write
      parameters:
      - $ref: '#/components/parameters/venueId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/venueFacilityPatch'
      tags:
      - Venue Profiles
      responses:
        '200':
          description: Successfully updated the venue facility information. The response contains only the fields that were
            provided in the request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/venueFacilityPatch'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '404':
          $ref: '#/components/responses/NotFound1'
        '429':
          $ref: '#/components/responses/TooManyRequests1'
components:
  schemas:
    existingVenueDetails:
      title: ExistingVenueDetails
      description: An existing venue details model with read-only generated properties.
      type: object
      required:
      - id
      - name
      allOf:
      - $ref: '#/components/schemas/venueDetails'
      properties:
        id:
          type: string
          format: uuid
          description: Venue ID.
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: Venue name.
          readOnly: true
          minLength: 1
          maxLength: 100
          example: Vienna Wolf Trap Hotel
        metroArea:
          type: string
          description: Metro area name. Populated once the venue is approved.
          readOnly: true
          example: Washington DC Metro
    VenueID:
      title: Venue ID
      description: A unique identifier for a venue
      type: string
      format: uuid
      example: 6bb0e2db-861f-46e3-a923-eb4d959ffa00
