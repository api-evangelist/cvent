    venueFacilityPatch:
      title: VenueFacilityPatch
      description: Partial update payload for venue facility information. Only fields present in the request body are updated;
        omitted fields remain unchanged. Set leaf fields to `null` to unset them. For grouped objects, update or clear each
        child field explicitly instead of setting the entire group to `null`. Field applicability varies by venue type; values
        supplied for fields that do not apply to the venue's type will be rejected.
      type: object
      properties:
        numberOfMeetingRooms:
          type: integer
          nullable: true
          description: Total number of meeting rooms at the venue.
          minimum: 0
          maximum: 10000
          example: 25
        space:
          type: object
          description: Facility space measurements at the venue.
          properties:
            unitOfMeasurement:
              type: string
              allOf:
              - $ref: '#/components/schemas/MeasurementUnit'
              nullable: true
            totalMeetingRoomSpace:
              type: integer
              nullable: true
              description: Total meeting room space at the venue.
              minimum: 0
              maximum: 99999999
              example: 50000
            totalExhibitSpace:
              type: integer
              nullable: true
              description: Total exhibit space at the venue.
              minimum: 0
              maximum: 99999999
              example: 75000
        sleeping:
          type: object
          description: Sleeping room inventory at the venue.
          properties:
            totalRooms:
              type: integer
              nullable: true
              description: Total number of sleeping rooms at the venue.
              minimum: 0
              maximum: 10000
              example: 350
            suites:
              type: integer
              nullable: true
              description: Total number of suites at the venue.
              minimum: 0
              maximum: 10000
              example: 20
            singleRooms:
              type: integer
              nullable: true
              description: Total number of single-occupancy rooms at the venue.
              minimum: 0
              maximum: 10000
              example: 200
            doubleRooms:
              type: integer
              nullable: true
              description: Total number of double-occupancy rooms at the venue.
              minimum: 0
              maximum: 10000
              example: 130
        singleRate:
          type: object
          description: Published rate range for single-occupancy rooms, expressed in the venue's configured currency.
          properties:
            low:
              type: number
              nullable: true
              description: Lowest published rate for a single-occupancy room.
              minimum: 0
              maximum: 999999999
              example: 129.99
            high:
              type: number
              nullable: true
              description: Highest published rate for a single-occupancy room.
              minimum: 0
              maximum: 999999999
              example: 249.99
        doubleRate:
          type: object
          description: Published rate range for double-occupancy rooms, expressed in the venue's configured currency.
          properties:
            low:
              type: number
              nullable: true
              description: Lowest published rate for a double-occupancy room.
              minimum: 0
              maximum: 999999999
              example: 149.99
            high:
              type: number
              nullable: true
              description: Highest published rate for a double-occupancy room.
              minimum: 0
              maximum: 999999999
              example: 299.99
        taxRate:
          type: number
          nullable: true
          description: Tax rate applied at the venue, expressed as a percentage.
          minimum: 0
          maximum: 999999999
          example: 8.5
        occupancyRate:
          type: number
          nullable: true
          description: Occupancy rate at the venue, expressed as a percentage.
          minimum: 0
          maximum: 999999999
          example: 75.5
        yearBuilt:
          type: integer
          nullable: true
          description: Four-digit year the venue was built.
          minimum: 0
          maximum: 9999
          example: 1998
        yearRenovated:
          type: integer
          nullable: true
          description: Four-digit year the venue was last renovated.
          minimum: 0
          maximum: 9999
          example: 2021
        proximityFromAirport:
          type: object
          description: Distance from the nearest airport. `unit` is required when `distance` is provided.
          properties:
            distance:
              type: number
              nullable: true
              description: Distance from the nearest airport, expressed in `unit`. Up to four digits.
              minimum: 0
              maximum: 9999
              example: 12.5
            unit:
              type: string
              allOf:
              - $ref: '#/components/schemas/DistanceMeasurementUnit'
              nullable: true
        restrictions:
          type: string
          nullable: true
          description: Free-form description of any facility restrictions at the venue.
          maxLength: 2500
          example: No outside food or beverage permitted. Music must end by 11 PM.
        maximumCapacity:
          type: object
          description: 'Maximum attendee capacity at the venue. Applicable only to venue types: Aquarium/Zoo, Arena/Stadium,
            Banquet Facility, Bar/Club, Corporate Office Space, Educational Facility, Entertainment Venue, Gallery/Museum,
            Golf Course, Movie Theatre, and Special Event Venue.'
          properties:
            seated:
              type: integer
              nullable: true
              description: Maximum seated capacity at the venue.
              minimum: 0
              maximum: 10000
              example: 500
            standing:
              type: integer
              nullable: true
              description: Maximum standing capacity at the venue.
              minimum: 0
              maximum: 10000
              example: 800
        eventInsurance:
          type: string
          allOf:
          - $ref: '#/components/schemas/EventInsurance'
          nullable: true
