- slug: cvent-salesforce
  label: Sync Cvent attendees to Salesforce contacts
  partner: salesforce
  category: CRM
  use_case: When a Cvent attendee is added or updated for an event, upsert the matching Salesforce Contact (by email)
    with the latest registration, session, and engagement signal so reps see event activity in the timeline.
  source: curated
  status: pending-generation
  arazzo: null
- slug: cvent-hubspot
  label: Push Cvent registrations to HubSpot contacts and deals
  partner: hubspot
  category: CRM
  use_case: When a Cvent registration is captured, upsert the corresponding HubSpot Contact and attach an event-attended
    Deal so sales pipeline reflects in-person and virtual touchpoints.
  source: curated
  status: pending-generation
  arazzo: null
- slug: cvent-marketo
  label: Forward Cvent attendee activities into Marketo programs
  partner: marketo
  category: Marketing automation
  use_case: Stream Cvent attendee status changes (registered, attended, no-show) into Marketo as Program Member
    Status updates so nurture flows fire on real event behavior.
  source: curated
  status: pending-generation
  arazzo: null
