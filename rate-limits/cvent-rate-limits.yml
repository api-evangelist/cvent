specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Cvent
providerId: cvent
created: '2026-05-04'
modified: '2026-09-07'
generated: '2026-09-07'
method: searched
source: https://developers.cvent.com/documentation (Rate Limits section of the published OpenAPI info.description);
  https://developers.cvent.com/docs/rest-api/guides/handling-rate-limits; https://github.com/cvent/rest-sdks/blob/main/overlays/retries_overlay.yaml
note: Replaces a 2026-05-04 bulk-sweep scaffold whose tier names (free/professional/enterprise) and numbers (10
  rpm, 1,000/month) were invented. The values below are Cvent’s published usage tiers.
tags:
- Event Management
- Hospitality
- REST API
- Rate Limiting
- Quotas
- Throttling
description: Published Cvent REST API usage tiers, per-second throttling, burst ceilings, response headers and 429
  semantics.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  note: Cvent documents these three response headers on every response. It does NOT document Retry-After or the
    RFC 9238 RateLimit-* family.
responseCodes:
  throttled: 429
  quotaExceeded: 429
  disambiguation: '429 is overloaded: message "Too Many Requests" = per-second throttle (retry with backoff); message
    "Limit Exceeded" = daily quota exhausted (do not retry until after the reset). The two are only separable by
    reading the body message — Cvent’s own SDK retry overlay excludes 429 from automatic retry for exactly this
    reason.'
introspection:
  usage: GET /ea/usage
  tier: GET /ea/usage/tier
  note: The API exposes its own consumption and tier, so an agent can check quota before spending it.
limits:
- tier: free
  name: Free — daily calls
  scope: per-account
  metric: requests_per_day
  limit: 1000
  timeFrame: day
  applies:
  - Cvent Platform REST API
  domains: &id001
  - https://api-platform.cvent.com
  - https://api-platform-eur.cvent.com
- tier: free
  name: Free — calls per second
  scope: per-account
  metric: requests_per_second
  limit: 2
  burst: 1
  timeFrame: second
  applies:
  - Cvent Platform REST API
  domains: *id001
- tier: standard
  name: Standard — daily calls
  scope: per-account
  metric: requests_per_day
  limit: 15000
  timeFrame: day
  applies:
  - Cvent Platform REST API
  domains: *id001
- tier: standard
  name: Standard — calls per second
  scope: per-account
  metric: requests_per_second
  limit: 10
  burst: 10
  timeFrame: second
  applies:
  - Cvent Platform REST API
  domains: *id001
- tier: premium
  name: Premium — daily calls
  scope: per-account
  metric: requests_per_day
  limit: 500000
  timeFrame: day
  applies:
  - Cvent Platform REST API
  domains: *id001
- tier: premium
  name: Premium — calls per second
  scope: per-account
  metric: requests_per_second
  limit: 25
  burst: 25
  timeFrame: second
  applies:
  - Cvent Platform REST API
  domains: *id001
- tier: legacy-soap
  name: SOAP API — daily calls per organization
  scope: per-organization
  metric: requests_per_day
  limit: 10000
  timeFrame: day
  applies:
  - Cvent SOAP API (Legacy)
  domains:
  - https://api.cvent.com
  - https://api-eur.cvent.com
  source: https://developers.cvent.com/docs/legacy-api/soap-api/framework
  note: Midnight-to-midnight Eastern Time; DescribeGlobal returns the current call count and limit.
policies:
- name: Quota reset
  description: Daily quota resets at 12 midnight GMT (+0). Every request counts against quota, including requests
    that return 429.
- name: Backoff strategy
  description: Cvent documents exponential backoff starting at 2 seconds plus 1–1000 ms jitter, doubling to a 16-second
    ceiling, for a maximum of 5 attempts; then stop and log.
- name: Tier upgrade
  description: Every account starts on the Essentials access tier; upgrades are arranged through a Cvent representative,
    not self-serve.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
